# 독일·작센 주 공휴일 — 고정 날짜 6 건.
#
# 근거: Gesetz über Sonn- und Feiertage im Freistaat Sachsen (SächsSFG) vom 10. November 1992
# (SächsGVBl. 1992 Nr. 35 S. 536) § 1 Abs. 1 — "(1) Gesetzliche Feiertage sind: Neujahr (1. Januar),
# Karfreitag, Ostermontag, Tag der Arbeit (1. Mai), Christi Himmelfahrt, Pfingstmontag, Fronleichnam
# (nur in den vom Staatsministerium des Innern durch Rechtsverordnung bestimmten Regionen), Tag der
# Deutschen Einheit (3. Oktober), Reformationsfest (31. Oktober), Buß- und Bettag, 1. Weihnachtstag
# (25. Dezember), 2. Weihnachtstag (26. Dezember)." — 번호 없는 열거 12 건. 이 피드는 7번째
# (Fronleichnam, 지정 지역만)를 뺀 11 건을 싣는다. 고정 날짜는 열거 1·4·8·9·11·12번째, 부활절 이동
# 넷(2·3·5·6번째)은 easter_holidays.yaml, Buß- und Bettag(10번째)는 totensonntag_holidays.yaml 에
# 있다. 전국 공통 9 건에 Reformationsfest(31. 10.)와 Buß- und Bettag 가 더해진다.
#
# --- 현행 자구의 출처 — 통합본(2차) ---
# REVOSax(Sächsische Staatskanzlei) https://www.revosax.sachsen.de/vorschrift/3997-SaechsSFG —
# 「Rechtsbereinigt mit Stand vom 7. Mai 2025」 「Fassung gültig ab: 7. Mai 2025」, 「zuletzt durch das
# Gesetz vom 23. April 2025 (SächsGVBl. S. 146) geändert」. 2026-11-18 열람. 통합본 PDF
# (/vorschrift_gesamt/3997/48138.pdf, 53,502 B)는 그날 세 번 받아 바이트가 같았다.
# REVOSax 의 § 1 Abs. 1 에는 번호가 없다(HTML 은 줄바꿈으로만 나눈다) — 그래서 「열거 n번째」 로 든다.
# 역사판 여섯(1992-11-21 – 현재) 중 § 1 Abs. 1 이 바뀐 것은 2002-07-03 판 하나다 — Art. 4 Nr. 1
# 「In § 1 Abs. 1 wird das Wort „Reformationstag" durch das Wort „Reformationsfest" ersetzt.」
# (Gesetz vom 6. Juni 2002, SächsGVBl. 2002 Nr. 9 S. 168, 170). 2020 이후 유효한 두 판
# (2013-02-10 – 2025-05-06, 2025-05-07 –)의 § 1 Abs. 1 은 같다.
#
# --- 공포본 — 온라인으로 닿는 것 ---
# 없다. 원법(1992 Nr. 35)은 관보 발행사(SV SAXONIA Verlag)의 판매 사이트 https://www.recht-sachsen.de
# 에서 찾지 못했고 보관 상품은 1999 년부터다. 2002 Nr. 9 는 그 유료 보관 상품(1999–2018) 안에만 있다.
# 사지 않는다(사람의 결정 S4). 2025 Nr. 6 S. 146(§ 2·§ 6 개정)은 무료 미리보기로 읽었지만 § 1 을
# 건드리지 않는다.
#
# --- 일회성 지정 — 수록 항목 없음 ---
# SächsSFG 에는 일회성 지정을 수권하는 조항이 없다 — 현행 통합본 전문에 「einmalig」 도 「erklär」
# 도 없다(MV § 2 Abs. 3·HB § 12 b)·SL 1976 § 2 Abs. 2 같은 조항이 없다). 2020 이후의 지정은 찾지 못함:
# - SächsGVBl. 호의 목차 제목(발행사 판매 사이트 — 2024–2026 은 상품 화면의 목차, 2021 Nr. 15 – 2023
#   은 무료 미리보기 1 쪽의 목차, 2026-11-18)에서 Feiertag·Gedenktag·einmalig·Bettag·Arbeitsruhe·
#   SächsSFG 의 적중은 둘 — 2025 Nr. 6(§ 2 Gedenktag 개정)과 2022 Nr. 25(일회성 난방비 보조금).
#   공휴일 지정이 아니다.
# - 목차를 얻지 못한 호: 2020 Nr. 1–40·38a·39a 와 2021 Nr. 1–14 — 상품 화면에 목차도 미리보기도 없다.
# - REVOSax 빠른 검색 「Feiertag」(67 건)에서 Erlassdatum 2020 이후 27 건은 다른 법의 언급뿐이다. 이
#   검색 화면에는 숨은 필드 search_request[valid_day](검색한 날, 2026-11-18)가 있다 — 그날 유효한
#   규범을 본다.
# [추론] 날이 지나 효력을 잃은 일회성 선언이 있었다면 REVOSax 검색에 들지 않는다. 수권 조항이 없으니
# 일회성 공휴일은 법률로만 생길 것이고, 2020 이후 SächsSFG 를 바꾼 것은 2025 Nr. 6 하나다. 이 추론은
# 공백을 줄이지만 지우지 않는다. source 에 적지 않는다.
# 조사 기록: docs/research/report_sn_prep.md 와 같은 이름의 폴더, docs/research/report_de_sn_impl/
# (이 표를 세울 때의 확인).
#
# --- verified ---
# 원문을 직접 본 항목만 true. 11 건 전건 false — § 1 Abs. 1 의 자구가 1992 원법과 2002 개정에
# 의존하고 둘 다 온라인에서 받지 못했다(S4). 각 항목 source 는 열거 순번의 자구와 REVOSax 서지를,
# source_todo 는 관보 접근의 관측 사실을 적는다. 날짜는 feiertage-api 2026 SN(12 건 중 hinweis 가
# 붙은 Fronleichnam 을 뺀 11 건)으로 대조했다. python-holidays(pyproject 에 고정) DE(subdiv='SN') 와의
# 연도별 대조는 tests/test_de_sn_feed.py::test_the_dates_agree_with_python_holidays_sn 이 2020~2031 로
# 돈다.
#
# --- 범위 밖 ---
# Fronleichnam(§ 1 Abs. 1 열거 7번째 — 내무부 Rechtsverordnung 이 정한 지역만), § 2 의 Gedenk- und
# Trauertage(Volkstrauertag·Totensonntag·8. Mai), § 2a 의 örtlicher Gedenktag(지자체 조례), § 3 의
# religiöse Feiertage(예배 참석의 결석·결근권만)는 공휴일 피드에 싣지 않는다(사람의 결정 S7).
#
# --- 대체공휴일(이동) 규칙이 없다 ---
# § 1 에 이동 조항이 없다. 2020~2031 에서 고정 날짜가 일요일과 겹쳐도(2021 10-03·10-31·12-26,
# 2022 05-01·12-25, 2023 01-01, 2027 10-03·10-31·12-26) 보상 휴일이 없다 — 위 테스트가 해마다
# python-holidays SN 과 날짜 집합이 같음을 단언한다. 그 날짜 그대로 싣는다.
#
# --- key 규약 ---
# UID 의 token 이 된다. 한 번 나가면 바꿀 수 없다(core/ics.py 의 UID 절).
# rules/de_be/solar_holidays.yaml 의 규약과 같다. 이 표의 key 는 전부 기존 확립값이다 —
# Reformationsfest 의 key 는 reformationstag(de_bb·de_hb·de_hh·de_mv·de_ni·de_sh 와 같다; 이름이
# 아니라 같은 날의 같은 항목이라 같은 key). 새 key buss_und_bettag 의 승인은 totensonntag_holidays.yaml
# 머리 주석. 발행되는 UID 의 token 은 key 앞에 "de_sn-" 가 붙는다(rules/de_sn/feed.py).
#
# --- name ---
# SUMMARY 에 그대로 실린다. 조문 표기에서 끝의 괄호 날짜만 뺐다 — 관사는 원래 없다. 9번째는 조문대로
# "Reformationsfest" 다. 원문은 각 항목 source 에 그대로 남긴다.
#
# --- 필드 ---
# 로더가 닫힌 집합으로 검사한다(rules/de_sn/feed.py). 모르는 필드·최상위 키·중복 키는 로드가 멈춘다.
# verified·source_todo 는 피드에 나가지 않는다.

# --- scope ---
# bundesweit | land. 전국 공통 9 건은 bundesweit, 나머지(일회성 포함)는 land.
# 9 건의 근거: feiertage-api 2025·2026 16 주 교집합 실측 — API 의 NATIONAL 키·
# rules/de 의 YAML 과 삼중 일치(실측 요지는 tests/test_de_scope.py 머리 docstring,
# 고정은 같은 파일의 test_bundesweit_keys_equal_the_nationwide_keys). DESCRIPTION 첫
# 줄이 이 값에서 나온다. 로더가 닫힌 집합으로 검사한다.

