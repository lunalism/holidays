# 독일·작센 주 공휴일 — Totensonntag 기준 1 건(Buß- und Bettag).
#
# § 1 Abs. 1 열거 10번째 "Buß- und Bettag," — 조문은 이름만 들고 날짜를 정하지 않는다(현행 통합본과
# 역사판 여섯 모두). 같은 법 § 2 는 "der Totensonntag (letzter Sonntag vor dem 1. Advent)" 로 정의한다
# (2025 공포본 SächsGVBl. 2025 Nr. 6 S. 146 에서도 같은 자구로 읽었다).
# 날짜 관행은 작센 주의회 청원위원회 보고서 2023(PDF 68 쪽)의 문장이다 — "Der Landesgesetzgeber
# entschied sich dafür, den Buß- und Bettag als gesetzlichen Feiertag am letzten Mittwoch vor dem
# Totensonntag beizubehalten." 주소·열람일은 항목 source 에 있다. 법률 조문이 아니라 주의회 위원회의
# 간행물이다.
# 교차 확인(근거 아님): Hessen GVBl. 1971 I Nr. 36 S. 344 § 1 은 "der Buß- und Bettag (Mittwoch vor dem letzten Sonntag nach Trinitatis)" 와 "Der letzte Sonntag nach Trinitatis ist Totensonntag." 를 함께 적었다.
#
# --- totensonntag_offset (사람의 결정 S2) ---
# Totensonntag 로부터의 날수(정수)다. Totensonntag 는 rules/de_sn/feed.py 가 § 2 의 정의대로 센다 —
# 대림절 첫째 주일(11월 27일–12월 3일의 일요일)의 7 일 전. Buß- und Bettag 는 −4(그 앞 수요일).
# 이름은 기준일을 그대로 든다 — 부활절 표의 easter_offset 과 짝이고, 기준일(Totensonntag)이 근거
# 문장 둘(§ 2 의 정의, 주의회 문장)에 같은 낱말로 나온다. 1990–2100 에서 이 날은 늘 수요일이고
# 11월 16–22일이며 「11월 23일보다 엄격히 앞선 마지막 수요일」 과 같다(tests/test_de_sn_feed.py).
#
# --- key 승인 ---
# buss_und_bettag 는 이 피드에서 처음 쓰는 key 이고 사람이 승인했다(2026-11-18, 사람의 결정 S1).
# rules/de/solar_holidays.yaml 의 key 규약이 예고한 값이다(ß → ss). 발행 UID 는
# {날짜}-de_sn-buss_und_bettag@holidays.lunalism.com 이고 한 번 나가면 바꿀 수 없다.
#
# key·name·verified 규약과 현행 자구의 출처·공포본 경계·일회성 지정 확인 범위는 solar_holidays.yaml
# 머리 주석과 같다. verified: false + source_todo 다.

# --- scope ---
# bundesweit | land. 전국 공통 9 건은 bundesweit, 나머지(일회성 포함)는 land.
# Buß- und Bettag 는 작센에만 있어 land 다 — 주 피드 교집합 == de.ics 검사(tests/test_de_be_feed.py)에
# 들지 않는다. DESCRIPTION 첫 줄이 이 값에서 나온다. 로더가 닫힌 집합으로 검사한다.

holidays:
  - key: buss_und_bettag
    name: Buß- und Bettag
    scope: land
    totensonntag_offset: -4
    verified: false
    source: >-
      SächsSFG § 1 Abs. 1, 열거 10번째 'Buß- und Bettag' — REVOSax 통합본
      https://www.revosax.sachsen.de/vorschrift/3997-SaechsSFG ('Rechtsbereinigt mit Stand vom 7. Mai
      2025', 'Fassung gültig ab: 7. Mai 2025', 2026-11-18 열람). 조문은 이 날의 이름만 들고 날짜를 정하지 않는다. 같은 법 § 2 는
      'der Totensonntag (letzter Sonntag vor dem 1. Advent)' 로 정의한다. 날짜 관행은 작센 주의회 청원위원회 보고서 2023 의 문장이다 —
      'Der Landesgesetzgeber entschied sich dafür, den Buß- und Bettag als gesetzlichen Feiertag am
      letzten Mittwoch vor dem Totensonntag beizubehalten.' (Sächsischer Landtag,
      https://www.landtag.sachsen.de/download/publikationen/SLT_BR_Petitionsbericht_2023_Web_PDFUA.pdf,
      PDF 68 쪽, 2026-11-18 열람). 그래서 Totensonntag 4 일 전의 수요일이고, 해마다 11월 16–22일에 든다. 2026-11-18 은
      feiertage-api 2026 SN 대조 일치
    source_todo: >-
      공포본을 받지 못했다. 원법 SächsGVBl. 1992 Nr. 35 S. 536 은 온라인에 없다 — 관보 발행사의 판매 사이트
      https://www.recht-sachsen.de 에서 「Heft 35/1992」 검색은 결과가 없고, 보관 상품은 'Archivabo zum Sächsisches Gesetz-
      und Verordnungsblatt Jahrgänge 1999 - 2018' 로 1999 년부터다. § 1 Abs. 1 을 바꾼 2002 Nr. 9 S. 168, 170 은 그
      유료 보관 상품 안에만 있다(2026-11-18 관찰).
