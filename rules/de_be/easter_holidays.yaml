# 독일·베를린 주 공휴일 — 부활절 기준 이동 4 건.
#
# easter_offset 은 부활절 일요일(Ostersonntag)로부터의 날수다. 부활절 자체는
# rules/de_be/feed.py 가 python-dateutil 의 easter() 로 계산한다(rules/de 와
# 같은 계산기, 같은 근거).
#
# 베를린은 Fronleichnam(+60)·Ostersonntag(0)·Pfingstsonntag(+49)이 없다 —
# § 1 Abs. 1 의 열거에 없다.
#
# key·name·verified 규약은 solar_holidays.yaml 머리 주석과 같다. name 은
# 조문 표기라 de.ics 의 "Christi Himmelfahrt" 가 여기서는 "Himmelfahrtstag" 다.

# --- scope ---
# bundesweit | land. 전국 공통 9 건은 bundesweit, 나머지(일회성 포함)는 land.
# 9 건의 근거: feiertage-api 2025·2026 16 주 교집합 실측 — API 의 NATIONAL 키·
# rules/de 의 YAML 과 삼중 일치(/tmp/report_bundesweit.md). DESCRIPTION 첫 줄이
# 이 값에서 나온다. 로더가 닫힌 집합으로 검사하고, tests/test_de_scope.py 가
# bundesweit key 집합 == rules/de key 집합을 고정한다.

holidays:
  - key: karfreitag
    name: Karfreitag
    scope: bundesweit
    easter_offset: -2
    verified: false
    source: >-
      umwelt-online 현행판 § 1 Abs. 1 Nr. 3 + berlin.de 공식 안내 열거 +
      feiertage-api 2026 날짜 대조 10/10
    source_todo: 공식 포털 gesetze.berlin.de 열람 또는 관보 원본

  - key: ostermontag
    name: Ostermontag
