# 독일·베를린 주 공휴일 — 고정 날짜 6 건.
#
# 근거: Gesetz über die Sonn- und Feiertage (Berlin) § 1 Abs. 1. 전국 공통 5 건에
# Frauentag(8. März, 2019-01-30 개정 GVBl. 2019 Nr. 3 S. 22 로 도입)이 더해진다.
#
# --- 대체공휴일(이동) 규칙이 없다 ---
# § 1 에 이동 조항이 없다. feiertage-api 2026 BE 실측(03-08 이 일요일)에서
# 보상 휴일 항목 0 건. 일요일과 겹쳐도 그 날짜 그대로 싣는다.
#
# --- key 규약 ---
# UID 의 token 이 된다. 한 번 나가면 바꿀 수 없다(core/ics.py 의 UID 절).
# rules/de/solar_holidays.yaml 의 규약과 같다 — 소문자 ASCII 와 밑줄, 서수는
# 풀어 쓰고(erster_mai), 움라우트·ß 는 ae/oe/ue/ss 로.
#
# 여기서 처음 적용하는 것 하나: 일회성 항목의 key 는 연도를 접미사로 단다
# (designated_holidays.yaml 의 achter_mai_2025). 숫자는 그 자리(끝의 네 자리
# 연도)에만 허용한다 — 서수를 숫자로 적는 것(8_mai)은 여전히 막는다.
# 이유는 designated_holidays.yaml 머리 주석에.
#
# 발행되는 UID 의 token 은 이 key 앞에 "de_be-" 가 붙는다(rules/de_be/feed.py).
# de.ics 와 같은 날 같은 항목이 같은 UID 로 나가면 두 피드를 함께 구독한
# 캘린더에서 서로를 덮어쓰기 때문이다. key 자체는 접두사 없이 쓴다.
#
# --- name ---
# SUMMARY 에 그대로 실린다. § 1 Abs. 1 의 조문 표기에서 정관사 der 를 뺀 것이다.
# 전국 공통 피드(de.ics)의 표기(BayFTG 기준: Neujahr, Erster Weihnachtstag)와
# 다른 항목이 있다 — Neujahrstag, 1. Weihnachtstag. 베를린 조문이 그렇다.
# "Tag der deutschen Einheit" 의 소문자 d 도 조문 그대로다.
#
# --- verified ---
# 원문을 직접 본 항목만 true. frauentag 는 도입 개정(GVBl. für Berlin 2019 Nr. 3 S. 22)의
# 관보 면으로 true 다 — 베를린 주의회 PARDOK 의 관보 면 사본이 berlin.de 판 호 전체
# PDF(Wayback 사본)의 S. 22 와 텍스트·렌더가 같다. 나머지 기저 9 건은 false 다.
# 2026-09-29 기준으로 확인한 사실:
#   - 공식 통합본 포털 gesetze.berlin.de 는 JS 셸만 돌려주고, 그 API
#     (/jportal/wsrest/recherche3/)는 인증 없이 "security_notAuthenticated" 로 거절한다.
#   - 기저 9 건의 자구 원천은 1954 원 공포(GVBl. S. 615)와 그 뒤 개정이다. 온라인 개정
#     넷 가운데 2015·2019·2024 는 § 1 Abs. 1 의 번호 삽입·삭제·재배치이고, 2010
#     (Art. VI)은 § 2·§ 4 만 바꾼다 — 넷 모두 § 1 Abs. 1 을 다시 싣지 않는다.
#   - GVBl. 1954 S. 615 와 1994 S. 491(02.12.1994 개정)의 온라인 사본을 찾지 못했다.
#     본 곳: berlin.de 사법행정부 GVBl 면(2004 년분부터), PARDOK 법률 발췌(제16대부터
#     적중, 제12대의 1994 S. 491 은 없음), reichsgesetzblatt.de(403), ZLB 디지털
#     주립도서관(GVBl 없음), Deutsche Digitale Bibliothek API(키 필요), gvbl-berlin.de
#     (구독 전용).
#   - 1954 → 1994 사이 § 1 Abs. 1 개정의 목록은 확인하지 못했다.
# 현행 § 1 은 비공식 현행판(umwelt-online)과 berlin.de 정부 안내의 열거, feiertage-api
# 2026 대조로 읽었다. 조사 기록: docs/research/report_he_be_gazette_access.md(과
# 같은 이름의 폴더 be_2019/).
#
# verified 와 source_todo 는 피드에 나가지 않는다(rules/de_be/feed.py).

# --- scope ---
# bundesweit | land. 전국 공통 9 건은 bundesweit, 나머지(일회성 포함)는 land.
# 9 건의 근거: feiertage-api 2025·2026 16 주 교집합 실측 — API 의 NATIONAL 키·
# rules/de 의 YAML 과 삼중 일치(/tmp/report_bundesweit.md). DESCRIPTION 첫 줄이
# 이 값에서 나온다. 로더가 닫힌 집합으로 검사하고, tests/test_de_scope.py 가
# bundesweit key 집합 == rules/de key 집합을 고정한다.

holidays:
  - key: neujahr
    name: Neujahrstag
    scope: bundesweit
    month: 1
    day: 1
    verified: false
    source: >-
      umwelt-online 현행판 § 1 Abs. 1 Nr. 1 + berlin.de 공식 안내 열거 +
      feiertage-api 2026 날짜 대조 10/10
    source_todo: >-
      관보 원본 GVBl. 1954 S. 615(Gesetz über die Sonn- und Feiertage vom 28.10.1954 원 공포)와
      GVBl. 1994 S. 491(02.12.1994 개정) — 2026-09-29 조사에서 두 호 모두 온라인 사본을 찾지 못함

  - key: frauentag
    name: Frauentag
    scope: land
    month: 3
    day: 8
    verified: true
    source: >-
      Gesetz über die Sonn- und Feiertage (Berlin) § 1 Abs. 1 Nr. 2 'der Frauentag (8.
      März)' — Drittes Gesetz zur Änderung des Gesetzes über die Sonn- und Feiertage vom
      30.01.2019 Art. 1 Nr. 1 a) (Nr. 1 뒤에 새 Nr. 2 삽입), GVBl. für Berlin 2019 Nr. 3 S. 22
      (06.02.2019 공포; 베를린 주의회(Abgeordnetenhaus Berlin) 의회 문서 시스템 PARDOK 의 관보 면 사본
      https://pardok.parlament-berlin.de/starweb/adis/citat/VT/18/gvbl/g19030022.pdf
      sha256 714f8bfc1cb1ac1babe023519d62b02546bd2310dfe8429ce452cce380bc85e2, 2026-09-29
      열람, 재수령 대조 일치). § 1 Abs. 1 Nr. 2 의 2019 이후 개정은 찾지 못함(2026-09 까지, 2024 개정 서두
      인용·PARDOK 검색). SUMMARY 는 괄호 날짜를 뺀 'Frauentag'. 날짜 8. 3. 은 feiertage-api 2026 BE 대조
      일치

