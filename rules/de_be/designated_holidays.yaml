# 독일·베를린 주 공휴일 — 일회성 3 건. 조문에 연도가 박힌 항목이다.
#
# 베를린 입법부는 기념일을 § 1 Abs. 1 에 "der 8. Mai 2025 (…)" 처럼 날짜째
# 번호 항목으로 넣고, 같은 개정법의 뒤 조항이 그 다음 날 그 번호를 삭제한다.
# 그래서 하나의 개정 관보에 도입과 소멸이 같이 적혀 있다.
#
# 규칙으로 유도하지 말 것. 어느 기념일이 공휴일이 될지는 의회가 정한다.
# 여기 없는 날짜는 공휴일이 아니다(rules/kr/designated_holidays.yaml 과 같은 원칙).
#
# --- 소급하지 않는다 ---
# 이미 지난 일회성도 그 해에 유효했으므로 싣는다. 2025-05-08 은 2025-05-09 에
# 조문에서 삭제됐지만 2025 년 피드에는 있어야 한다 — 발행 범위(2020-01-01~)
# 안의 과거는 그 시점의 법이 답이다. 2020-05-08 도 같은 이유로 싣는다.
#
# --- key 에 연도를 넣는다 (이 표에서 처음 적용) ---
# achter_mai_2025 처럼 끝에 네 자리 연도를 단다. 같은 월·일에 다른 해의 다른
# 일회성이 생겨도(8. Mai 가 2020 과 2025 에 각각 있다) key 가 서로 구분된다.
# UID 자체는 날짜가 앞에 붙어 겹치지 않지만, key 는 사람이 표에서 읽는 이름이라
# "achter_mai" 하나가 두 항목을 가리키면 어느 근거가 어느 항목인지 흐려진다.
# 숫자는 이 자리에만 허용한다(rules/de_be/feed.py 의 _KEY_RE).
#
# --- name ---
# SUMMARY. 조문의 날짜 표기 "8. Mai 2025" 만 쓴다. 괄호 안 기념 취지는
# 근거(source)에 담긴다.
#
# --- verified ---
# 관보 원문을 직접 읽은 2025·2028 두 건만 true(GVBl. 2024 Nr. 28 S. 460 PDF,
# /tmp/report_de_laender.md BE §2). 2020 건은 2019 개정문을 비공식 사본으로만
# 읽어 false.

holidays:
  - key: achter_mai_2020
    name: 8. Mai 2020
    date: 2020-05-08
    verified: false
    source: >-
      Drittes Gesetz zur Änderung des Gesetzes über die Sonn- und Feiertage vom
      30. Januar 2019 (GVBl. S. 22) Art. 1 — § 1 Abs. 1 에 'der 8. Mai 2020
      (75. Jahrestag der Befreiung vom Nationalsozialismus und der Beendigung des
      Zweiten Weltkrieges in Europa)' 추가, Art. 2 로 2020-05-09 삭제.
      umwelt-online 개정문 사본 + python-holidays 0.102 DE/BE 2020 일치
    source_todo: 2019-01-30 개정 관보 GVBl. S. 22 원문

  - key: achter_mai_2025
    name: 8. Mai 2025
    date: 2025-05-08
    verified: true
    source: >-
      GVBl. für Berlin 2024 Nr. 28 S. 460 — Viertes Gesetz zur Änderung des
      Gesetzes über die Sonn- und Feiertage vom 10. Juli 2024 Art. 1: § 1 Abs. 1
      Nr. 11 'der 8. Mai 2025 (80. Jahrestag der Befreiung vom Nationalsozialismus
      und der Beendigung des Zweiten Weltkriegs in Europa)' (2025-05-09 자동 삭제,
      Art. 2·Art. 4 Abs. 2)

  - key: siebzehnter_juni_2028
    name: 17. Juni 2028
    date: 2028-06-17
    verified: true
    source: >-
      GVBl. für Berlin 2024 Nr. 28 S. 460 — Viertes Gesetz zur Änderung des
      Gesetzes über die Sonn- und Feiertage vom 10. Juli 2024 Art. 1 Nr. 12 →
      현행 § 1 Abs. 1 Nr. 11 'der 17. Juni 2028 (75. Jahrestag des Aufstandes vom
      17. Juni 1953)' (2028-06-18 자동 삭제, Art. 3·Art. 4 Abs. 3)
