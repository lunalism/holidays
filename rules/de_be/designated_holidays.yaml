# 독일·베를린 주 공휴일 — 일회성 3 건. 조문에 연도가 박힌 항목이다.
#
# 베를린 입법부는 기념일을 § 1 Abs. 1 에 "der 8. Mai 2025 (…)" 처럼 날짜째
# 번호 항목으로 넣고, 같은 개정법의 뒤 조항이 그 다음 날 그 번호를 삭제한다.
# 그래서 하나의 개정 관보에 도입과 소멸이 같이 적혀 있다.
#
# 규칙으로 유도하지 말 것. 어느 기념일이 공휴일이 될지는 의회가 정한다.
# 여기 없는 날짜는 공휴일이 아니다(rules/kr/designated_holidays.yaml 과 같은 원칙).
#
# --- 소급하지 않는다 ---
# 이미 지난 일회성도 그 해에 유효했으므로 싣는다. 2025-05-08 은 2025-05-09 에
# 조문에서 삭제됐지만 2025 년 피드에는 있어야 한다 — 발행 범위(2020-01-01~)
# 안의 과거는 그 시점의 법이 답이다. 2020-05-08 도 같은 이유로 싣는다.
#
# --- key 에 연도를 넣는다 (이 표에서 처음 적용) ---
# achter_mai_2025 처럼 끝에 네 자리 연도를 단다. 같은 월·일에 다른 해의 다른
# 일회성이 생겨도(8. Mai 가 2020 과 2025 에 각각 있다) key 가 서로 구분된다.
# UID 자체는 날짜가 앞에 붙어 겹치지 않지만, key 는 사람이 표에서 읽는 이름이라
# "achter_mai" 하나가 두 항목을 가리키면 어느 근거가 어느 항목인지 흐려진다.
# 숫자는 이 자리에만 허용한다(rules/de_be/feed.py 의 _KEY_RE).
#
# --- name ---
# SUMMARY. 조문의 날짜 표기 "8. Mai 2025" 만 쓴다. 괄호 안 기념 취지는
# 근거(source)에 담긴다.
#
# --- verified ---
# 세 건 모두 true — 도입·소멸이 함께 적힌 개정 관보 면을 직접 읽었다. 관보 면은 베를린
# 주의회(Abgeordnetenhaus Berlin) PARDOK 의 법률 발췌 PDF 이고, 재수령 sha256 이 같다.
#   2020  GVBl. für Berlin 2019 Nr. 3 S. 22 — Art. 1 Nr. 1 d) 추가, Art. 2 Nr. 2 삭제
#         (Art. 3 Abs. 2: 2020-05-09 시행). PARDOK 면이 berlin.de 판 호 전체 PDF(Wayback
#         사본)의 S. 22 와 텍스트·렌더가 같다.
#   2025  GVBl. für Berlin 2024 Nr. 28 S. 460 — Art. 1 Nr. 2 추가, Art. 2 Nr. 1 삭제
#         (Art. 4 Abs. 2: 2025-05-09 시행)
#   2028  같은 호 — Art. 1 Nr. 2 로 Nr. 12 추가, Art. 2 Nr. 2 로 Nr. 11 로 재번호,
#         Art. 3 Nr. 2 삭제(Art. 4 Abs. 3: 2028-06-18 시행)
# 조사 기록: docs/research/report_he_be_gazette_access.md(과 같은 이름의 폴더
# be_2019/).

# --- scope ---
# bundesweit | land. 전국 공통 9 건은 bundesweit, 나머지(일회성 포함)는 land.
# 9 건의 근거: feiertage-api 2025·2026 16 주 교집합 실측 — API 의 NATIONAL 키·
# rules/de 의 YAML 과 삼중 일치(/tmp/report_bundesweit.md). DESCRIPTION 첫 줄이
# 이 값에서 나온다. 로더가 닫힌 집합으로 검사하고, tests/test_de_scope.py 가
# bundesweit key 집합 == rules/de key 집합을 고정한다.

holidays:
  - key: achter_mai_2020
    name: 8. Mai 2020
    scope: land
    date: 2020-05-08
    verified: true
    source: >-
