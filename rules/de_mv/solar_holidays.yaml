      Amtsblatt oder dem Amtlichen Anzeiger aus den Jahren 2014-2025? Bitte schreiben Sie eine E-Mail
      unter Angabe der gewünschten Publikation' 이라고 적는다(2026-11-18 열람). 2026-09-30 의 관보 PDF 주소는 이제 그 사이트의
      첫 화면으로 넘어간다. 2026-09-30 조사는 개정법 GVOBl. M-V 2022 Nr. 31 S. 427 을 당시 관보 목록의 PDF 로 열람했으나 크기(263,235 B)만
      기록했다. 1992 원법과 2002 재공포본(GVOBl. M-V 2002 S. 145)은 그때도 온라인 목록(2014 년부터) 밖이었다.

