# 독일·메클렌부르크포어포메른 주 공휴일 — 고정 날짜 7 건.
#
# 근거: Gesetz über Sonn- und Feiertage (Feiertagsgesetz Mecklenburg-Vorpommern - FTG M-V -) In der
# Fassung der Bekanntmachung vom 8. März 2002 (GVOBl. M-V 2002, 145; Gliederungs-Nr. 1136-1) § 2
# Abs. 1 — "(1) Gesetzliche Feiertage sind: 1. der Neujahrstag (1. Januar), 2. der Frauentag
# (8. März), 3. der Karfreitag, 4. der Ostermontag, 5. der 1. Mai, 6. der Christi-Himmelfahrtstag,
# 7. der Pfingstmontag, 8. der Tag der Deutschen Einheit (3. Oktober), 9. der Reformationstag
# (31. Oktober), 10. der 1. Weihnachtstag (25. Dezember), 11. der 2. Weihnachtstag (26. Dezember)."
# — 11 건. 고정 날짜는 Nr. 1·2·5·8·9·10·11 이고 부활절 이동 넷(Nr. 3·4·6·7)은 easter_holidays.yaml
# 에 있다. 전국 공통 9 건에 Nr. 2(8. 3.)와 Nr. 9(31. 10.)가 더해진다.
#
# --- 현행 자구의 출처 — 공식 포털의 통합본 ---
# Landesrecht Mecklenburg-Vorpommern(https://www.landesrecht-mv.de, 주 공식 법령 포털)의 § 2 조문
# 단위 문서 jlr-NNLMV00007A2FNN00000000003 — 「Fassung vom: 07.07.2022」 「Gültig ab: 13.07.2022」.
# 법 전체 문서 jlr-NNLMV00007A2F 의 「Stand: letzte berücksichtigte Änderung: zuletzt geändert
# durch Gesetz vom 7. Juli 2022 (GVOBl. M-V S. 427)」, Gesamtausgabe 화면 「Zum 18.11.2026
# aktuellste verfügbare Fassung der Gesamtausgabe」. § 2 자구는 조문 단위 문서 두 렌더(2026-11-18,
# 10 초 간격)와 법 전체 Gesamtausgabe(2026-11-18)에서 같다 — 정규화한 § 2 텍스트의 sha256
# e7fe52efabaa7216ae815e4ad7931ad32bde43e6636ca40a40b5155c9b02efb5. 원래의 문서 주소
# https://www.landesrecht-mv.de/bsmv/document/jlr-FeiertGMVrahmen 은 2026-10-07 과 2026-11-18 에
# 포털 문서 API 가 HTTP 500 이라 열리지 않았다(「Das Laden des Dokumentes jlr-FeiertGMVrahmen ist
# fehlgeschlagen.」). 조문 단위 id 는 포털 자신의 검색(Schnellsuche)이 찾았다.
# 이 포털 자구를 전 항목 자구의 공식 현행 조문으로 삼은 것은 사람의 결정이다(Holiday_21 뒤, M1).
#
# --- Frauentag 의 시작 — effective_from ---
# frauentag 항목만 effective_from: 2022-07-13 을 둔다. 근거는 포털 § 2 의 「Gültig ab: 13.07.2022」
# 문면 그대로이고 유도한 값이 아니다(사람의 결정 M2). 포함 경계라 2020·2021·2022 의 3월 8일은
# 싣지 않고 2023 부터 싣는다. 뜻은 kr 의 항목별 effective_from 과 같다(rules/de_mv/feed.py).
# 참고: 2026-09-30 조사는 개정법 GVOBl. M-V 2022 Nr. 31 S. 427(ausgegeben 12. Juli 2022)의
# 시행 조항 「Dieses Gesetz tritt am Tag nach der Verkündung in Kraft.」 를 적었다. 그 PDF 의
# 해시는 기록되지 않았고 지금은 받을 수 없다(아래). 값의 근거로 쓰지 않는다.
#
# --- 공포본 — 온라인으로 닿는 것 ---
# 찾지 못했다. 2026-11-18 의 관찰:
# - 2026-09-30 의 관보 PDF 주소(regierung-mv.de …/GVOBl.%20Nr.%2031%20v.%2012.7.2022.pdf)와 관보
#   목록 주소는 이제 https://land-mv.de/ 의 HTML 화면으로 넘어간다.
# - 같은 사이트의 두 화면이 관보의 온라인 공개를 다르게 적는다. 판단 없이 그대로 옮긴다.
#   https://land-mv.de/thema/buergerservices-und-digitale-verwaltung (2026-11-18):
#     「Sämtliche Jahrgänge von 2020 bis 2025 stehen vollständig online zum Abruf bereit.」
#   https://land-mv.de/landeregierung/jm/gesetz-verordnungsblaetter (2026-11-18, 주소의 철자는
#   사이트의 링크 그대로): 2026 년 호(Nr. 1–31)만 싣고 「Sie haben Interesse an Gesetz- und
#   Verordnungsblättern, am Amtsblatt oder dem Amtlichen Anzeiger aus den Jahren 2014-2025? Bitte
#   schreiben Sie eine E-Mail unter Angabe der gewünschten Publikation an: …」.
# - 1992 원법(GVOBl. M-V S. 342)과 2002 재공포본(S. 145)은 2026-09-30 에도 온라인 목록(2014 년부터)
#   밖이었다.
# E-Mail 로 관보를 요청하지 않는다(사람의 결정 M4).
#
# --- § 2 Abs. 3 일회성 지정 — 수록 항목 없음 ---
# "(3) Die Landesregierung kann bei besonderem Anlass für das ganze Land oder für Teilgebiete des
# Landes Werktage zu einmaligen Feiertagen, Gedenktagen oder Trauertagen erklären und die
# Schutzvorschriften der §§ 3 bis 6 auf sie ausdehnen." 발행 범위(2020~) 안의 선언은 찾지 못함 —
# 포털 Schnellsuche, 2026-11-18:
# - 'Feiertag' 를 분류 Gesetze/Verordnungen 으로 좁혀 87 건 전부(4 쪽)를 받았다. 결과 날짜가
#   2020-01-01 이후인 42 건과 날짜 없는 3 건(FFN 색인)의 제목·부제에 주 전역 일회성 공휴일이나
#   Arbeitsruhe 날의 선언은 없다. 포털의 날짜 필터는 쓰지 않았고 결과 날짜로 골랐다.
# - 인용 조문으로 찾는 검색은 없다. '§ 2 Abs. 3 FTG M-V' 는 § 2 조문 문서 1 건으로 바로 열렸고
#   '§ 2 Absatz 3 Feiertagsgesetz' 는 0 건이다.
# [추론] 포털은 통합본 데이터베이스라, 날이 지나 효력을 잃은 일회성 선언이 빠져 있다면 이 검색에
# 들지 않는다. de_bb 처럼 관보 목록의 제목으로 찾는 것은 관보 화면에 2020–2025 목록이 없어
# 하지 못했다(2026-11-18). 이 공백은 사실로만 적는다.
# 조사 기록: docs/research/report_mv_prep.md·report_mv_retry.md 와 같은 이름의 폴더,
# docs/research/report_de_mv_impl/(이 표를 세울 때의 포털 확인).
#
# --- verified ---
# 원문을 직접 본 항목만 true. 11 건 전건 false — 공포본(2002 재공포본, 2022 Nr. 31)을 해시와 함께
# 받지 못했다(사람의 결정 M3). 각 항목 source 는 § 2 Abs. 1 Nr. 의 자구와 포털 서지를, source_todo
# 는 관보 공백의 관측 사실을 적는다. 날짜는 feiertage-api 2026 MV(11 건, hinweis 전부 공란)로
# 대조했다. python-holidays(pyproject 에 고정) DE(subdiv='MV') 와의 연도별 대조는
# tests/test_de_mv_feed.py::test_the_dates_agree_with_python_holidays_mv 가 2020~2031 로 돈다 —
# 라이브러리도 Frauentag 를 2023 부터 둔다.
#
# --- 범위 밖 ---
# § 2 Abs. 2 의 Gedenk- und Trauertage — "1. der Volkstrauertag …, 2. der Totensonntag …, 3. der
# 8. Mai als Tag der Befreiung vom Nationalsozialismus und der Beendigung des 2. Weltkrieges." —
# 는 공휴일이 아니다(8. Mai 는 Gedenktag, 사람의 결정 M5 — HB § 7a 와 같다). § 7 의 kirchliche
# Feiertage 도 공휴일이 아니다.
#
# --- 대체공휴일(이동) 규칙이 없다 ---
# § 2 에 이동 조항이 없다. 2020~2031 에서 고정 날짜가 일요일과 겹쳐도(2021 10-03·10-31·12-26,
# 2022 05-01·12-25, 2023 01-01, 2026 03-08, 2027 10-03·10-31·12-26) 보상 휴일이 없다 — 위
# 테스트가 해마다 python-holidays MV 와 날짜 집합이 같음을 단언한다. 그 날짜 그대로 싣는다.
#
# --- key 규약 ---
# UID 의 token 이 된다. 한 번 나가면 바꿀 수 없다(core/ics.py 의 UID 절).
# rules/de_be/solar_holidays.yaml 의 규약과 같다. 이 표와 부활절 표의 key 는 전부 기존
# 확립값이다 — frauentag 는 de_be 와, reformationstag 는 de_bb·de_hb·de_hh·de_ni·de_sh 와 같다.
# 발행되는 UID 의 token 은 이 key 앞에 "de_mv-" 가 붙는다(rules/de_mv/feed.py). 접두사 없이는
# 다른 독일 피드와 UID 가 겹친다.
#
# --- name ---
# SUMMARY 에 그대로 실린다. 조문 표기에서 관사 "der" 와 끝의 괄호 날짜만 뺐다 — "Tag der Deutschen
# Einheit"(대문자 D 도 조문 그대로). 원문은 각 항목 source 에 그대로 남긴다.
#
# --- 필드 ---
# 로더가 닫힌 집합으로 검사한다(rules/de_mv/feed.py). 모르는 필드와 끝 필드는 로드가 멈춘다.
# verified·source_todo·effective_from 은 피드에 나가지 않는다.

# --- scope ---
# bundesweit | land. 전국 공통 9 건은 bundesweit, 나머지(일회성 포함)는 land.
# 9 건의 근거: feiertage-api 2025·2026 16 주 교집합 실측 — API 의 NATIONAL 키·
# rules/de 의 YAML 과 삼중 일치(실측 요지는 tests/test_de_scope.py 머리 docstring,
# 고정은 같은 파일의 test_bundesweit_keys_equal_the_nationwide_keys). DESCRIPTION 첫
# 줄이 이 값에서 나온다. 로더가 닫힌 집합으로 검사한다.

