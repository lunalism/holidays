    verified: true
    source: >-
      BayFTG Art. 1 Abs. 1 Nr. 1, 열거 7번째 'Pfingstmontag' — gesetze-bayern.de
      BayFTG-1 원문 2026-09-06 열람(Text gilt ab 01.08.2013). 부활절 +50 일은
      feiertage-api 2026 BY(25. 5.)·python-holidays 0.102 BY 대조 일치

