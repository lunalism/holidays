      BayFTG-1 원문 2026-09-06 열람(Text gilt ab 01.08.2013). 부활절 +39 일은
      feiertage-api 2026 BY(14. 5.)·python-holidays 0.102 BY 대조 일치

  - key: pfingstmontag
