      feiertage-api 2026 BY·python-holidays 0.102 BY 대조 일치

  - key: erster_weihnachtstag
    name: Erster Weihnachtstag
    month: 12
    day: 25
    verified: true
    source: >-
      BayFTG Art. 1 Abs. 1 Nr. 1, 열거 11번째 'Erster Weihnachtstag' — gesetze-bayern.de
      BayFTG-1 원문 2026-09-06 열람(Text gilt ab 01.08.2013). 날짜 25. 12. 은
      feiertage-api 2026 BY(1. Weihnachtstag)·python-holidays 0.102 BY 대조 일치

