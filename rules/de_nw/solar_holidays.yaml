# 독일·노르트라인베스트팔렌 주 공휴일 — 고정 날짜 6 건.
#
# 근거: Gesetz über die Sonn- und Feiertage (Feiertagsgesetz NW) § 2 Abs. 1 —
# "Feiertage sind: 1. der Neujahrstag, 2. der Karfreitag, 3. der Ostermontag,
# 4. der 1. Mai als Tag des Bekenntnisses zu Freiheit und Frieden, sozialer
# Gerichtigkeit [sic], Völkerversöhnung und Menschenwürde, 5. der
# Christi-Himmelfahrtstag, 6. der Pfingstmontag, 7. der Fronleichnamstag (Donnerstag
# nach dem Sonntag Trinitatis), 8. der 3. Oktober als Tag der Deutschen Einheit,
# 9. der Allerheiligentag (1. November), 10. der 1. Weihnachtstag, 11. der
# 2. Weihnachtstag." — 아래 세 공포본을 차례로 적용한 자구다(공포본 스캔 판독).
# 고정 날짜는 Nr. 1·4·8·9·10·11. 전국 공통 5 건에 Nr. 9 Allerheiligentag(1. 11.)이
# 더해진다.
#
# --- 공포본 세 호 (recht.nrw.de GV_Archiv PDF, 2026-09-29 열람, 재수령 대조 일치) ---
#   1989  Bekanntmachung der Neufassung des Gesetzes über die Sonn- und Feiertage
#         vom 23.04.1989, GV. NW. 1989 Nr. 19 S. 222 (09.05.1989 공포). § 2 Abs. 1 을
#         Nr. 1~12 로 전문 공고 — Nr. 8 은 "der 17. Juni als Tag der deutschen
#         Einheit", Nr. 10 은 Buß- und Bettag. 1989 이전 체인은 이 Neufassung 이
#         전문을 실으므로 거슬러 올라가지 않는다.
#         https://recht.nrw.de/system/files/GV_Archiv/4122-xmmgvb8919.pdf
#         sha256 b72dd60b57c8b59139d27313e193f13d0b0fd06fce4da727749dd9a58b780a49
#         (Wayback 20260206·20260710 사본도 같은 sha256)
#   1991  Gesetz zur Änderung des Feiertagsgesetzes NW vom 17.04.1991 Art. I Nr. 1 —
#         § 2 Abs. 1 Nr. 8 을 "der 3. Oktober als Tag der Deutschen Einheit," 로.
#         GV. NW. 1991 Nr. 19 S. 200 (03.05.1991 공포, 공포 익일 시행).
#         https://recht.nrw.de/system/files/GV_Archiv/3762-xmmgvb9119.pdf
#         sha256 4c7dd3aad931ce0b5906db48681a0cdfb6cb425a1964a8a970c14a683aa2dbc5
#   1994  Zweites Gesetz zur Änderung des Feiertagsgesetzes Nordrhein-Westfalen vom
#         20.12.1994 Art. I Nr. 1 — § 2 Abs. 1 Nr. 10 삭제, Nr. 11·12 → 10·11.
#         GV. NW. 1994 Nr. 88 S. 1114 (30.12.1994 공포, 공포 익일 시행).
#         https://recht.nrw.de/system/files/GV_Archiv/4383-xmmgvb9488.pdf
#         sha256 329fd81bb58b2e9a0cb17d8e0d7df3e28ffe0de35b175648fce282359ab823f8
# 세 파일 모두 같은 URL 을 두 번 받아 sha256 이 같았다(결정적) — NI·BW 와 같은 파일
# 해시형이다. 1989·1991 판은 JBIG2 에 OCR 텍스트층이 있고 1994 판은 CCITT G4 에
# 텍스트층이 없다. 판독 근거는 세 판 모두 면 이미지이고, OCR 은 교차 확인에만 썼다.
# 조사 보고·전사본: docs/research/report_nw_feiertagsgesetz_chain.md 와 같은 이름의
# 폴더.
#
# --- 개정 체인과 그 닫힘 ---
# § 2 Abs. 1 에 닿은 개정으로 찾은 것은 1991 S. 200(Nr. 8)·1994 S. 1114(Nr. 10 삭제·
# 재번호) 둘이다. 구간별 근거(2015 이후는 개정을 찾지 못했다는 검색 사실이다):
#   1989 → 1991   1991 S. 200 서두가 1989 공고본을 개정 없이 인용
#   1991 → 1994   1994 S. 1114 서두가 "geändert durch Gesetz vom 17. April 1991" 만 인용
#   1994 → 2006   GV. NRW. 2006 S. 516 (LÖG NRW) § 1 의 "zuletzt geändert durch Gesetz
#                 vom 20. Dezember 1994 (GV. NRW. S. 1114)"
#   2006 → 2015   GV. NRW. 2015 S. 496 § 1 의 같은 취지 인용(25.06.2015)
#   2015 → 2026 Nr. 27 (24.09.2026)
#                 공포본의 자기 서술은 없다. 두 근거로 닫는다.
#                 (a) recht.nrw.de 공포 문서 전문 색인(search-middleware
#                     opensearch_internet, 공포 문서 단위 1997–2026) 구문 검색 —
#                     Feiertagsgesetz(es)·Gesetz(es) über die Sonn- und Feiertage·
#                     Feiertagsgesetz(es) NW/NRW·"S. 1114" 와 제목의 feiertag 에서
#                     개정 법률 무적중(적중은 전부 이 법을 인용하는 다른 법령).
#                 (b) 포털 현행판의 Änderungshistorie 가 1994 S. 1114 에서 끝나고
#                     「Fassungen」은 01.01.2000 한 판뿐이다.
#                 색인이 호마다 공포 문서를 1 건 이상 가진다는 것을 1998–2026 전 호로
#                 셌고, 빠진 호는 1998 Nr. 3(2006 인용 구간 안)과 2021 Nr. 75a 다.
#                 2021 Nr. 75a 에 대해 확인한 사실:
#                   - 포털 호 면은 "vom 18.05.2021" 표제뿐이다 — PDF 링크·수록 문서가
#                     없고 색인에도 문서가 없다. Wayback 사본 둘(20260208·20260306)이
#                     같은 내용이다.
#                   - 본번 면 연속성을 두 위치에서 확인했다. 날짜 기준 5 월: Nr. 39
#                     S. 559–610 → Nr. 40 S. 611–650. 호 번호 기준 10 월: Nr. 75
#                     S. 1147–1164 → Nr. 76 S. 1165–1170. 두 곳 모두 빠진 면이 없다.
#                   - 문자 접미 면(559a 등)을 쓰는 특별호일 가능성은 배제하지 못했다.
#                   - (b) 의 포털 개정 이력은 이 기간 전체를 덮는다.
#
# --- 정오표(Berichtigung) ---
# 1989 S. 222 의 정오표를 찾지 못했다. 본 범위: 1989 Nr. 20–69 와 1990–1996 전 512 호.
# 185 호는 텍스트층 전문을 검색했고, 327 호(1990 전 75·1993 전 82·1994 전 89·1995 의
# 79·1991·1992 각 1)는 텍스트층이 없어 1 쪽 목차만 OCR 로 읽었다 — 목차에 오르지
# 않고 뒤쪽 면에만 실린 정오표는 이 327 호에서 놓칠 수 있다.
#
# --- 공포본과 비공식 현행판의 차이 ---
# 비공식 현행판(lexmea "Imported 21.10.2025"·recht.nrw.de 통합본)과 IHK Köln 요약은
# 공포본과 다음이 다르다.
#   Nr. 4  공포본 1989 은 "Gerichtigkeit"(인쇄 오식). 1977 Bekanntmachung(GV. NW. 1977
#          S. 98)은 "Gerechtigkeit". lexmea·통합본은 "Gerechtigkeit".
#   Nr. 5  공포본(1977 S. 98·1989 S. 222)은 "Christi-Himmelfahrtstag". lexmea·IHK·
#          통합본의 "Christi-Himmelfahrts-Tag" 하이픈 표기는 공포본에 없다.
#   Nr. 7  괄호 정의가 있다 — IHK 의 괄호 없는 요약이 아니다.
#   Nr. 8  1991 문언 그대로 "der 3. Oktober als Tag der Deutschen Einheit" — IHK 의
#          "der Tag der deutschen Einheit (3. Oktober)" 가 아니다.
#   Nr. 10/11  괄호 날짜가 없다 — IHK 의 "(25. Dezember)"/"(26. Dezember)" 가 아니다.
# 통합본 § 2 의 개별 각주는 1991 개정을 빠뜨린다(§ 5 각주에만 있다). 체인은 공포본
# 서두로 세웠다.
#
# --- 범위 밖 ---
# § 2 Abs. 1 에 지자체·집단 한정 항목이 없다. Abs. 2 의 Volkstrauertag·Totensonntag
# 는 Gedenk- und Trauertage(일요일)이지 공휴일이 아니다. § 8 kirchliche Feiertage,
# § 9 jüdische Feiertage 는 근무·수업 편의 조항.
# 일회성: 2017-10-31(500. Jahrestag der Reformation)이 있었다 — 별도 법률 Gesetz über
# die Bestimmung des 31. Oktober 2017 …, GV. NRW. 2015 S. 496(2017-11-01 실효). § 2 를
# 개정하지 않았고, 피드 범위(RANGE_START 2020-01-01, rules/de_nw/feed.py) 밖이라
# 싣지 않는다.
#
# --- 대체공휴일(이동) 규칙이 없다 ---
# § 2 에 이동 조항이 없다. feiertage-api NW 2020–2031 실측에서 일요일 겹침(2020
# 11-01, 2021 10-03·12-26, 2022 05-01·12-25, 2023 01-01, 2026 11-01, 2027
# 10-03·12-26) 모두 보상 휴일 0 건. 일요일과 겹쳐도 그 날짜 그대로 싣는다.
#
# --- key 규약 ---
# UID 의 token 이 된다. 한 번 나가면 바꿀 수 없다(core/ics.py 의 UID 절).
# rules/de_be/solar_holidays.yaml 의 규약과 같다. 이 표의 key 는 전부 기존 확립값 —
# Allerheiligentag 도 de_by 의 allerheiligen 을 쓴다. token 은 내부 식별자라 조문
# 표기(-tag)를 따라 새로 파지 않는다(de_hh 의 reformationstag 건에서 확립된 원칙).
# 신규 명명 0. 발행되는 UID 의 token 은 이 key 앞에 "de_nw-" 가 붙는다
# (rules/de_nw/feed.py). 접두사 없이는 다섯 독일 피드와 UID 가 겹친다.
#
# --- name ---
# SUMMARY 에 그대로 실린다. § 2 Abs. 1 의 조문 표기(위 공포본 자구)에서 정관사 der 와
# 서술부·괄호를 뺀 것이다 — de.ics 가 BayFTG 의 "der 3. Oktober als …" 를 뺀
# 전례와 동형. Nr. 4 → "1. Mai", Nr. 8 → "Tag der Deutschen Einheit", Nr. 9 →
# "Allerheiligentag". 원문은 각 항목 source 에 그대로 남긴다.
#
# --- verified ---
# 원문을 직접 본 항목만 true. 11 건 전부 위 공포본 세 호의 면 이미지를 판독해 자구를
# 확인했다(Nr. 1~7·9 는 1989, Nr. 8 은 1991, Nr. 10·11 은 1989 + 1994 재번호). 날짜는
# feiertage-api 2026 NW 로 대조했다(11/11). 항목별 source 는 자기 호 번호(§ 2 Abs. 1
# Nr. n)·조문 자구와 자기 공포본의 서지·공포일·PDF URL·sha256·열람일을 스스로 든다 —
# source 는 DESCRIPTION 의 "근거:" 뒤에 그대로 실리므로 이 주석을 가리키지 않는다.
#
# verified 는 피드에 나가지 않는다(rules/de_nw/feed.py).

# --- scope ---
# bundesweit | land. 전국 공통 9 건은 bundesweit, 나머지(일회성 포함)는 land.
# 9 건의 근거: feiertage-api 2025·2026 16 주 교집합 실측 — API 의 NATIONAL 키·
# rules/de 의 YAML 과 삼중 일치(/tmp/report_bundesweit.md). DESCRIPTION 첫 줄이
# 이 값에서 나온다. 로더가 닫힌 집합으로 검사하고, tests/test_de_scope.py 가
# bundesweit key 집합 == rules/de key 집합을 고정한다.

