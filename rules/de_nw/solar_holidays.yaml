# 독일·노르트라인베스트팔렌 주 공휴일 — 고정 날짜 6 건.
#
# 근거: Gesetz über die Sonn- und Feiertage (Feiertagsgesetz NW) § 2 Abs. 1 —
# "Feiertage sind: 1. der Neujahrstag, 2. der Karfreitag, 3. der Ostermontag,
# 4. der 1. Mai als Tag des Bekenntnisses zu Freiheit und Frieden, sozialer
# Gerechtigkeit, Völkerversöhnung und Menschenwürde, 5. der Christi-Himmelfahrts-Tag,
# 6. der Pfingstmontag, 7. der Fronleichnamstag (Donnerstag nach dem Sonntag
# Trinitatis), 8. der 3. Oktober als Tag der Deutschen Einheit, 9. der
# Allerheiligentag (1. November), 10. der 1. Weihnachtstag, 11. der 2. Weihnachtstag."
# (lexmea 현행판, "Imported 21.10.2025"). 고정 날짜는 Nr. 1·4·8·9·10·11. 전국 공통
# 5 건에 Nr. 9 Allerheiligentag(1. 11.)이 더해진다.
#
# --- 기준 텍스트와 자구 차이 ---
# 기준은 lexmea 다. IHK Köln 의 요약 열거는 Nr. 7 "der Fronleichnamstag"(괄호 없음),
# Nr. 8 "der Tag der deutschen Einheit (3. Oktober)"(어순·소문자 d·괄호), Nr. 10/11
# "der 1. Weihnachtstag (25. Dezember)" / "der 2. Weihnachtstag (26. Dezember)"
# (괄호 날짜)로 자구가 다르다. 어느 쪽이 관보 자구인지 공식 원문으로 확인하지
# 못했다 — 해당 항목 source 에 차이를 기록한다.
#
# --- 범위 밖 ---
# § 2 Abs. 1 에 지자체·집단 한정 항목이 없다. Abs. 2 의 Volkstrauertag·Totensonntag
# 는 Gedenk- und Trauertage(일요일)이지 공휴일이 아니다. § 8 kirchliche Feiertage,
# § 9 jüdische Feiertage 는 근무·수업 편의 조항. 일회성 항목은 확인된 것이 없다.
#
# --- 대체공휴일(이동) 규칙이 없다 ---
# § 2 에 이동 조항이 없다. feiertage-api NW 2020–2031 실측에서 일요일 겹침(2020
# 11-01, 2021 10-03·12-26, 2022 05-01·12-25, 2023 01-01, 2026 11-01, 2027
# 10-03·12-26) 모두 보상 휴일 0 건. 일요일과 겹쳐도 그 날짜 그대로 싣는다.
#
# --- key 규약 ---
# UID 의 token 이 된다. 한 번 나가면 바꿀 수 없다(core/ics.py 의 UID 절).
# rules/de_be/solar_holidays.yaml 의 규약과 같다. 이 표의 key 는 전부 기존 확립값 —
# Allerheiligentag 도 de_by 의 allerheiligen 을 쓴다. token 은 내부 식별자라 조문
# 표기(-tag)를 따라 새로 파지 않는다(de_hh 의 reformationstag 건에서 확립된 원칙).
# 신규 명명 0. 발행되는 UID 의 token 은 이 key 앞에 "de_nw-" 가 붙는다
# (rules/de_nw/feed.py). 접두사 없이는 다섯 독일 피드와 UID 가 겹친다.
#
# --- name ---
# SUMMARY 에 그대로 실린다. § 2 Abs. 1 의 조문 표기(lexmea)에서 정관사 der 와
# 서술부·괄호를 뺀 것이다 — de.ics 가 BayFTG 의 "der 3. Oktober als …" 를 뺀
# 전례와 동형. Nr. 4 → "1. Mai", Nr. 8 → "Tag der Deutschen Einheit", Nr. 9 →
# "Allerheiligentag". 원문은 각 항목 source 에 그대로 남긴다.
#
# --- verified ---
# 원문을 직접 본 항목만 true. 공식 포털 recht.nrw.de 는 검색 SPA 로 딥링크를
# 무시하고, 관보 PDF(GV_Archiv 4122-xmmgvb8919.pdf)는 JBIG2 스캔이라 텍스트 미추출
# (/tmp/report_de_laender.md NW §1). 조문은 비공식 둘(lexmea, IHK Köln)로 읽고,
# 날짜는 feiertage-api 2026 NW 로 대조했다(11/11). 그래서 전부 false 다 — BE 기저
# 9 건과 같은 관례. 항목별 source 에 자기 호 번호(§ 2 Abs. 1 Nr. n)와 그 호의 조문
# 표기를 따옴표로 담고, source_todo 에 공식 경로를 남긴다.
#
# verified 와 source_todo 는 피드에 나가지 않는다(rules/de_nw/feed.py).

holidays:
