# 대한민국 대체공휴일 규칙 테이블
#
# 이 파일은 규칙 데이터만 담는다. 조회·유도는 rules/kr/substitute_rules.py 가 한다.
# tests/fixtures/kr.yaml 이 "정답"이라면 이 파일은 그 정답을 만들어야 하는 "입력"이다.
# 둘은 독립적으로 관리하고, tests/test_substitute_rules.py 가 서로 대조한다.
#
# ---------------------------------------------------------------------------
# 구조
# ---------------------------------------------------------------------------
#
# 조문 구조를 그대로 옮긴다. 공휴일별로 조건을 적는 것이 아니라, 조문의 각 호가
# "무엇과 겹칠 때"(overlaps)와 "어떤 공휴일에"(applies_to) 적용되는지를 적고,
# 공휴일별 결과는 거기서 유도한다.
#
#   제3조제1항제1호  overlaps: [saturday, sunday]              → 토·일 모두 대상
#   제3조제1항제2호  overlaps: [sunday]                        → 일요일만 대상
#   제3조제1항제3호  overlaps: [other_holiday_on_weekday]      → 주말 판정에 기여 없음
#
# 흔히 말하는 "설·추석은 일요일만 대상"이라는 비대칭은 어디에도 예외로 적혀 있지 않다.
# 설·추석이 2호에 속하고 국경일류가 1호에 속한다는 소속 관계에서 유도된다.
# 별도 필드나 분기문으로 하드코딩하지 말 것. 그렇게 하면 같은 사실이 두 곳에 적히고
# 한쪽만 고쳐질 때 조용히 어긋난다.
#
# 규칙 개정은 rulesets 의 버전으로 표현한다. 각 ruleset 은 effective_from 부터
# 다음 ruleset 의 effective_from 전날까지 유효하다.
# effective_until 은 저장하지 않는다. 저장하면 두 곳에 적히고 어긋날 수 있다.
# 계산 시에는 그 날짜에 유효했던 ruleset 만 적용한다. 최신 규칙을 소급하지 않는다.
#
# ---------------------------------------------------------------------------
# 이 파일의 범위 밖
# ---------------------------------------------------------------------------
#   - 임시공휴일: 국무회의 의결로 그때그때 지정되며 규칙이 없다. 하드코딩 대상이다.
#   - 공휴일 날짜 계산(음력 환산 등).
#   - 어떤 날이 공휴일인가의 전체 목록. 이 표는 이미 공휴일인 것이 겹쳤을 때만 다룬다.
#
# ---------------------------------------------------------------------------
# verified 필드
# ---------------------------------------------------------------------------
# 법제처 원문 대조를 마친 항목만 verified: true 가 된다. 현재 전부 false 다.
# source 에 값이 있어도 verified: false 이면 아직 2차 출처 수준이라는 뜻이다.
# tests/test_substitute_rules.py 의 감사 테스트가 미검증 항목을 추적한다.

version: 2
country: kr

# ---------------------------------------------------------------------------
# 요일 기반 공휴일
# ---------------------------------------------------------------------------
weekly_holidays:
  - sunday

# 토요일은 여기에 없다. 의도적이다.
# 공휴일 규정은 일요일을 공휴일로 열거하지만 토요일은 열거하지 않는다.
# 토요일은 (공무원 복무 기준의) 휴무일이지 공휴일이 아니다.
# 이 목록은 "다음 비공휴일"을 찾을 때 어느 날을 건너뛰는지 결정한다.
# 제3조제3항이 대체공휴일을 토요일에서 다시 밀어내는 것도 토요일이 공휴일이
# 아니어서 그냥 두면 대체공휴일이 무의미해지기 때문이다.

# 규칙 판정에서는 일요일을 공휴일로 다루지만, 발행되는 .ics 피드에는
# 매주 일요일을 이벤트로 내보내지 않는다. 둘은 별개의 결정이다.
sunday_in_output: false

# ---------------------------------------------------------------------------
# 겹침 조건 어휘
# ---------------------------------------------------------------------------
overlap_vocabulary:
  saturday:
    description: 해당 공휴일이 토요일과 겹치는 경우.
  sunday:
    description: 해당 공휴일이 일요일과 겹치는 경우.
  other_holiday_on_weekday:
    description: |
      해당 공휴일이 토요일·일요일이 아닌 날에 다른 공휴일과 겹치는 경우.
      토·일을 명시적으로 배제하므로 주말 대상 여부 판정에는 기여하지 않는다.
      일요일이 이 조건으로 흘러들어오지 않는다는 점이 중요하다.
      일요일은 1호·2호에서 직접 지명된다.

# ---------------------------------------------------------------------------
# 대체공휴일을 어디에 두는가 (배치 규칙)
# 위 overlaps 가 "생기는가"를 정하고, 아래가 "어디에 생기는가"를 정한다.
# ---------------------------------------------------------------------------
placement_rules:

  - id: 제3조제1항
    rule: 겹친 공휴일 다음의 첫 번째 비공휴일을 대체공휴일로 한다.
    verified: false
    source_todo: |
      이 문장이 제1항 본문에 있는지, 각 호에 나뉘어 있는지 미확인.
      법제처 원문 대조 시 위치를 확정할 것.

  - id: 제3조제2항
    rule: |
      대체공휴일이 같은 날에 겹치는 경우 다음 비공휴일까지 연장한다.
      즉 한 연휴에서 두 날 이상이 겹치면 대체공휴일도 그만큼 늘어난다.
    verified: false
    source_todo: 원문 문구 대조 필요. 연장 방식이 일수 누적인지 다른 방식인지 확인할 것.

  - id: 제3조제3항
    rule: |
      대체공휴일이 토요일과 겹치는 경우 다음 비공휴일로 다시 옮긴다.
      토요일은 공휴일이 아니므로 그냥 두면 대체공휴일이 실질적 의미를 잃는다.
    verified: false
    source_todo: 원문 문구 대조 필요.

# ---------------------------------------------------------------------------
# 공휴일 레지스트리 — clauses 의 applies_to 가 참조하는 키 목록.
# 설명용이며 계산에 쓰지 않는다. group 으로 분기하면 안 된다.
# 어린이날·부처님오신날·기독탄신일은 국경일이 아닌데 1호에 함께 들어 있다.
# ---------------------------------------------------------------------------
holidays:
  seollal:            { name: 설날 연휴,      group: 명절 }
  chuseok:            { name: 추석 연휴,      group: 명절 }
  childrens_day:      { name: 어린이날,        group: 기타 공휴일 }
  samiljeol:          { name: 3·1절,          group: 국경일 }
  gwangbokjeol:       { name: 광복절,          group: 국경일 }
  gaecheonjeol:       { name: 개천절,          group: 국경일 }
  hangeul_day:        { name: 한글날,          group: 국경일 }
  buddhas_birthday:   { name: 부처님오신날,     group: 기타 공휴일 }
  christmas:          { name: 기독탄신일,      group: 기타 공휴일 }
  constitution_day:   { name: 제헌절,          group: 국경일 }

# ---------------------------------------------------------------------------
# 규칙 버전 — 개정 이력이 곧 이 목록이다. 별도 changelog 를 두지 않는다.
# effective_from 기준 오름차순. 각 ruleset 은 다음 ruleset 직전까지 유효하다.
# ---------------------------------------------------------------------------
rulesets:

  # --- 대체공휴일 제도 도입 -------------------------------------------------
  - id: 제24828호
    effective_from: 2013-11-05
    summary: 대체공휴일 신설. 대상은 설 연휴·추석 연휴·어린이날.
    source: 2013-11-05 대통령령 제24828호 (설·추석·어린이날 대체공휴일 신설, 제3조)
    verified: false
    source_todo: |
      법제처 원문 대조 전.
      (1) effective_from 에 공포일을 넣었다. 시행일이 공포일과 같은지 미확인.
          "공포한 날부터 시행" 이 아니라면 이 날짜가 바뀐다.
      (2) 이 시점 제3조의 항·호 구조 미확인. 아래 clause id 는 구분을 위해 붙인
          이름이며 실제 조문 번호가 아니다. 2021년 전문개정으로 번호 체계가
          통째로 바뀌므로 이 버전에 1호·2호·3호 번호를 붙이면 안 된다.
      (3) 국경일이 이 버전에 없다는 것이 소급 금지의 핵심 근거다. 이것만은
          2015·2020년 광복절 사례로 간접 확인된다.
    clauses:
      - id: 제3조-설추석(2013)
        overlaps: [sunday, other_holiday_on_weekday]
        applies_to: [seollal, chuseok]
        verified: false
        source_todo: 원문 문구 미확인. 도입 당시부터 토요일이 빠져 있었는지 확인할 것.

      - id: 제3조-어린이날(2013)
        overlaps: [saturday, sunday, other_holiday_on_weekday]
        applies_to: [childrens_day]
        verified: false
        source_todo: |
          원문 문구 미확인. 어린이날은 도입 시점부터 토요일이 포함된 것으로 본다.
          국경일이 아닌데 토·일 모두 대상이라는 점이 group 으로 분기하면 안 되는 이유다.

  # --- 제3조 전문개정, 국경일 확대 ------------------------------------------
  - id: 제31930호
    effective_from: 2021-08-04
    summary: 제3조 전문개정. 3·1절·광복절·개천절·한글날 추가. 1항 1~3호 체계 성립.
    source: 2021-08-04 대통령령 제31930호 (제3조 전문개정, 국경일 확대)
    verified: false
    source_todo: |
      법제처 원문 대조 전.
      (1) effective_from 에 공포일을 넣었다. 시행일이 공포일과 같은지 미확인.
      (2) 이 날짜가 연중이라는 점이 중요하다. 2021년 3·1절은 이 시행일 이전이므로
          적용되지 않고, 같은 해 광복절·한글날은 적용된다. 같은 해 안에서 답이
          갈리므로 effective_from 은 연 단위로 두면 안 된다.
      (3) 3호의 적용 대상은 원문이 제2조의 호 범위로 규정하고 있어, 아래 목록은
          그 범위를 이 파일의 키로 옮긴 것이다. 구성이 정확한지 확인 필요.
    clauses:
      - id: 제3조제1항제1호
        overlaps: [saturday, sunday]
        applies_to: [samiljeol, childrens_day, gwangbokjeol, gaecheonjeol, hangeul_day]
        verified: false
        source_todo: 원문 대조 전. 적용 대상 목록 확인 필요.

      - id: 제3조제1항제2호
        overlaps: [sunday]
        applies_to: [seollal, chuseok]
        verified: false
        source_todo: |
          원문 대조 전.
          이 호에 saturday 가 없다는 것이 설·추석 비대칭의 전부다.
          2026년 추석 연휴 마지막날이 토요일인데 대체공휴일이 없는 이유가 여기다.

      - id: 제3조제1항제3호
        overlaps: [other_holiday_on_weekday]
        applies_to:
          [seollal, chuseok, samiljeol, childrens_day, gwangbokjeol, gaecheonjeol, hangeul_day]
        verified: false
        source_todo: 원문 대조 전. 제2조 호 범위와 이 목록이 일치하는지 확인 필요.

  # --- 부처님오신날·기독탄신일 추가 -----------------------------------------
  - id: 2023-05-04-개정
    effective_from: 2023-05-04
    summary: 부처님오신날·기독탄신일을 대체공휴일 대상에 추가.
    source: 2023-05-04 개정 (제3조 제1항, 부처님오신날·기독탄신일 추가)
    verified: false
    source_todo: |
      법제처 원문 대조 전.
      (1) 대통령령 호수 미확인. source 에 호수를 적지 않은 유일한 ruleset 이다.
      (2) effective_from 에 개정일을 넣었다. 시행일이 같은지 미확인.
      (3) 두 공휴일이 1호에 편입되었다고 두었으나, 이는 "토·일 모두 대상"이라는
          알려진 동작에서 역산한 것이지 조문을 확인한 결과가 아니다.
          3호 편입 여부도 마찬가지다. 원문에서 직접 확인할 것.
      (4) 2023년 부처님오신날(5월 말)이 이 시행일 이후이므로 그해부터 적용된다.
          시행일이 더 뒤라면 2023년에는 적용되지 않는다.
    clauses:
      - id: 제3조제1항제1호
        overlaps: [saturday, sunday]
        applies_to:
          [samiljeol, childrens_day, gwangbokjeol, gaecheonjeol, hangeul_day,
           buddhas_birthday, christmas]
        verified: false
        source_todo: 부처님오신날·기독탄신일의 편입 위치 미확인(위 (3) 참조).

      - id: 제3조제1항제2호
        overlaps: [sunday]
        applies_to: [seollal, chuseok]
        verified: false
        source_todo: 이 호는 2021년 버전에서 변경 없음. 원문 대조 전.

      - id: 제3조제1항제3호
        overlaps: [other_holiday_on_weekday]
        applies_to:
          [seollal, chuseok, samiljeol, childrens_day, gwangbokjeol, gaecheonjeol,
           hangeul_day, buddhas_birthday, christmas]
        verified: false
        source_todo: 부처님오신날·기독탄신일의 3호 편입 여부 미확인.

  # --- 제헌절 편입 ----------------------------------------------------------
  - id: 2026-제헌절-편입
    effective_from: 2026-05-11
    summary: 제헌절이 공휴일로 복원되며 대체공휴일 대상에 편입.
    source: |
      「공휴일에 관한 법률」 개정 (법률 제21338호, 2026-02-10 공포, 2026-05-11 시행)
      「관공서의 공휴일에 관한 규정」 개정 (대통령령 제36290호, 2026-04-30 공포)
    verified: false
    note: |
      아래 clauses 에서 제헌절을 국경일류(1호·3호)와 동일한 트리거로 둔 것은
      조문을 확인한 결과가 아니라 "국경일류는 토·일 모두 대상"이라는 분류에서
      역산한 가정이다.
      게다가 제헌절 대체공휴일은 2027년부터라는 기술이 따로 있어, 2026년 적용
      여부 자체가 미확정이다. open_questions 의 제헌절-대체공휴일-적용시점 참조.
      그 기술이 맞다면 제헌절을 1호·3호에서 빼고 2027년 ruleset 을 따로 만들어야 한다.

      용어 주의: 제헌절은 「국경일에 관한 법률」상 5대 국경일로 계속 국경일이었고
      2008년에 공휴일에서만 제외되었다. 2026년에 복원되는 것은 공휴일 지위다.
      "국경일이면 공휴일"로 모델링하면 2008~2025년 제헌절이 전부 반례가 된다.
    source_todo: |
      2차 출처 기준이며 법제처 원문 대조 전이다. 이 ruleset 은 다른 것보다 확신도가 낮다.
      (1) 대통령령 제36290호의 시행일 미확인. 공포일(2026-04-30)만 확보했다.
          effective_from 에는 법률의 시행일(2026-05-11)을 넣었다. 대통령령 시행일이
          이와 다르면 이 값이 바뀐다.
      (2) 제헌절이 1호·3호에 편입되는지 조문으로 확인하지 못했다(위 note 참조).
      (3) 2026-07-17 은 금요일이라 그해에는 대체공휴일이 발생하지 않는다.
          따라서 이 가정은 2026년 실제 사례로는 검증되지 않는다.
          제헌절이 주말에 걸리는 해가 와야 실증된다.
    clauses:
      - id: 제3조제1항제1호
        overlaps: [saturday, sunday]
        applies_to:
          [samiljeol, childrens_day, gwangbokjeol, gaecheonjeol, hangeul_day,
           buddhas_birthday, christmas, constitution_day]
        verified: false
        source_todo: 제헌절 편입 위치 미확인(위 (3) 참조).

