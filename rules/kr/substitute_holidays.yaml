open_questions:

  - id: 선거일-가지번호
    question: |
      임기만료 선거일은 제2조제10의2호(가지번호)다. 그런데 제3조 제1항 제1호·제3호는
      제10호까지만 열거하고 제1항 본문도 "제2호부터 제10호까지"라고 쓴다.
      가지번호가 그 범위에 포함되는지는 조문만으로 정해지지 않는다. 법제처 해석 필요.

      그래서 designated_holidays.yaml 의 kinds.election.substitute_eligible 을
      true 에서 unresolved 로 내렸다. 대상이라고도 아니라고도 주장하지 않는다.

      실무 영향: 현재 수록된 선거일은 전부 수요일이고 다른 공휴일과 겹치지도 않아
      결과가 달라지지 않는다. 조회 범위를 넓히기 전에 확정할 것.

  # --- 해소된 항목 (기록용) ---
  # 과거-제2조-호-배열
  #   2021-08-04 ~ 2026-04-30 배열 확보. article2.arrangements 에 들어 있다.
  #   제5호가 2005-06-30 부터 공석이었고 제36290호가 그 빈 자리에 노동절을 넣은 것이라
  #   재번호가 아니었다. 제6호 이하는 2021년부터 현재까지 번호가 같다.
  #   한때 이 구간 전체를 유도 불가로 두었는데, 배열을 못 본 상태의 과잉 보수였다.
  #   2021-10-11, 2022-10-10, 2025-03-03, 2026-03-02 이 다시 유도된다. 종결.
  #
  # 제36290호-제3조-시행일
  #   부칙 확인 완료. 단서가 미루는 것은 제2조 각 호 외의 부분 단서와 제2조제2호뿐이고
  #   제3조는 포함되지 않는다. 제3조 시행일은 2026-05-01 로 확정. 종결.
  #
  # 제헌절-대체공휴일-적용시점
  #   시행일 2026-05-11 확정. 제2조제2호가 국경일을 통째로 참조하고 제헌절이
  #   「국경일에 관한 법률」상 국경일이므로, 별도 열거 없이 제3조 1호·3호에 들어온다.
  #   토·일 모두 대상이며 2027-07-17(토)이 첫 발동이다. 종결.
  #
  # 제5호-정체
  #   제5호는 부처님오신날이다. "2023 대비 제5호 추가"로 보였던 것은 노동절 삽입에
  #   따른 재번호의 착시였다. 실질적 추가가 아니다. 종결.
  #
  # 나무위키 "제3조 개정 없음" 기술
  #   입법예고안 기준으로 확인됨. 최종 개정에서는 제3조가 함께 바뀌었다. 폐기.
  #   같은 출처를 다시 근거로 삼지 말 것.

  - id: 2013년-조문-구조
    question: |
      2013년 신설 제3조의 항·호 구조를 확인하지 못해 clause id 를 임시 이름으로 두었다.
      원문 확인 후 실제 번호로 바꿀 것. 2021년 전문개정 전후로 번호 체계가 다르므로
      두 버전에 같은 번호를 쓰면 안 된다.

  - id: 3호-귀속-불명
    question: |
      평일에 공휴일이 겹쳐 생긴 대체공휴일에서, 겹친 둘 중 어느 쪽이 트리거인지
      확정되지 않았다. 발행 범위(2020~2031) 안에 두 건이 있다.

        2025-05-06   원인일 05-05. 어린이날 + 부처님오신날
        2028-10-05   원인일 10-03. 개천절 + 추석

      결과(그 날짜가 대체공휴일이라는 것)는 정답 픽스처에 박아 두었고 귀속은
      확정하지 않았다. 두 공휴일 모두 3호 적용 대상이라 어느 쪽을 트리거로
      잡아도 날짜는 같으므로, 지금은 결정하지 않아도 막히지 않는다.

      --- 외부 소스도 갈린다 ---
      2028-10-05 에 대해 KASI 특일정보는 "대체공휴일(추석)" 이라고 적는다
      (sources/kr/cache/getRestDeInfo_2028.xml, 조회 2026-08-08).
      우리 코드가 고르는 대표값(holiday_calendar.py 의 source_key)은 개천절이다.
      배열 순서에서 나온 값이라 근거가 아니고, KASI 도 근거를 밝히지 않는다.
      어느 쪽이 맞는지는 이 항목이 풀려야 정해진다.

      참고로 2025-05-06 은 KASI 가 원인 없이 "대체공휴일" 로만 적는다.
      같은 성격의 두 건을 KASI 스스로 다르게 표기하는 셈이다.

      --- 그래서 SUMMARY 는 둘 다 적는다 ---
      .ics 의 SUMMARY 는 "대체공휴일(개천절·추석)" 처럼 겹친 대상을 모두 쓴다.
      하나를 골라 적으면 우리가 고른 것이 확인된 사실처럼 읽히고, 위 KASI 와의
      불일치가 그대로 발행물에 실린다. 둘 다 적으면 그 날의 실제 상태를 쓰는
      것이 되고, 법이 귀속을 정하지 않았다는 사실 자체가 정보가 된다.
      rules/kr/feed.py 의 _substitute_origin() 이 그 자리다.

      이 항목이 풀리면 그때 하나로 줄일 수 있다. 줄여도 UID 는 바뀌지 않는다 —
      대체공휴일 token 은 'sub' 하나이고 원인을 담지 않는다.

  - id: 픽스처구멍-배치규칙-미검증
    question: |
      제3조제3항(대체공휴일이 토요일이면 다음 비공휴일로 재배치)을 지워도
      테스트가 하나도 깨지지 않는다. 변이 테스트로 확인했다.

      placement_rules 를 읽어 두기만 하고 계산하는 코드가 아직 없기 때문이다.
      제1항 본문과 제2항도 같은 상태다. 배치 계산을 구현하기 전까지 이 세 규칙은
      데이터로만 존재하며 어떤 테스트도 통과 여부를 보증하지 않는다.

      검증 케이스는 지금 지어내지 않는다. 3항이 실제로 발동하려면 대체공휴일이
      토요일에 떨어지는 날짜 배치가 필요한데, 그런 해를 손으로 찾다가 틀리면
      틀린 정답이 픽스처에 박힌다. 2036년에 사례가 있다는 기술이 있으나 미확인이다.

      순서는 이렇게 간다. 먼저 배치 계산을 구현하고, 그 구현으로 연도 범위를
      스캔해서 3항이 발동하는 날짜를 뽑은 다음, 그 날짜를 원문·관보로 확인해
      정답 픽스처에 넣는다. 구현이 스스로 뽑은 답을 그대로 정답으로 삼지 말 것.
      확인을 거치지 않으면 구현의 버그가 정답으로 굳는다.

  - id: 겹침-판정-대상-단위
    question: |
      설·추석 연휴에서 겹침을 판정하는 단위가 연휴 전체인지 개별 날짜인지 확정 필요.
      제3조제2항의 연장 규칙과 맞물리므로 배치 계산 구현 전에 답이 있어야 한다.
