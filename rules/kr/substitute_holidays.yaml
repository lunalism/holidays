# 대한민국 대체공휴일 규칙 테이블
#
# 이 파일은 규칙 데이터만 담는다. 조회·유도는 rules/kr/substitute_rules.py 가 한다.
# tests/fixtures/kr.yaml 이 "정답"이라면 이 파일은 그 정답을 만들어야 하는 "입력"이다.
# 둘은 독립적으로 관리하고, tests/test_substitute_rules.py 가 서로 대조한다.
#
# ---------------------------------------------------------------------------
# 구조
# ---------------------------------------------------------------------------
#
# 조문 구조를 그대로 옮긴다. 공휴일별로 조건을 적는 것이 아니라, 조문의 각 호가
# "무엇과 겹칠 때"(overlaps)와 "어떤 공휴일에"(applies_to) 적용되는지를 적고,
# 공휴일별 결과는 거기서 유도한다.
#
#   제3조제1항제1호  overlaps: [saturday, sunday]              → 토·일 모두 대상
#   제3조제1항제2호  overlaps: [sunday]                        → 일요일만 대상
#   제3조제1항제3호  overlaps: [other_holiday_on_weekday]      → 주말 판정에 기여 없음
#
# 흔히 말하는 "설·추석은 일요일만 대상"이라는 비대칭은 어디에도 예외로 적혀 있지 않다.
# 설·추석이 2호에 속하고 국경일류가 1호에 속한다는 소속 관계에서 유도된다.
# 별도 필드나 분기문으로 하드코딩하지 말 것. 그렇게 하면 같은 사실이 두 곳에 적히고
# 한쪽만 고쳐질 때 조용히 어긋난다.
#
# 규칙 개정은 rulesets 의 버전으로 표현한다. 각 ruleset 은 effective_from 부터
# 다음 ruleset 의 effective_from 전날까지 유효하다.
# effective_until 은 저장하지 않는다. 저장하면 두 곳에 적히고 어긋날 수 있다.
# 계산 시에는 그 날짜에 유효했던 ruleset 만 적용한다. 최신 규칙을 소급하지 않는다.
#
# ---------------------------------------------------------------------------
# 이 파일의 범위 밖
# ---------------------------------------------------------------------------
#   - 임시공휴일: 국무회의 의결로 그때그때 지정되며 규칙이 없다. 하드코딩 대상이다.
#   - 공휴일 날짜 계산(음력 환산 등).
#   - 어떤 날이 공휴일인가의 전체 목록. 이 표는 이미 공휴일인 것이 겹쳤을 때만 다룬다.
#
# ---------------------------------------------------------------------------
# verified 필드
# ---------------------------------------------------------------------------
# 법제처 원문 대조를 마친 항목만 verified: true 가 된다.
# source 에 값이 있어도 verified: false 이면 아직 2차 출처 수준이라는 뜻이다.
# tests/test_substitute_rules.py 의 감사 테스트가 미검증 항목을 추적한다.
#
# 1차 대조(국가법령정보센터 현행 조문) 완료 범위
#   - 제31930호·제33448호·제36290호의 조문 존재와 개정 내용
#   - 제3조 제2항·제3항의 문구
#
# 2차 대조 완료
#   - 제2조 각 호의 배열을 2021-08-04 이후 두 시점 모두 확보(article2.arrangements)
#   - 제5호가 2005-06-30 부터 공석이었고 제36290호가 그 빈 자리에 노동절을 넣었다는
#     것까지 확인. 재번호가 아니므로 제6호 이하 번호는 2021년부터 동일하다.
#   - 그 결과 제31930호·제33448호의 clauses 도 호 번호로 풀 수 있게 되었고
#     clause 단위 verified 가 true 로 올라갔다.
#
# 남은 것
#   - 제24828호(2013) 시점의 항·호 구조. clause id 가 실제 조문 번호가 아니다.
#   - 제3조제1항 본문의 배치 문구 위치.

version: 2
country: kr

# ---------------------------------------------------------------------------
# coverage — 이 표를 신뢰할 수 있는 구간.#
# 두 축을 구분한다.
#   from              데이터 완결성 경계. 이전은 데이터를 채우지 않았으므로
#                     조회 자체를 UnsupportedYear 로 거부한다.
#   confirmed_through 규칙 개정을 확인한 시점. 이후도 답하되 provisional: true 를
#                     달아 돌려준다. 거부하지 않는다.
#
# 왜 이후를 거부하지 않는가.
#   피드는 3~5년치를 미리 발행해야 한다. 상한을 두면 발행 자체가 막힌다.
#   그리고 미래 연도에 임시공휴일이 없는 것은 누락이 아니라 아직 지정되지 않은
#   상태다. 없는 것이 정상이므로 오류로 다룰 이유가 없다.
#   반대로 from 이전은 있었어야 할 데이터가 없는 것이라 성격이 다르다.
#
# from: 2013-11-05
#   대체공휴일 제도가 신설된 날. 그 이전은 "규칙 없음"이 정답이라 원리적으로는
#   답할 수 있지만, 같은 구간의 양력·지정 공휴일 데이터가 신뢰 구간 밖이라
#   답을 내봐야 쓸 데가 없다. 제도 시작에 맞춰 자른다.
#
# confirmed_through: 2028-12-31
#   마지막 ruleset 이 2026-05-01 부터다. 그 이후 개정 여부는 확인하지 않았으나,
#   KASI 특일정보 2028 년까지의 대체공휴일이 이 표의 유도 결과와 일치한다.
#   2029 년 이후는 KASI 도 빈 응답이라 대조할 대상이 없다.
#   이후 날짜에는 마지막 ruleset 을 그대로 적용하되 provisional 로 표시한다.
#   개정이 있었다면 틀린 답이 되므로 확정으로 쓰지 말 것.
# ---------------------------------------------------------------------------
coverage:
  from: 2013-11-05
  confirmed_through: 2028-12-31

# ---------------------------------------------------------------------------
# 요일 기반 공휴일
# ---------------------------------------------------------------------------
weekly_holidays:
  - sunday

# 토요일은 여기에 없다. 의도적이다.
# 공휴일 규정은 일요일을 공휴일로 열거하지만 토요일은 열거하지 않는다.
# 토요일은 (공무원 복무 기준의) 휴무일이지 공휴일이 아니다.
# 이 목록은 "다음 비공휴일"을 찾을 때 어느 날을 건너뛰는지 결정한다.
# 제3조제3항이 대체공휴일을 토요일에서 다시 밀어내는 것도 토요일이 공휴일이
# 아니어서 그냥 두면 대체공휴일이 무의미해지기 때문이다.

# 규칙 판정에서는 일요일을 공휴일로 다루지만, 발행되는 .ics 피드에는
# 매주 일요일을 이벤트로 내보내지 않는다. 둘은 별개의 결정이다.
sunday_in_output: false

# ---------------------------------------------------------------------------
# 겹침 조건 어휘
# ---------------------------------------------------------------------------
overlap_vocabulary:
  saturday:
    description: 해당 공휴일이 토요일과 겹치는 경우.
  sunday:
    description: 해당 공휴일이 일요일과 겹치는 경우.
  other_holiday_on_weekday:
    description: |
      해당 공휴일이 토요일·일요일이 아닌 날에 다른 공휴일과 겹치는 경우.
      토·일을 명시적으로 배제하므로 주말 대상 여부 판정에는 기여하지 않는다.
      일요일이 이 조건으로 흘러들어오지 않는다는 점이 중요하다.
      일요일은 1호·2호에서 직접 지명된다.

# ---------------------------------------------------------------------------
# 대체공휴일을 어디에 두는가 (배치 규칙)
# 위 overlaps 가 "생기는가"를 정하고, 아래가 "어디에 생기는가"를 정한다.
# ---------------------------------------------------------------------------
placement_rules:

  - id: 제3조제1항
    rule: 겹친 공휴일 다음의 첫 번째 비공휴일을 대체공휴일로 한다.
    verified: false
    source_todo: |
      이 문장이 제1항 본문에 있는지, 각 호에 나뉘어 있는지 미확인.
      법제처 원문 대조 시 위치를 확정할 것.

  - id: 제3조제2항
    rule: |
      대체공휴일이 같은 날에 겹치는 경우 다음 첫 번째 비공휴일까지 연장한다.
      즉 한 연휴에서 두 날 이상이 겹치면 대체공휴일도 그만큼 늘어난다.
    verified: true
    source: 국가법령정보센터 현행 조문

  - id: 제3조제3항
    rule: |
      대체공휴일이 토요일이면 그 다음 첫 번째 비공휴일로 옮긴다.
      토요일은 공휴일이 아니므로 그냥 두면 대체공휴일이 실질적 의미를 잃는다.
    verified: true
    source: 국가법령정보센터 현행 조문

# ---------------------------------------------------------------------------
# 공휴일 레지스트리 — 이 프로젝트가 쓰는 공휴일 키의 정본 목록.
# solar_holidays.yaml / lunar_holidays.yaml 의 key 도 전부 여기 있어야 한다.
# clauses 의 applies_to 도 여기서만 키를 고른다.
#
# group 은 설명용이며 계산에 쓰지 않는다. group 으로 분기하면 안 된다.
# 어린이날·부처님오신날·기독탄신일은 국경일이 아닌데 1호에 함께 들어 있다.
#
# aliases 는 정답 픽스처가 쓰는 표기를 키로 잇기 위한 것이다.
# 픽스처는 사람이 읽는 이름("추석")을 쓰고 표는 연휴 전체 이름("추석 연휴")을 쓴다.
# 이 대응을 파이썬에 두면 이름을 하나 늘릴 때마다 코드를 고쳐야 한다.
#
# 어느 호에도 안 들어가는 항목(신정·현충일)이 있는 것은 정상이다.
# 대체공휴일 대상이 아니라는 뜻이며, 부재로 표현한다.
# ---------------------------------------------------------------------------
holidays:
  new_years_day:      { name: 1월 1일,        group: 기타 공휴일, aliases: [신정] }
  labor_day:          { name: 노동절,          group: 기타 공휴일, aliases: [근로자의 날] }
  seollal:            { name: 설날 연휴,      group: 명절,       aliases: [설날] }
  chuseok:            { name: 추석 연휴,      group: 명절,       aliases: [추석] }
  childrens_day:      { name: 어린이날,        group: 기타 공휴일 }
  samiljeol:          { name: 3·1절,          group: 국경일 }
  memorial_day:       { name: 현충일,          group: 기타 공휴일 }
  gwangbokjeol:       { name: 광복절,          group: 국경일 }
  gaecheonjeol:       { name: 개천절,          group: 국경일 }
  hangeul_day:        { name: 한글날,          group: 국경일 }
  buddhas_birthday:   { name: 부처님오신날,     group: 기타 공휴일 }
  christmas:          { name: 기독탄신일,      group: 기타 공휴일, aliases: [성탄절] }
  constitution_day:   { name: 제헌절,          group: 국경일 }

# ---------------------------------------------------------------------------
# 제2조 각 호의 배열 — 제3조가 적용 대상을 이 호 번호로 규정한다.
#
# 제3조의 clauses 는 article2_items 로 호 번호를 적고, 이 표를 거쳐 공휴일 키가
# 된다. 두 단계로 나눈 이유는 조문이 실제로 그렇게 쓰여 있기 때문이다.
# 호 번호를 공휴일 이름으로 미리 풀어서 적으면 개정 때 어디가 바뀌었는지 알 수 없다.
#
# 배열이 시점마다 다르므로 arrangements 로 나눠 둔다. 한때 "노동절 삽입으로
# 번호가 밀렸다"고 보고 2021~2026 구간을 통째로 유도 불가로 둔 적이 있는데,
# 그 판단은 틀렸다. 제5호가 2005-06-30 부터 공석이었고 제36290호는 그 빈 자리를
# 채운 것이라 제6호 이하 번호는 그대로다. 배열을 확보하기 전의 과잉 보수였다.
#
# holidays 가 빈 항목은 이 파일 밖에서 다룬다는 뜻이다.
#   제1호 일요일        → weekly_holidays
#   제10의2호 선거일     → designated_holidays.yaml (kind: election)
#   제11호 수시 지정     → designated_holidays.yaml (kind: temporary)
# ---------------------------------------------------------------------------
article2:
  # 배열은 시점별로 나눠 둔다. 각 arrangement 는 effective_from 부터
  # effective_until 까지 유효하다. clause 의 article2_items 는 그 ruleset 의
  # effective_from 이 속한 arrangement 로 푼다.
  arrangements:

    - id: 2021-2026 배열
      effective_from: 2021-08-04
      effective_until: 2026-04-30
      verified: true
      source: 국가법령정보센터 — 해당 시점 「관공서의 공휴일에 관한 규정」 제2조
      note: |
        제5호가 2005-06-30 부터 공석이다. 제36290호가 노동절을 넣은 자리가 바로
        이 빈 5호이며, 재번호가 아니다. 그래서 제6호 이하는 2021년부터 현재까지
        번호가 그대로다. 이 사실이 확인되기 전에는 번호가 밀렸다고 보고 이 구간
        전체를 유도 불가로 두었으나, 그 판단은 틀렸다.
      items:
        1: { name: 일요일, holidays: [] }
        2:
          name: 국경일 중 3·1절·광복절·개천절·한글날
          holidays: [samiljeol, gwangbokjeol, gaecheonjeol, hangeul_day]
          note: |
            이 시점에는 제헌절이 공휴일이 아니라 열거에서 빠져 있다.
            제36290호가 이 호를 「국경일에 관한 법률」 참조로 바꾸면서 제헌절이 들어온다.
        3: { name: 1월 1일, holidays: [new_years_day] }
        4: { name: 설날 연휴, holidays: [seollal] }
        5:
          name: 삭제
          holidays: []
          note: 2005-06-30 삭제되어 공석. 제36290호가 이 자리에 노동절을 넣는다.
        6: { name: 부처님오신날, holidays: [buddhas_birthday] }
        7: { name: 어린이날, holidays: [childrens_day] }
        8: { name: 현충일, holidays: [memorial_day] }
        9: { name: 추석 연휴, holidays: [chuseok] }
        10: { name: 기독탄신일, holidays: [christmas] }
        10의2: { name: 임기만료에 의한 선거의 선거일, holidays: [] }
        11: { name: 수시 지정 (임시공휴일), holidays: [] }

    - id: 현행 배열
      effective_from: 2026-05-01
      effective_until:
      verified: true
      source: 국가법령정보센터 현행 조문 (대통령령 제36290호)
      note: |
        제2호의 내용(국경일에 제헌절 포함)은 2026-05-11 부터다. 번호 체계 자체는
        2026-05-01 부터 같다. 제헌절이 언제부터 공휴일인지는 solar_holidays.yaml 의
        constitution_day.effective_from 이 들고 있으므로 여기서 나눌 필요가 없다.
      items:
        1: { name: 일요일, holidays: [] }
        2:
          name: 국경일 (「국경일에 관한 법률」)
          holidays: [samiljeol, constitution_day, gwangbokjeol, gaecheonjeol, hangeul_day]
          note: |
            개별 열거에서 「국경일에 관한 법률」 참조로 바뀌었다. 그래서 제헌절이
            별도 열거 없이 들어온다. 한 호에 공휴일이 다섯이고 호 단위로 적용
            대상이 정해지므로 국경일은 전부 같은 대우를 받는다.
        3: { name: 1월 1일, holidays: [new_years_day] }
        4: { name: 설날 연휴, holidays: [seollal] }
        5:
          name: 노동절 (5월 1일)
          holidays: [labor_day]
          note: |
            2005-06-30 부터 비어 있던 제5호에 제36290호가 신설했다.
            빈 자리를 채운 것이므로 제6호 이하 번호는 그대로다.
        6: { name: 부처님오신날, holidays: [buddhas_birthday] }
        7: { name: 어린이날, holidays: [childrens_day] }
        8:
          name: 현충일
          holidays: [memorial_day]
          note: 제3조 어느 호에도 안 들어간다. 대체공휴일 대상이 아니다.
        9: { name: 추석 연휴, holidays: [chuseok] }
        10: { name: 기독탄신일, holidays: [christmas] }
        10의2:
          name: 임기만료에 의한 선거의 선거일
          holidays: []
          note: |
            가지번호다. 제3조 제1항 제1호·제3호는 제10호만 열거하고 제1항 본문도
            "제2호부터 제10호까지"라고 쓴다. 가지번호가 그 범위에 포함되는지는
            법제처 해석이 필요하다. open_questions 의 선거일-가지번호 참조.
        11: { name: 수시 지정 (임시공휴일), holidays: [] }

# ---------------------------------------------------------------------------
# 규칙 버전 — 개정 이력이 곧 이 목록이다. 별도 changelog 를 두지 않는다.
# effective_from 기준 오름차순. 각 ruleset 은 다음 ruleset 직전까지 유효하다.
#
# provisions 는 한 개정령 안에서 조항별 시행일이 갈릴 때 적는다.
# "하나의 개정령 = 하나의 시행일"이 아니다. 제36290호가 그 반례다.
# ---------------------------------------------------------------------------
rulesets:

  # --- 대체공휴일 제도 도입 -------------------------------------------------
  - id: 제24828호
    effective_from: 2013-11-05
    summary: 대체공휴일 신설. 대상은 설 연휴·추석 연휴·어린이날.
    source: 2013-11-05 대통령령 제24828호 (설·추석·어린이날 대체공휴일 신설, 제3조)
    verified: false
    source_todo: |
      법제처 원문 대조 전.
      (1) effective_from 에 공포일을 넣었다. 시행일이 공포일과 같은지 미확인.
          "공포한 날부터 시행" 이 아니라면 이 날짜가 바뀐다.
      (2) 이 시점 제3조의 항·호 구조 미확인. 아래 clause id 는 구분을 위해 붙인
          이름이며 실제 조문 번호가 아니다. 2021년 전문개정으로 번호 체계가
          통째로 바뀌므로 이 버전에 1호·2호·3호 번호를 붙이면 안 된다.
      (3) 국경일이 이 버전에 없다는 것이 소급 금지의 핵심 근거다. 이것만은
          2015·2020년 광복절 사례로 간접 확인된다.
    clauses:
      - id: 제3조-설추석(2013)
        overlaps: [sunday, other_holiday_on_weekday]
        applies_to: [seollal, chuseok]
        verified: false
        source_todo: 원문 문구 미확인. 도입 당시부터 토요일이 빠져 있었는지 확인할 것.

      - id: 제3조-어린이날(2013)
        overlaps: [saturday, sunday, other_holiday_on_weekday]
        applies_to: [childrens_day]
        verified: false
        source_todo: |
          원문 문구 미확인. 어린이날은 도입 시점부터 토요일이 포함된 것으로 본다.
          국경일이 아닌데 토·일 모두 대상이라는 점이 group 으로 분기하면 안 되는 이유다.

  # --- 제3조 전문개정, 국경일 확대 ------------------------------------------
  - id: 제31930호
    effective_from: 2021-08-04
    summary: 제3조 전문개정. 3·1절·광복절·개천절·한글날 추가. 1항 1~3호 체계 성립.
    source: |
      2021-08-04 대통령령 제31930호 (제3조 전문개정, 국경일 확대)
      국가법령정보센터 현행 조문 대조 완료.
    verified: true
    note: |
      이 날짜가 연중이라는 점을 기억할 것. 2021년 3·1절은 시행일 이전이라
      적용되지 않고 같은 해 광복절·한글날은 적용된다. 같은 해 안에서 답이 갈린다.
      2021-10-11(한글날 대체공휴일)이 이 ruleset 으로 유도되는 대표 사례다.
    clauses:
      - id: 제3조제1항제1호
        overlaps: [saturday, sunday]
        article2_text: 제2조제2호, 제7호
        article2_items: [2, 7]
        verified: true
        source: |
          국가법령정보센터 현행 조문.
          제2호는 이 시점 기준 3·1절·광복절·개천절·한글날, 제7호는 어린이날.

      - id: 제3조제1항제2호
        overlaps: [sunday]
        article2_text: 제2조제4호 또는 제9호
        article2_items: [4, 9]
        verified: true
        source: |
          국가법령정보센터 현행 조문. 제4호 설날 연휴, 제9호 추석 연휴.
          이 호에 토요일이 없는 것이 설·추석 비대칭의 전부다.

      - id: 제3조제1항제3호
        overlaps: [other_holiday_on_weekday]
        article2_text: 제2조제2호, 제4호, 제7호, 제9호
        article2_items: [2, 4, 7, 9]
        verified: true
        source: 국가법령정보센터 현행 조문

  # --- 부처님오신날·기독탄신일 추가 -----------------------------------------
  - id: 제33448호
    effective_from: 2023-05-04
    summary: 부처님오신날·기독탄신일을 대체공휴일 대상에 추가.
    source: |
      2023-05-04 대통령령 제33448호 (제3조 제1항 개정)
      국가법령정보센터 현행 조문 대조 완료.
    verified: true
    note: |
      2023-05-29 부처님오신날 대체공휴일이 이 ruleset 으로 유도되는 대표 사례다.
      서울고등법원 판결이 그 근거로 제3조 제1항 제1호와 제2조 제6호를 인용한다.
    clauses:
      - id: 제3조제1항제1호
        overlaps: [saturday, sunday]
        article2_text: 제2조제2호, 제6호, 제7호, 제10호
        article2_items: [2, 6, 7, 10]
        verified: true
        source: |
          국가법령정보센터 현행 조문. 제6호 부처님오신날, 제10호 기독탄신일이 추가된 개정.

          교차 근거: 서울고등법원 판결이 2023-05-29 부처님오신날 대체공휴일의 근거로
          「관공서의 공휴일에 관한 규정」 제3조 제1항 제1호와 제2조 제6호를 인용한다.
          제6호 = 부처님오신날 이라는 매핑이 법원 문서로도 확인된다.

      - id: 제3조제1항제2호
        overlaps: [sunday]
        article2_text: 제2조제4호 또는 제9호
        article2_items: [4, 9]
        verified: true
        source: 국가법령정보센터 현행 조문. 제31930호에서 변경 없음.

      - id: 제3조제1항제3호
        overlaps: [other_holiday_on_weekday]
        article2_text: 제2조제2호, 제4호, 제6호, 제7호, 제9호, 제10호
        article2_items: [2, 4, 6, 7, 9, 10]
        verified: true
        source: 국가법령정보센터 현행 조문

  # --- 제헌절 편입 ----------------------------------------------------------
  - id: 제36290호
    effective_from: 2026-05-01
    summary: 제2조·제3조 개정. 노동절 신설로 호 번호가 밀리고 국경일에 제헌절이 편입됨.
    source: |
      2026-04-30 대통령령 제36290호 (제2조·제3조 개정)
      「공휴일에 관한 법률」 개정 (법률 제21338호, 2026-02-10 공포, 2026-05-11 시행)
      국가법령정보센터 현행 조문 대조 완료.
    verified: true
    provisions:
      - target: 제2조 (제2호 제외)
        effective_from: 2026-05-01
        note: 노동절(제6호) 신설 포함. 이 삽입으로 뒤 호 번호가 전부 밀렸다.
        verified: true
      - target: 제2조제2호
        effective_from: 2026-05-11
        note: 국경일 정의에 제헌절 편입. 개정령 안에서 이 호만 시행일이 다르다.
        verified: true
      - target: 제3조
        effective_from: 2026-05-01
        note: |
          부칙 확인 완료. 단서가 미루는 것은 제2조 각 호 외의 부분 단서와
          제2조제2호뿐이며 제3조는 거기 없다. 따라서 개정령 기본 시행일을 따른다.
        verified: true
    note: |
      노동절이 제5호로 들어오면서 제3조 제1항 제1호·제3호의 대상이 되었다.
      그 결과 2027-05-01(토) 다음 비공휴일인 2027-05-03(월)이 대체공휴일로 유도된다.
      조문에서 나온 결과이지만 실무 사례로 확인할 방법이 없다. 2027 년은
      confirmed_through 이후라 provisional 로 표시되어 나가며, 그대로 둔다.
      실제 운영이 다르게 흘러가면 그때 개정 여부를 확인해서 반영할 것.

      이 ruleset 부터 clauses 를 article2_items 로 적고 article2 표를 거쳐 푼다.
      호 번호를 공휴일 이름으로 미리 풀어 적지 않는 이유는 조문이 호 번호로
      쓰여 있고, 개정 때 무엇이 바뀌었는지 그 형태라야 드러나기 때문이다.

      앞선 ruleset 들이 unresolved 인 것도 여기서 설명된다. 노동절이 제6호로
      들어오면서 뒤 번호가 밀렸으므로 같은 "제5호"가 개정 전후로 다른 공휴일을
      가리킨다. 현행 배열을 과거 시점에 갖다 쓰면 조용히 틀린다.

      용어 주의: 제헌절은 「국경일에 관한 법률」상 5대 국경일로 계속 국경일이었고
      2008년에 공휴일에서만 제외되었다. 2026년에 복원되는 것은 공휴일 지위다.
      제2조제2호가 국경일을 통째로 참조하므로 제헌절은 별도 열거 없이 1호·3호에 들어온다.
    clauses:
      - id: 제3조제1항제1호
        overlaps: [saturday, sunday]
        article2_text: 제2조제2호, 제5호부터 제7호까지, 제10호
        article2_items: [2, 5, 6, 7, 10]
        verified: true
        source: 국가법령정보센터 현행 조문

      - id: 제3조제1항제2호
        overlaps: [sunday]
        article2_text: 제2조제4호 또는 제9호
        article2_items: [4, 9]
        verified: true
        source: |
          국가법령정보센터 현행 조문.
          제4호 설날 연휴, 제9호 추석 연휴. 이 호에 토요일이 없는 것이 비대칭의 전부다.

      - id: 제3조제1항제3호
        overlaps: [other_holiday_on_weekday]
        article2_text: 제2조제2호, 제4호부터 제7호까지, 제9호, 제10호
        article2_items: [2, 4, 5, 6, 7, 9, 10]
        verified: true
        source: 국가법령정보센터 현행 조문

