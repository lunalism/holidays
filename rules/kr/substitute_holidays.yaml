# ---------------------------------------------------------------------------
# 미해결 — 구현 착수 전에 답이 필요한 것들
#
# 해소된 항목 (기록용):
#   - 일요일 출력 여부 → sunday_in_output: false 로 확정.
#   - effective_from 단위 → 날짜 단위로 확정. 2021-08-04 가 연중이라 필요했다.
#   - 연휴 다중 겹침 일수 → 제3조제2항으로 해소. 원문 대조는 남아 있다.
#   - 표와 정답의 교차검증 → tests/test_substitute_rules.py 로 해소.
# ---------------------------------------------------------------------------
open_questions:

  - id: 제헌절-대체공휴일-적용시점
    question: |
      제헌절 대체공휴일은 2027년부터라는 기술이 있음.
      2026년 적용 여부는 대통령령 제36290호 부칙 확인 전까지 미확정.

      현재 이 표는 2026-05-11 부터 제헌절을 1호·3호에 넣어 두었다. 그 기술이 맞다면
      제헌절을 2026 ruleset 에서 빼고 2027년 시작 ruleset 을 하나 더 만들어야 한다.
      tests/fixtures/kr.yaml 의 rule-제헌절-2026 정답도 false/false 로 뒤집힌다.
      즉 이 항목은 표와 정답 양쪽을 동시에 바꾸는 미해결 사항이다.

  - id: 2013년-조문-구조
    question: |
      2013년 신설 제3조의 항·호 구조를 확인하지 못해 clause id 를 임시 이름으로 두었다.
      원문 확인 후 실제 번호로 바꿀 것. 2021년 전문개정 전후로 번호 체계가 다르므로
      두 버전에 같은 번호를 쓰면 안 된다.

  - id: 픽스처구멍-공휴일간-겹침
    question: |
      제1항제3호(토·일이 아닌 날에 다른 공휴일과 겹침)를 표에서 통째로 지워도
      테스트가 하나도 깨지지 않는다. 변이 테스트로 확인했다.

      정답 픽스처의 substitute_rules 가 토·일 겹침만 검증하고, days 에도 공휴일끼리
      겹치는 날짜가 하나도 없기 때문이다. 3호는 지금 아무에게도 검증받지 않는다.
      어린이날과 부처님오신날이 겹치는 해처럼 3호가 실제로 발동하는 케이스를
      정답 픽스처에 넣어야 한다.

  - id: 픽스처구멍-배치규칙-미검증
    question: |
      제3조제3항(대체공휴일이 토요일이면 다음 비공휴일로 재배치)을 지워도
      테스트가 하나도 깨지지 않는다. 변이 테스트로 확인했다.

      placement_rules 를 읽어 두기만 하고 계산하는 코드가 아직 없기 때문이다.
      제1항 본문과 제2항도 같은 상태다. 배치 계산을 구현하기 전까지 이 세 규칙은
      데이터로만 존재하며 어떤 테스트도 통과 여부를 보증하지 않는다.
      배치 계산을 붙일 때 대체공휴일이 토요일에 떨어지는 날짜를 정답 픽스처에
      함께 넣을 것. 그 케이스가 없으면 구현해도 여전히 검증되지 않는다.

  - id: 겹침-판정-대상-단위
    question: |
      설·추석 연휴에서 겹침을 판정하는 단위가 연휴 전체인지 개별 날짜인지 확정 필요.
      제3조제2항의 연장 규칙과 맞물리므로 배치 계산 구현 전에 답이 있어야 한다.
