#
# 해소된 항목 (기록용):
#   - 일요일 출력 여부 → sunday_in_output: false 로 확정.
#   - effective_from 단위 → 날짜 단위로 확정. 2021-08-04 가 연중이라 필요했다.
#   - 연휴 다중 겹침 일수 → 제3조제2항으로 해소. 원문 대조는 남아 있다.
#   - 표와 정답의 교차검증 → tests/test_substitute_rules.py 로 해소.
