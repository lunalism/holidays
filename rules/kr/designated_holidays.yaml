# 지정 공휴일 — 규칙으로 유도할 수 없어 날짜를 하나씩 적어 두는 것들
#
# 선거일과 임시공휴일을 한 표에 담고 kind 로 구분한다. 둘 다 "그때그때 정해지는"
# 성격이지만 근거 조항과 대체공휴일 적용 여부가 다르므로 kind 가 그 차이를 진다.
#
# 절대 규칙으로 유도하지 말 것.
#   임시공휴일은 국무회의 심의·의결로 그때그때 정해지고 규칙성이 없다.
#   "연휴 앞뒤는 쉰다", "징검다리는 쉰다" 같은 패턴은 존재하지 않는다.
#   선거일은 형태상 계산이 되는 것처럼 보이지만 실제 날짜는 공고로 확정되고,
#   궐위 선거는 예측 대상이 아니다.
#   여기 없는 날짜는 공휴일이 아니다. 빈칸을 추론으로 메우면 없는 공휴일이 생긴다.
#
# ---------------------------------------------------------------------------
# 수록 범위 — 이 표는 아직 완전하지 않다
# ---------------------------------------------------------------------------
# 지금 실려 있는 것은 정답 픽스처가 요구하는 날짜뿐이다. 임의의 연도를 조회하면
# 빠진 공휴일이 있다. 확인된 누락은 아래와 같다.
#
#   선거일: 2020-04-15(제21대 국회의원), 2022-03-09(제20대 대통령),
#           2022-06-01(제8회 지방), 2024-04-10(제22대 국회의원) 등이 빠져 있다.
#           대통령선거는 궐위 여부에 따라 kind 가 갈리므로(2025-06-03 참조)
#           한 건씩 사유를 확인해서 넣어야 한다. 목록을 짐작으로 채우지 말 것.
#   임시공휴일: 픽스처에 없는 해의 지정 건은 조사하지 않았다.
#
# 피드 발행 범위를 정할 때 이 표의 수록 구간부터 맞출 것. 지금 상태로 과거·미래를
# 넓게 조회하면 조용히 빠진 공휴일이 생긴다. 빠진 것은 오류로 드러나지 않는다.

version: 1

# ---------------------------------------------------------------------------
# kind 별 성질 — 대체공휴일 적용 여부를 여기서 결정한다.
# 개별 항목이 아니라 kind 가 결정한다. 항목마다 적으면 새 항목에서 빠뜨린다.
# ---------------------------------------------------------------------------
kinds:

  election:
    description: 「공직선거법」에 따른 임기만료에 의한 선거의 선거일.
    substitute_eligible: true
    verified: false
    source: 「관공서의 공휴일에 관한 규정」 제2조 — 임기만료에 의한 선거의 선거일을 공휴일로 열거
    source_todo: |
      제3조의 몇 호에 해당하는지 미확인.
      대체공휴일 대상이라는 것까지는 잡았으나 어떤 겹침 조건(토요일/일요일/
      다른 공휴일)이 붙는지 확인하지 못했다. 그래서 substitute_holidays.yaml 의
      clauses 로 표현하지 못하고 여기 불리언으로 두었다.
      임기만료 선거일은 법령상 수요일에 오므로 토·일과 겹칠 일이 없어 지금은
      이 불확실성이 결과에 영향을 주지 않는다. 조회 범위를 넓히기 전에 확정할 것.

  temporary:
    description: 국무회의 심의·의결로 그때그때 지정되는 임시공휴일.
    substitute_eligible: false
    verified: false
    source:
    source_todo: |
      임시공휴일이 대체공휴일 대상이 아니라는 근거 조문을 확인하지 못했다.
      제3조가 제2조의 특정 호만 열거하고 임시공휴일 근거 호는 빠져 있다는
      구조에서 나온 판단이다. 원문으로 확인할 것.
      만약 대상이라면 2020-08-17(월) 임시공휴일이 다른 공휴일과 겹치는 해에
      없던 대체공휴일이 생긴다.

