# ---------------------------------------------------------------------------
# 미해결
# ---------------------------------------------------------------------------
open_questions:

  - id: 관보-일괄대조
    question: |
      이 표의 항목은 전부 verified: false 다. 목록 자체가 관보를 훑어서 만든 것이
      아니라 기억과 2차 출처에 의존해 채워졌다. coverage 를 2015~2026 으로
      선언했지만 그 구간이 정말 빠짐없는지 보증하는 근거가 없다.

      피드를 공개하기 전에 해당 구간의 관보를 훑어 임시공휴일 지정 내역과
      선거일 공고를 일괄 대조할 것. 그 전까지 이 표의 coverage 는
      "채우려고 시도한 구간"이지 "검증된 구간"이 아니다.

  - id: 선거일-kind-판정
    question: |
      대통령선거는 임기만료인지 궐위인지에 따라 kind 가 갈린다.
      2022-03-09 은 임기만료(election), 2017-05-09·2025-06-03 은 궐위(temporary).
      날짜나 선거 종류만 보고 분류하면 반드시 틀린다.

      새 선거일을 넣을 때 사유를 확인하지 않은 채 election 으로 두지 말 것.
      궐위 선거를 election 으로 넣으면 법정공휴일이 아닌 날이 법정공휴일이 되고,
      대체공휴일 적용 여부까지 함께 틀린다(kinds 블록 참조).
