# 지정 공휴일 — 규칙으로 유도할 수 없어 날짜를 하나씩 적어 두는 것들
#
# 선거일과 임시공휴일을 한 표에 담고 kind 로 구분한다. 둘 다 "그때그때 정해지는"
# 성격이지만 근거 조항과 대체공휴일 적용 여부가 다르므로 kind 가 그 차이를 진다.
#
# 절대 규칙으로 유도하지 말 것.
#   임시공휴일은 국무회의 심의·의결로 그때그때 정해지고 규칙성이 없다.
#   "연휴 앞뒤는 쉰다", "징검다리는 쉰다" 같은 패턴은 존재하지 않는다.
#   선거일은 형태상 계산이 되는 것처럼 보이지만 실제 날짜는 공고로 확정되고,
#   궐위 선거는 예측 대상이 아니다.
#   여기 없는 날짜는 공휴일이 아니다. 빈칸을 추론으로 메우면 없는 공휴일이 생긴다.

version: 1

# ---------------------------------------------------------------------------
# coverage — 이 표가 빠짐없이 채워졌다고 주장하는 구간#
# 두 축을 구분한다.
#   from              데이터 완결성 경계. 이전은 데이터를 채우지 않았으므로
#                     조회 자체를 UnsupportedYear 로 거부한다.
#   confirmed_through 규칙 개정을 확인한 시점. 이후도 답하되 provisional: true 를
#                     달아 돌려준다. 거부하지 않는다.
#
# 왜 이후를 거부하지 않는가.
#   피드는 3~5년치를 미리 발행해야 한다. 상한을 두면 발행 자체가 막힌다.
#   그리고 미래 연도에 임시공휴일이 없는 것은 누락이 아니라 아직 지정되지 않은
#   상태다. 없는 것이 정상이므로 오류로 다룰 이유가 없다.
#   반대로 from 이전은 있었어야 할 데이터가 없는 것이라 성격이 다르다.
#
# from: 2015-01-01
#   그 이전은 조사하지 않았다. 범위를 넓히려면 데이터를 먼저 채울 것.
# confirmed_through: 2028-12-31
#   KASI 특일정보를 2015~2031 년까지 조회한 결과 2029 년 이후는 빈 응답(totalCount 0)이고
#   2028 년까지는 데이터가 있다. 그 구간까지 대조를 마쳤다는 뜻으로 여기까지 민다.
#
#   다만 이 표에서 confirmed_through 가 뜻하는 바를 정확히 볼 것.
#   "2028 년까지 지정될 임시공휴일을 다 알고 있다"가 아니다. 그건 원리적으로 불가능하다.
#   임시공휴일은 국무회의 의결로 짧은 예고 후 정해지므로 2027·2028 년 것은 아직 없다.
#   여기서 확정된 것은 "지금 시점까지 알려진 것을 KASI 와 대조해 반영했다"까지다.
#
#   따라서 이 구간의 결과도 시간이 지나면 늘어날 수 있다. 줄지는 않는다.
#   피드를 다시 발행할 때마다 KASI 를 다시 조회해 새 지정을 반영해야 한다.
#
# 주의 — coverage 와 verified 는 다른 축이다.
#   coverage 는 "이 구간을 빠짐없이 채우려 했고 알려진 구멍이 없다"는 주장이고,
#   verified 는 "그 개별 항목을 관보 원문으로 대조했다"는 주장이다.
#   이 표는 coverage 는 선언했지만 verified 는 전부 false 다. 즉 목록은 채웠으나
#   원문 대조는 한 건도 하지 않았다. 아래 open_questions 의 관보-일괄대조 참조.
# ---------------------------------------------------------------------------
coverage:
  from: 2015-01-01
  confirmed_through: 2028-12-31

# ---------------------------------------------------------------------------
# kind 별 성질 — 대체공휴일 적용 여부를 여기서 결정한다.
# 개별 항목이 아니라 kind 가 결정한다. 항목마다 적으면 새 항목에서 빠뜨린다.
# ---------------------------------------------------------------------------
kinds:

  election:
    description: 「공직선거법」에 따른 임기만료에 의한 선거의 선거일.
    substitute_eligible: unresolved
    verified: true
    source: 국가법령정보센터 현행 조문 — 「관공서의 공휴일에 관한 규정」 제2조제10의2호
    source_todo: |
      제2조 원문을 확보하면서 true 에서 unresolved 로 내렸다. 근거는 이렇다.

      선거일은 제10호가 아니라 제10의2호(가지번호)다. 그런데 제3조 제1항 제1호와
      제3호는 제10호까지만 열거하고, 제1항 본문도 "제2호부터 제10호까지"라고 쓴다.
      가지번호가 그 범위에 포함되는지는 법령 해석의 문제이며 조문만으로는 정해지지
      않는다. 법제처 해석이 필요하다.

      그래서 true(대상)도 false(비대상)도 주장하지 않는다. 어느 쪽으로 적어도
      확인하지 않은 것을 확정하는 것이 된다.

      실무 영향: 현재 이 표에 실린 선거일은 전부 수요일이라 토·일과 겹치지 않고
      다른 공휴일과도 겹치지 않는다. 따라서 지금은 결과가 달라지지 않는다.
      substitute_holidays.yaml 의 open_questions 선거일-가지번호 참조.

  temporary:
    description: 국무회의 심의·의결로 그때그때 지정되는 임시공휴일.
    substitute_eligible: false
    verified: false
    source:
    source_todo: |
      임시공휴일이 대체공휴일 대상이 아니라는 근거 조문을 확인하지 못했다.
      제3조가 제2조의 특정 호만 열거하고 임시공휴일 근거 호는 빠져 있다는
      구조에서 나온 판단이다. 원문으로 확인할 것.
      만약 대상이라면 2020-08-17(월) 임시공휴일이 다른 공휴일과 겹치는 해에
      없던 대체공휴일이 생긴다.

