# 양력 고정 공휴일
#
# 매년 같은 월·일에 오는 공휴일만 담는다. 음력 공휴일(설날·추석·부처님오신날)은
# rules/kr/lunar_holidays.yaml 로 분리되어 있고 아직 미구현이다.
#
# effective_from / effective_until 은 공휴일 지위의 시작·끝이다. 비어 있으면
# "이 표가 다루는 기간 내내 공휴일"이라는 뜻이며, 아래 한계 항목을 함께 읽을 것.
#
# key 는 rules/kr/substitute_holidays.yaml 의 holidays 레지스트리와 같은 값을 쓴다.
# 대체공휴일 대상 여부를 그 키로 조회하기 때문이다. 어긋나면 로더가 거부한다.

version: 1

# ---------------------------------------------------------------------------
# coverage — 이 표를 신뢰할 수 있는 구간.#
# 두 축을 구분한다.
#   from              데이터 완결성 경계. 이전은 데이터를 채우지 않았으므로
#                     조회 자체를 UnsupportedYear 로 거부한다.
#   confirmed_through 규칙 개정을 확인한 시점. 이후도 답하되 provisional: true 를
#                     달아 돌려준다. 거부하지 않는다.
#
# 왜 이후를 거부하지 않는가.
#   피드는 3~5년치를 미리 발행해야 한다. 상한을 두면 발행 자체가 막힌다.
#   그리고 미래 연도에 임시공휴일이 없는 것은 누락이 아니라 아직 지정되지 않은
#   상태다. 없는 것이 정상이므로 오류로 다룰 이유가 없다.
#   반대로 from 이전은 있었어야 할 데이터가 없는 것이라 성격이 다르다.
#
# from: 2013-01-01
#   한글날은 1991 년에 공휴일에서 제외되었다가 2013 년에 복원되었다.
#   복원 시행일을 확보하지 못해 effective_from 으로 표현하지 못했고, 대신
#   coverage 를 복원 이후로 잘랐다. 미적용 구간을 조회 자체로 막는 쪽을 택했다.
#   effective_from 을 근거와 함께 채우면 그때 from 을 앞당길 수 있다.
#   제헌절도 2008 년 이전에는 공휴일이었으나 이 표는 그 구간을 표현하지 못한다.
#   두 경우 모두 2013-01-01 이전이라 coverage 밖이다.
#
# confirmed_through: 2028-12-31
#   마지막으로 반영한 개정이 제헌절 편입·노동절 신설(제36290호)이다.
#   KASI 특일정보 2028 년까지의 응답이 이 표의 유도 결과와 일치하는 것으로 그 구간까지
#   확인했다(2029 년 이후는 KASI 도 빈 응답이라 대조할 대상이 없다).
#   이후 날짜도 답하지만 provisional 로 표시된다.
#   양력 공휴일은 규칙이 단순해서 미래 추정이 대체로 맞지만, 제헌절처럼 목록
#   자체가 바뀐 전례가 있으므로 확인 없이 확정으로 다루지 않는다.
# ---------------------------------------------------------------------------
coverage:
  from: 2013-01-01
  confirmed_through: 2028-12-31

