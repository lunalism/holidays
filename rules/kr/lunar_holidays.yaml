# 음력 공휴일 — 설날·추석·부처님오신날
#
# 날짜는 계산으로 유도한다. rules/kr/lunar.py 가 삭(朔)과 중기(中氣)에서 달
# 번호를 세우고, rules/kr/astro.py 가 그 시각을 KST 로 옮긴다.
#
# ---------------------------------------------------------------------------
# 왜 표가 아니라 계산인가
# ---------------------------------------------------------------------------
# 이 레포의 축은 "우리가 유도하고 KASI 는 대조한다"이다. 날짜를 KASI 에서 받아
# 적어 두면 그 축이 무너진다. 대조할 것이 없어지고 KASI 응답이 곧 정답이 된다.
#
# 계산으로 두면 얻는 것이 하나 더 있다. 2015~2023 년 KASI 응답의 대체공휴일은
# 이름이 그냥 "대체공휴일"이고 원인 표기가 없다(11 건). 그 원인을 추정으로 채우지
# 않기로 했으므로, 확인할 길은 우리 계산이 그 날짜들을 스스로 유도해 내는지뿐이다.
# 날짜를 받아 적으면 그 검증이 성립하지 않는다.
# tests/test_source_agreement.py 의 "원인 미상 대체공휴일" 참조.
#
# ---------------------------------------------------------------------------
# 그래도 최종 판정은 발표값이다
# ---------------------------------------------------------------------------
# 한국의 공식 역서는 한국천문연구원이 확정해 발표하는 값이다. 우리 계산은
# 원리적으로 2차 소스이고, 갈리면 발표가 맞다.
#
# 갈리는 날짜는 아래 exceptions 에 적는다. 계산을 고치지 않는다.
# 급수를 손봐서 한 날짜를 맞추면 다른 날짜가 조용히 틀어지고, 무엇을 왜 고쳤는지
# 남지 않는다. 어긋난 자리를 어긋난 자리로 남겨 두는 편이 낫다.
#
# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
# from: 2015-01-01
#   그 이전은 대조하지 않았다. 계산 자체는 답을 내지만 확인한 바가 없다.
# confirmed_through: 2028-12-31
#   KASI 특일정보 캐시가 덮는 구간이고, 그 안의 앵커 42 건(설날·추석·
#   부처님오신날 각 14 년)을 전부 대조했다. tests/test_lunar.py 참조.
#   이후는 계산이 답을 내되 대조되지 않았으므로 provisional 로 나간다.
version: 1

coverage:
  from: 2015-01-01
  confirmed_through: 2028-12-31

holidays:

  - key: seollal
    name: 설날
    leave_name: 설날 연휴
    lunar: { month: 1, day: 1 }
    leave: { days_before: 1, days_after: 1 }
    verified: false
    source: 「관공서의 공휴일에 관한 규정」 제2조 — 설날 전날, 설날, 설날 다음날
    source_todo: 호 번호 미확인. 연휴 범위(전날·당일·다음날) 원문 대조 필요.

  - key: chuseok
    name: 추석
    leave_name: 추석 연휴
    lunar: { month: 8, day: 15 }
    leave: { days_before: 1, days_after: 1 }
    verified: false
    source: 「관공서의 공휴일에 관한 규정」 제2조 — 추석 전날, 추석, 추석 다음날
    source_todo: 호 번호 미확인. 연휴 범위 원문 대조 필요.

  - key: buddhas_birthday
    name: 부처님오신날
    lunar: { month: 4, day: 8 }
    verified: false
    source: 「관공서의 공휴일에 관한 규정」 제2조
    source_todo: 호 번호 미확인.

# ---------------------------------------------------------------------------
# 발표값과 갈리는 날짜
# ---------------------------------------------------------------------------
# 계산 결과를 발표값으로 덮어쓰는 자리다. 형식:
#
#   - key: seollal
#     year: 2033
#     computed: 2033-01-31      우리 계산이 낸 값
#     published: 2033-02-01     한국천문연구원 발표값. 이쪽이 답이다.
#     source: (발표 출처)
#     note: (왜 갈렸는지 — 삭 시각과 자정의 거리, 치윤법 해석 등)
#
# 지금은 비어 있다. 2015~2028 년 앵커 42 건이 전부 일치했기 때문이며,
# "갈리는 곳이 없다"가 아니라 "대조한 구간에서는 갈리지 않았다"는 뜻이다.
# 대조 구간 밖은 확인된 바 없다.
exceptions: []

# ---------------------------------------------------------------------------
# 초하루 경계 위험 — 1950~2100 전 구간 스캔 (조사 2026-08-08)
# ---------------------------------------------------------------------------
# 삭이 KST 자정에 가까우면 급수 오차만으로 초하루가 하루 갈린다. 그 자리에 놓인
# 공휴일에 lunar_boundary_risk 플래그가 붙는다. 값은 바꾸지 않는다 — 표시만 한다.
#
# 기준은 자정에서 10 분이다. 문헌 오차(20 초 안쪽)가 아니라 우리가 실제로 견딘다고
# 확인한 폭(±600 초)을 쓴다. 문헌 오차를 기준으로 잡으면 우리가 옮겨 적은 계수가
# 맞다는 것을 전제하게 되는데, 그건 대조 구간에서만 확인된 것이다.
#
#   rules/kr/holiday_calendar.lunar_boundary_report(1950, 2100) 으로 다시 뽑는다.
#   목록은 tests/test_lunar.py 의 KNOWN_BOUNDARY_RISKS 가 고정한다.
#
# 전 구간 6 건:
#
#   2092  설날          2092-02-08   자정에서 2.58 분
#   1967  부처님오신날   1967-05-16   자정에서 4.61 분  (초하루 05-09)
#   1978  설날          1978-02-07   자정에서 6.04 분
#   1997  설날          1997-02-08   자정에서 6.20 분
#   2063  부처님오신날   2063-05-05   자정에서 8.04 분  (초하루 04-28)
#   1970  부처님오신날   1970-05-12   자정에서 9.03 분  (초하루 05-05)
#
# 이 중 넷(1967·1970·1978·1997)은 이미 지나간 날짜라 발표값이 존재한다.
# 지금 확인할 수 있고, 갈리면 위 exceptions 에 적는다. 계산을 고치지 않는다.
# 2063·2092 는 기다릴 수밖에 없다.
#
# ---------------------------------------------------------------------------
# 대조 완료 구간(2015~2028)은 0 건 — 이것이 안전 근거다
# ---------------------------------------------------------------------------
# 이 구간에는 위태로운 자리가 하나도 없다. 삭이 전부 자정에서 충분히 떨어져 있다.
#
# 앵커 42 건이 맞았다는 사실만으로는 부족하다. 계수를 조금 잘못 옮겨도 운으로
# 다 맞을 수 있기 때문이다. 0 건은 그 운의 여지를 없앤다 — 급수 오차가 날짜를
# 옮길 수 있는 자리가 애초에 없었으므로, 42 건이 맞은 것은 우연이 아니다.
#
# 이 구간에 위험이 생기면(스캔 결과가 0 이 아니게 되면) confirmed_through 를
# 그대로 두어도 되는지 다시 판단할 것.
# tests/test_lunar.py 의 test_the_verified_range_has_no_boundary_risk 가 지킨다.

# ---------------------------------------------------------------------------
# 미해결
# ---------------------------------------------------------------------------
open_questions:

  - id: 태양-황경-정밀도
    question: |
      태양 황경은 Meeus 제25장 저정밀도 식으로 구한다. 문헌 오차 약 0.01°,
      시간으로 약 15 분이다. 중기가 KST 자정에서 15 분 안쪽이면 중기가 든 날이
      갈리고, 그 자리가 삭망월 경계면 윤달이 통째로 밀린다.

      실제로 아슬아슬한 중기가 있다. 2025-12-22 동지는 자정에서 0.44 분이다.

      다만 그것이 우리 답을 바꾸지는 않는다는 것이 확인되어 있다.
      황경을 ±0.1° 흔들어도 2015~2050 년의 설날·추석·부처님오신날이 하나도
      바뀌지 않는다(문헌 오차의 10 배). ±0.2° 에서 처음 한 건이 바뀐다.
      tests/test_lunar.py 의 섭동 테스트가 이 여유를 상시 확인한다.

      그러므로 지금 VSOP87 로 올릴 이유가 없다. 여유가 깨지면 그때 올린다.
      섭동 테스트가 빨개지는 것이 그 신호다.

  - id: 치윤법-경계-해석
    question: |
      무중치윤법은 경계 사례에서 해석이 갈린 적이 있다. 2033 년 윤달 배치가
      대표 사례로 알려져 있다.

      우리 구현은 "동지가 든 달이 11 월, 그 세에 13 달이면 중기 없는 첫 달이
      윤달"이라는 한 가지 규칙만 쓴다. 발표값이 다른 규칙으로 정해진 해가 있다면
      우리 계산은 틀린다. 대조 구간(2015~2028)에서는 어긋난 곳이 없었으나
      2033 년은 그 밖이다.

      2033 년이 confirmed_through 안에 들어오기 전에 발표값을 확인할 것.
      갈리면 계산을 고치지 말고 exceptions 에 적을 것.

  - id: 음양력-API-활용신청
    priority: 높음
    question: |
      지금 대조 구간은 KASI 특일정보 캐시가 덮는 2015~2028 년뿐이다.
      한국천문연구원 음양력 정보 API(getLunCalInfo / getSolCalInfo)를 쓰면 훨씬
      넓은 구간을 대조할 수 있을 것으로 보이나 아무것도 확인하지 않았다.

      확인할 것 두 가지. 둘 다 미확인이며 짐작으로 채우지 말 것.

        1. 특일정보와 별도의 활용신청이 필요한지.
           지금 키(KASI_SERVICE_KEY)는 SpcdeInfoService/getRestDeInfo 로 신청한
           것이다. 다른 서비스면 키를 다시 받아야 한다. 활용기간 만료일도
           따로 붙는다(특일정보는 2028-08-08 — kasi_names.yaml 참조).

        2. 지원 연도 범위.
           이것이 confirmed_through 를 어디까지 밀 수 있는지를 정한다.
           범위를 모르면 아무것도 밀 수 없다.

      이 두 가지가 막고 있는 일:

        - confirmed_through 를 2028-12-31 에서 더 미는 것.
          지금 값은 "KASI 특일정보 캐시가 여기까지라서"이지 계산의 한계가 아니다.

        - 위 초하루 경계 위험 6 건 중 지나간 넷(1967·1970·1978·1997)을 확인하는 것.
          발표값은 이미 존재하지만 우리에게 받아 볼 경로가 없다.
          특히 1997 설날은 자정에서 6.20 분이라 확인 가치가 높다.

        - kr/seasonal 24절기 피드. 같은 서비스 계열일 가능성이 높아 함께 확인하면
          된다. DESIGN.md 참조.

      확인 전까지 confirmed_through 는 2028-12-31 이다. 계산이 답을 더 낼 수
      있다는 것과 그 답이 대조되었다는 것은 다른 이야기다.
