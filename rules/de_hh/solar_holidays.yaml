# 독일·함부르크 주 공휴일 — 고정 날짜 6 건.
#
# 근거: Gesetz über Sonntage, Feiertage, Gedenktage und Trauertage (Feiertagsgesetz,
# HH) § 1 — "Gesetzliche Feiertage sind: 1. Neujahrstag, 2. Karfreitag,
# 3. Ostermontag, 4. 1. Mai, 5. Himmelfahrtstag, 6. Pfingstmontag, 7. Tag der
# Deutschen Einheit (3. Oktober), 8. 31. Oktober, 9. 1. Weihnachtstag,
# 10. 2. Weihnachtstag." 고정 날짜는 Nr. 1·4·7·8·9·10. 전국 공통 5 건에 Nr. 8
# "31. Oktober" 가 더해진다(2018-03-12 개정, HmbGVBl. S. 63 로 삽입).
#
# --- Nr. 8 "31. Oktober" 의 표기와 식별자 ---
# 조문에는 이름이 없고 날짜만 있다. SUMMARY(name)는 조문 표기 "31. Oktober" 그대로
# 싣는다 — 통칭 Reformationstag 는 SUMMARY 에 쓰지 않고 source 에만 병기한다.
# token(key)은 reformationstag 다: key charset [a-z][a-z_]* 이 날짜형(31_oktober —
# 숫자 시작, 서수를 숫자로 적는 것도 금지)을 허용하지 않아 통칭을 식별자로
# 채택했다(승인 완료). 이 피드에서 새로 명명한 key 는 이 하나뿐이고, 나머지는
# de·de_be·de_by·de_he 와 같은 확립값이다.
#
# --- 범위 밖 ---
# § 1 에 지자체·집단 한정 항목이 없다. § 3 의 kirchliche Feiertage 는 근무·수업
# 편의 조항이지 공휴일이 아니다. § 2 Abs. 1 Nr. 1(Senat 의 Sonderfeiertag 명령
# 수권)에 따른 명령은 조사에서 확인된 것이 없어 일회성 표를 두지 않는다.
#
# --- 대체공휴일(이동) 규칙이 없다 ---
# § 1 에 이동 조항이 없다. feiertage-api HH 2020–2031 실측에서 일요일 겹침(2021
# 10-03·10-31·12-26, 2022 05-01·12-25, 2023 01-01, 2027 10-03·10-31·12-26) 모두
# 보상 휴일 0 건. 일요일과 겹쳐도 그 날짜 그대로 싣는다.
#
# --- key 규약 ---
# UID 의 token 이 된다. 한 번 나가면 바꿀 수 없다(core/ics.py 의 UID 절).
# rules/de_be/solar_holidays.yaml 의 규약과 같다. 발행되는 UID 의 token 은 이 key
# 앞에 "de_hh-" 가 붙는다(rules/de_hh/feed.py). 접두사 없이는 네 독일 피드와 UID 가
# 겹친다.
#
# --- name ---
# SUMMARY 에 그대로 실린다. § 1 의 조문 표기(umwelt-online 현행판)다. Nr. 7 의
# 괄호 날짜 "(3. Oktober)" 만 뺐다 — de.ics 가 BayFTG 의 서술부 "der 3. Oktober
# als …" 를 뺀 전례와 동형. 원문은 해당 항목 source 에 그대로 남긴다.
#
# --- verified ---
# 원문을 직접 본 항목만 true. 공식 포털 landesrecht-hamburg.de 는 JS 셸만 돌아와
# 열람하지 못했다(/tmp/report_de_laender.md HH §1). 조문은 비공식 현행판
# (umwelt-online Stand 28.08.2023)으로 읽었고, 날짜는 feiertage-api 2026 HH 로
# 대조했다(10/10). 그래서 9 건이 false 다 — BE 기저 9 건과 같은 관례. 항목별
# source 에 자기 호 번호(Nr. n)와 그 호의 조문 표기를 따옴표로 담고, source_todo
# 에 공식 경로를 남긴다.
#
# Nr. 8 "31. Oktober" 만 true — 이 피드의 첫 true 항목. 공포 관보 원문(HmbGVBl.
# 2018 Nr. 9 S. 63, Fünftes Gesetz zur Änderung des Feiertagsgesetzes vom
# 12.03.2018, 20.03.2018 공포)을 luewu.de 의 PDF 사본으로 2026-09-07 에 읽었다.
# Einziger Paragraph: "Hinter Nummer 7 wird folgende neue Nummer 8 eingefügt:
# „8. 31. Oktober,“. Die bisherigen Nummern 8 und 9 werden Nummern 9 und 10."
# 이 표의 Nr. 9·10 인용은 그 재번호 후 체계다. 의결 전 안(Drucksache 21/12153)은
# 공포본이 상위 근거라 더 적지 않는다.
#
# --- 개정 체인 (공포본, luewu 1995–2026 Nr. 26 실측) ---
# § 1 에 닿은 개정은 2018-03-12 (S. 63, Nr. 8 삽입·재번호) 하나뿐이다.
#   2000-12-06 S. 358  Drittes Gesetz            § 2a 신설      ← zuletzt geändert 1994-12-20 (S. 441)
#   2013-06-19 S. 304  Viertes Gesetz            § 3a 신설
#   2017-12-12 S. 386, 388  Glücksspiel-Art.gesetz Art. 3  § 2a 문장 추가
#   2018-03-12 S. 63   Fünftes Gesetz            § 1 Nr. 8 삽입  ← 유일한 § 1 개정
#   2019-12-19 S. 516  Glücksspiel-Art.gesetz Art. 3  § 2a Satz 3 삭제
#   2021-02-17 S. 75, 77  Glücksspiel-Art.gesetz Art. 3  § 2a Satz 2 문구 치환
#   2022–2026 Nr. 26  법 개정 없음(2022 S. 581 은 8. Mai Gedenktag 시행령, 2024 S. 74 는
#   Feiertagsschutzverordnung — 둘 다 § 1 무관)
# 따라서 Nr. 1–7·9·10 의 자구는 1994-12-20 이전 공포본에 의존하고, 그 호는 디지털
# 공개(luewu·Transparenzportal 공히 1995~)가 없다. 아홉 항목의 source_todo 가 그
# 경계와 잔존 경로(실물 HmbGVBl.·Sammlung I 113-a)를 적는다.
#
# verified 와 source_todo 는 피드에 나가지 않는다(rules/de_hh/feed.py).

# --- scope ---
# bundesweit | land. 전국 공통 9 건은 bundesweit, 나머지(일회성 포함)는 land.
# 9 건의 근거: feiertage-api 2025·2026 16 주 교집합 실측 — API 의 NATIONAL 키·
# rules/de 의 YAML 과 삼중 일치(/tmp/report_bundesweit.md). DESCRIPTION 첫 줄이
# 이 값에서 나온다. 로더가 닫힌 집합으로 검사하고, tests/test_de_scope.py 가
# bundesweit key 집합 == rules/de key 집합을 고정한다.

holidays:
  - key: neujahr
    name: Neujahrstag
    scope: bundesweit
    month: 1
    day: 1
    verified: false
    source: >-
      Feiertagsgesetz(HH) § 1 Nr. 1 'Neujahrstag' — umwelt-online 현행판(Stand
      28.08.2023). 날짜 1. 1. 은 feiertage-api 2026 HH 대조 일치
    source_todo: >-
      § 1 열거 자구는 1994-12-20 개정(HmbGVBl. S. 441) 이전 공포본에 의존한다.
      디지털 공개는 luewu·Transparenzportal 공히 1995 년부터(Transparenzportal 의
      HmbGVBl. 데이터셋은 temporal_coverage_from 1995-01-01 이고 내용 검색은 luewu
      로 연결). 잔존 경로: Staatsarchiv Hamburg·주립도서관의 실물 HmbGVBl. 또는
      Sammlung des bereinigten hamburgischen Landesrechts I 113-a 열람.
      2018-03-12 (S. 63) 이후 § 1 무변경은 공포본 체인으로 확인됨 — 2019 S. 516·
      2021 S. 75, 77 은 § 2a 만, 2026 Nr. 26 (28.08.2026) 까지 무개정.

