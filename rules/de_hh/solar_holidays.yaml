# 독일·함부르크 주 공휴일 — 고정 날짜 6 건.
#
# 근거: Gesetz über Sonntage, Feiertage, Gedenktage und Trauertage (Feiertagsgesetz,
# HH) § 1 — "Gesetzliche Feiertage sind: 1. Neujahrstag, 2. Karfreitag,
# 3. Ostermontag, 4. 1. Mai, 5. Himmelfahrtstag, 6. Pfingstmontag, 7. Tag der
# Deutschen Einheit (3. Oktober), 8. 31. Oktober, 9. 1. Weihnachtstag,
# 10. 2. Weihnachtstag." 고정 날짜는 Nr. 1·4·7·8·9·10. 전국 공통 5 건에 Nr. 8
# "31. Oktober" 가 더해진다(2018-03-12 개정, HmbGVBl. S. 63 로 삽입).
#
# --- Nr. 8 "31. Oktober" 의 표기와 식별자 ---
# 조문에는 이름이 없고 날짜만 있다. SUMMARY(name)는 조문 표기 "31. Oktober" 그대로
# 싣는다 — 통칭 Reformationstag 는 SUMMARY 에 쓰지 않고 source 에만 병기한다.
# token(key)은 reformationstag 다: key charset [a-z][a-z_]* 이 날짜형(31_oktober —
# 숫자 시작, 서수를 숫자로 적는 것도 금지)을 허용하지 않아 통칭을 식별자로
# 채택했다(승인 완료). 이 피드에서 새로 명명한 key 는 이 하나뿐이고, 나머지는
# de·de_be·de_by·de_he 와 같은 확립값이다.
#
# --- 범위 밖 ---
# § 1 에 지자체·집단 한정 항목이 없다. § 3 의 kirchliche Feiertage 는 근무·수업
# 편의 조항이지 공휴일이 아니다. § 2 Abs. 1 Nr. 1(Senat 의 Sonderfeiertag 명령
# 수권)에 따른 명령은 조사에서 확인된 것이 없어 일회성 표를 두지 않는다.
#
# --- 대체공휴일(이동) 규칙이 없다 ---
# § 1 에 이동 조항이 없다. feiertage-api HH 2020–2031 실측에서 일요일 겹침(2021
# 10-03·10-31·12-26, 2022 05-01·12-25, 2023 01-01, 2027 10-03·10-31·12-26) 모두
# 보상 휴일 0 건. 일요일과 겹쳐도 그 날짜 그대로 싣는다.
#
# --- key 규약 ---
# UID 의 token 이 된다. 한 번 나가면 바꿀 수 없다(core/ics.py 의 UID 절).
# rules/de_be/solar_holidays.yaml 의 규약과 같다. 발행되는 UID 의 token 은 이 key
# 앞에 "de_hh-" 가 붙는다(rules/de_hh/feed.py). 접두사 없이는 네 독일 피드와 UID 가
# 겹친다.
#
# --- name ---
# SUMMARY 에 그대로 실린다. § 1 의 조문 표기(umwelt-online 현행판)다. Nr. 7 의
# 괄호 날짜 "(3. Oktober)" 만 뺐다 — de.ics 가 BayFTG 의 서술부 "der 3. Oktober
# als …" 를 뺀 전례와 동형. 원문은 해당 항목 source 에 그대로 남긴다.
#
# --- verified ---
# 원문을 직접 본 항목만 true. 공식 포털 landesrecht-hamburg.de 는 JS 셸만 돌아와
# 열람하지 못했다(/tmp/report_de_laender.md HH §1). 조문은 비공식 현행판
# (umwelt-online Stand 28.08.2023)으로 읽고, 2018 개정분(Nr. 8 삽입)만 의회 문서
# Drucksache 21/12153 로 봤다 — 의결 전 안이라 승격하지 않는다(공포 관보 HmbGVBl.
# 2018 S. 63 미열람). 날짜는 feiertage-api 2026 HH 로 대조했다(10/10). 그래서
# 전부 false 다 — BE 기저 9 건과 같은 관례. 항목별 source 에 자기 호 번호(Nr. n)와
# 그 호의 조문 표기를 따옴표로 담고, source_todo 에 공식 경로를 남긴다.
#
# verified 와 source_todo 는 피드에 나가지 않는다(rules/de_hh/feed.py).

holidays:
  - key: neujahr
    name: Neujahrstag
    month: 1
    day: 1
    verified: false
    source: >-
      Feiertagsgesetz(HH) § 1 Nr. 1 'Neujahrstag' — umwelt-online 현행판(Stand
      28.08.2023). 날짜 1. 1. 은 feiertage-api 2026 HH 대조 일치
    source_todo: 공식 포털 landesrecht-hamburg(jlr-FeiertGHArahmen) 열람 또는 HmbGVBl. 원본

  - key: erster_mai
    name: 1. Mai
    month: 5
    day: 1
    verified: false
    source: >-
      Feiertagsgesetz(HH) § 1 Nr. 4 '1. Mai' — umwelt-online 현행판(Stand 28.08.2023).
      날짜는 조문에 박혀 있고 feiertage-api 2026 HH(Tag der Arbeit) 대조 일치
    source_todo: 공식 포털 landesrecht-hamburg(jlr-FeiertGHArahmen) 열람 또는 HmbGVBl. 원본

  - key: tag_der_deutschen_einheit
    name: Tag der Deutschen Einheit
    month: 10
    day: 3
    verified: false
    source: >-
      Feiertagsgesetz(HH) § 1 Nr. 7 'Tag der Deutschen Einheit (3. Oktober)' —
      umwelt-online 현행판(Stand 28.08.2023). SUMMARY 는 괄호 날짜를 뺀 표기
      (de.ics 의 서술부 제외 전례). 연방 근거는 Einigungsvertrag Art. 2 Abs. 2
      (rules/de). 날짜는 조문에 박혀 있고 feiertage-api 2026 HH 대조 일치
    source_todo: 공식 포털 landesrecht-hamburg(jlr-FeiertGHArahmen) 열람 또는 HmbGVBl. 원본

  - key: reformationstag
    name: 31. Oktober
    month: 10
    day: 31
    verified: false
    source: >-
      Feiertagsgesetz(HH) § 1 Nr. 8 '31. Oktober' — 조문에 이름 없이 날짜만. 통칭
      Reformationstag 는 SUMMARY 에 쓰지 않고 여기에만 둔다. token 은 reformationstag
      — key charset 이 날짜형(31_oktober)을 허용하지 않아 통칭을 식별자로 채택.
      2018-03-12 개정(HmbGVBl. S. 63)으로 삽입 — 개정 조문은 Bürgerschaft Drucksache
      21/12153(26.02.2018, 의결 전 안) 결의문에 그대로 수록. 현행 열거는
      umwelt-online 현행판(Stand 28.08.2023). 날짜 31. 10. 은 feiertage-api 2026
      HH(Reformationstag) 대조 일치
    source_todo: HmbGVBl. 2018 S. 63 원본 또는 공식 포털 landesrecht-hamburg 열람

  - key: erster_weihnachtstag
    name: 1. Weihnachtstag
    month: 12
    day: 25
    verified: false
    source: >-
      Feiertagsgesetz(HH) § 1 Nr. 9 '1. Weihnachtstag' — umwelt-online 현행판
      (Stand 28.08.2023). 날짜 25. 12. 은 feiertage-api 2026 HH 대조 일치
    source_todo: 공식 포털 landesrecht-hamburg(jlr-FeiertGHArahmen) 열람 또는 HmbGVBl. 원본

  - key: zweiter_weihnachtstag
    name: 2. Weihnachtstag
    month: 12
    day: 26
    verified: false
    source: >-
      Feiertagsgesetz(HH) § 1 Nr. 10 '2. Weihnachtstag' — umwelt-online 현행판
      (Stand 28.08.2023). 날짜 26. 12. 은 feiertage-api 2026 HH 대조 일치
    source_todo: 공식 포털 landesrecht-hamburg(jlr-FeiertGHArahmen) 열람 또는 HmbGVBl. 원본
