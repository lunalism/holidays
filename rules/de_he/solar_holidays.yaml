# 독일·헤센 주 공휴일 — 고정 날짜 5 건.
#
# 근거: Hessisches Feiertagsgesetz (HFeiertagsG) § 1 Abs. 1 — "Gesetzliche Feiertage
# sind die Sonntage sowie 1. der Neujahrstag, 2. der Karfreitag, 3. der Ostermontag,
# 4. der 1. Mai, 5. der Himmelfahrtstag, 6. der Pfingstmontag, 7. der Fronleichnamstag,
# 8. der Tag der Deutschen Einheit, 9. der 1. und 2. Weihnachtstag."
# 고정 날짜는 Nr. 1·4·8·9 — Nr. 9 가 한 호에 이틀이라 항목은 다섯이다. 전국 공통
# 5 건 그대로이고 헤센만의 고정 항목은 없다.
#
# --- 범위 밖 ---
# § 1 에 지자체·집단 한정 항목이 없다. Bistum Fulda PDF 에 실린 시행규칙
# (Verwaltungsvorschrift zum HFeiertagsG, StAnz. 1995 S. 16) "Zu § 4" 의 학생 수업
# 면제일(Aschermittwoch, Mariä Himmelfahrt, Reformationstag, Allerheiligen, Buß-
# und Bettag)은 학교 한정이지 공휴일이 아니다. § 2(주 정부 명령에 의한 일회성
# 공휴일 수권)에 따른 명령은 조사에서 확인된 것이 없어 일회성 표를 두지 않는다.
#
# --- 대체공휴일(이동) 규칙이 없다 ---
# § 1 Abs. 1 은 "die Sonntage sowie …" 로 일요일 자체를 공휴일로 두고 이동 조항이
# 없다. feiertage-api HE 실측(2021 10-03·12-26, 2022 05-01·12-25, 2023 01-01,
# 2027 10-03·12-26 이 일요일)에서 보상 휴일 0 건. 일요일과 겹쳐도 그 날짜 그대로.
#
# --- key 규약 ---
# UID 의 token 이 된다. 한 번 나가면 바꿀 수 없다(core/ics.py 의 UID 절).
# rules/de_be/solar_holidays.yaml 의 규약과 같다. 이 표의 key 는 전부 기존 확립값
# (de·de_be·de_by 와 같은 key) — 신규 명명 0. 발행되는 UID 의 token 은 이 key 앞에
# "de_he-" 가 붙는다(rules/de_he/feed.py). 접두사 없이는 세 독일 피드와 UID 가
# 겹친다.
#
# --- name ---
# SUMMARY 에 그대로 실린다. § 1 Abs. 1 의 조문 표기(umwelt-online 현행판)에서
# 정관사 der 를 뺀 것이다. de.ics(BayFTG 표기)와 다른 항목: Neujahrstag,
# 1. Weihnachtstag, 2. Weihnachtstag — 헤센 조문이 그렇다. Bistum Fulda PDF 는
# Nr. 8 을 "der Tag der deutschen Einheit"(소문자 d)로 적는다 — umwelt-online 의
# 대문자 D 를 따르고 차이는 해당 항목 source 에 남긴다.
#
# --- verified ---
# 원문을 직접 본 항목만 true. 공식 포털 rv.hessenrecht.hessen.de 는 JS 셸만 돌아와
# (curl·headless 180초·WebFetch 실패, /tmp/report_de_laender.md HE §1) 열람하지
# 못했다. 조문은 비공식 현행판 둘(umwelt-online Stand 28.08.2023, Bistum Fulda PDF)
# 로 읽고, 날짜는 준공식 innen.hessen.de 2026 목록과 feiertage-api 2026 HE 로
# 대조했다(10/10). 그래서 전부 false 다 — BE 기저 9 건과 같은 관례. 항목별 source
# 에 자기 호 번호와 그 호의 조문 표기를 따옴표로 담고, source_todo 에 공식 경로를
# 남긴다.
#
# verified 와 source_todo 는 피드에 나가지 않는다(rules/de_he/feed.py).

holidays:
