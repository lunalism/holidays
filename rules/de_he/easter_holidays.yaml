# 독일·헤센 주 공휴일 — 부활절 기준 이동 5 건.
#
# easter_offset 은 부활절 일요일(Ostersonntag)로부터의 날수다. 부활절 자체는
# rules/de_he/feed.py 가 python-dateutil 의 easter() 로 계산한다(rules/de 와
# 같은 계산기, 같은 근거).
#
# 전국 공통 4 건에 Fronleichnamstag(+60, § 1 Abs. 1 Nr. 7)이 더해진다. 조문은
# 이름만 열거하고 날짜를 정의하지 않는다 — 오프셋은 교회력 관습(삼위일체 주일
# 다음 목요일 = 부활절 +60)이고, innen.hessen.de 2026(04.06)·feiertage-api 2026
# HE(06-04)·python-holidays 0.102 HE 로 대조했다.
#
# key·name·verified 규약, 공포본 두 호와 개정 체인의 닫힘은 solar_holidays.yaml 머리
# 주석과 같다. 다섯 건 모두 1971 Neufassung(GVBl. 1971 I Nr. 36, § 1 은 S. 344)의
# 자구이고 1994 개정(GVBl. 1994 I Nr. 25 S. 596)이 건드리지 않았다.
# name 은 헤센 조문 표기라 de.ics 의 "Christi Himmelfahrt"·de_by.ics 의
# "Fronleichnam" 과 다르다(Himmelfahrtstag, Fronleichnamstag) — 각 피드는 자기
# 근거 조문의 표기를 쓴다(de_be 의 Himmelfahrtstag 와 같은 결정).

# --- scope ---
# bundesweit | land. 전국 공통 9 건은 bundesweit, 나머지(일회성 포함)는 land.
# 9 건의 근거: feiertage-api 2025·2026 16 주 교집합 실측 — API 의 NATIONAL 키·
# rules/de 의 YAML 과 삼중 일치(/tmp/report_bundesweit.md). DESCRIPTION 첫 줄이
# 이 값에서 나온다. 로더가 닫힌 집합으로 검사하고, tests/test_de_scope.py 가
# bundesweit key 집합 == rules/de key 집합을 고정한다.

holidays:
  - key: karfreitag
    name: Karfreitag
    scope: bundesweit
    easter_offset: -2
    verified: true
    source: >-
      HFeiertagsG § 1 Abs. 1 Nr. 2 'der Karfreitag' — Bekanntmachung der Neufassung des
      Gesetzes über die Sonn- und Feiertage vom 29.12.1971, GVBl. 1971 I Nr. 36 S. 343, §
      1 은 S. 344 (30.12.1971 공포; starweb.hessen.de(헤센 주의회) PDF
      https://starweb.hessen.de/cache/GVBL/1971/00036.pdf sha256
      fc2067c2778f3db8a8b7295c72d25f7df020b1b18e512fb2b648432f9ec21f55, 2026-09-29 열람, 재수령
      대조 일치). 1994 개정(GVBl. 1994 I S. 596)은 이 호를 건드리지 않았고 § 1 Abs. 1 의 1994 이후 개정은 찾지
      못함(GVBl. 2026 Nr. 65 까지, 공포본 자기 인용·연간 색인·전 호 검색). 부활절 −2 일은 innen.hessen.de
      2026(03.04)·feiertage-api 2026 HE 대조 일치

