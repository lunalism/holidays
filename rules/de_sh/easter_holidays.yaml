# 독일·슐레스비히홀슈타인 주 공휴일 — 부활절 기준 이동 4 건.
#
# easter_offset 은 부활절 일요일(Ostersonntag)로부터의 날수다. 부활절 자체는
# rules/de_sh/feed.py 가 python-dateutil 의 easter() 로 계산한다(rules/de 와
# 같은 계산기, 같은 근거).
#
# 전국 공통 4 건 그대로다. SH 는 Fronleichnam(+60)·Ostersonntag(0)·
# Pfingstsonntag(+49)이 없다 — § 2 Abs. 1 의 열거에 없다.
#
# key·name·verified 규약과 공포본 서지·확인 경로는 solar_holidays.yaml 머리 주석과
# 같다. name 은 SH 조문 표기라 de.ics 의 "Christi Himmelfahrt" 가 여기서는
# "Himmelfahrtstag" 다(de_be·de_he·de_hh 와 같음). 네 건 모두 2004 제정 공포본이
# 자구 근거이고 2018 개정 후에도 번호가 그대로다(Nr. 2·3·5·6).

# --- scope ---
# bundesweit | land. 전국 공통 9 건은 bundesweit, 나머지(일회성 포함)는 land.
# 9 건의 근거: feiertage-api 2025·2026 16 주 교집합 실측 — API 의 NATIONAL 키·
# rules/de 의 YAML 과 삼중 일치(/tmp/report_bundesweit.md). DESCRIPTION 첫 줄이
# 이 값에서 나온다. 로더가 닫힌 집합으로 검사하고, tests/test_de_scope.py 가
# bundesweit key 집합 == rules/de key 집합을 고정한다.

holidays:
  - key: karfreitag
    name: Karfreitag
    scope: bundesweit
    easter_offset: -2
    verified: true
    source: >-
      SFTG(SH) § 2 Abs. 1 Nr. 2 'Karfreitag' — Gesetz über Sonn- und Feiertage (SFTG)
      vom 28.06.2004, GVOBl. Schl.-H. 2004 Nr. 8 S. 213 (15.07.2004 공포;
      Verkündungsportal 연도판 PDF
      https://verkuendungsportal.schleswig-holstein.de/mm/gvobl_jahrgang_2004/GVOBl_2004.pdf
      sha256 dba6f1a10bf991211a29d6f6c52f2e4f4dab5526c627d46f76b1df6ced26bc41,
      2026-09-09 열람). 2018-03-21 개정(GVOBl. Schl.-H. 2018 Nr. 6 S. 69) 후에도
      Nr. 2 그대로. 부활절 −2 일은 feiertage-api 2026 SH(04-03) 대조 일치

  - key: ostermontag
    name: Ostermontag
    scope: bundesweit
    easter_offset: 1
    verified: true
    source: >-
      SFTG(SH) § 2 Abs. 1 Nr. 3 'Ostermontag' — Gesetz über Sonn- und Feiertage (SFTG)
      vom 28.06.2004, GVOBl. Schl.-H. 2004 Nr. 8 S. 213 (15.07.2004 공포;
      Verkündungsportal 연도판 PDF
      https://verkuendungsportal.schleswig-holstein.de/mm/gvobl_jahrgang_2004/GVOBl_2004.pdf
      sha256 dba6f1a10bf991211a29d6f6c52f2e4f4dab5526c627d46f76b1df6ced26bc41,
      2026-09-09 열람). 2018-03-21 개정(GVOBl. Schl.-H. 2018 Nr. 6 S. 69) 후에도
      Nr. 3 그대로. 부활절 +1 일은 feiertage-api 2026 SH(04-06) 대조 일치

  - key: christi_himmelfahrt
    name: Himmelfahrtstag
    scope: bundesweit
    easter_offset: 39
    verified: true
    source: >-
      SFTG(SH) § 2 Abs. 1 Nr. 5 'Himmelfahrtstag' — Gesetz über Sonn- und Feiertage
      (SFTG) vom 28.06.2004, GVOBl. Schl.-H. 2004 Nr. 8 S. 213 (15.07.2004 공포;
      Verkündungsportal 연도판 PDF
      https://verkuendungsportal.schleswig-holstein.de/mm/gvobl_jahrgang_2004/GVOBl_2004.pdf
      sha256 dba6f1a10bf991211a29d6f6c52f2e4f4dab5526c627d46f76b1df6ced26bc41,
      2026-09-09 열람). 2018-03-21 개정(GVOBl. Schl.-H. 2018 Nr. 6 S. 69) 후에도
      Nr. 5 그대로. 부활절 +39 일은 feiertage-api 2026 SH(05-14, Christi
      Himmelfahrt) 대조 일치

  - key: pfingstmontag
    name: Pfingstmontag
    scope: bundesweit
    easter_offset: 50
    verified: true
    source: >-
      SFTG(SH) § 2 Abs. 1 Nr. 6 'Pfingstmontag' — Gesetz über Sonn- und Feiertage
      (SFTG) vom 28.06.2004, GVOBl. Schl.-H. 2004 Nr. 8 S. 213 (15.07.2004 공포;
      Verkündungsportal 연도판 PDF
      https://verkuendungsportal.schleswig-holstein.de/mm/gvobl_jahrgang_2004/GVOBl_2004.pdf
      sha256 dba6f1a10bf991211a29d6f6c52f2e4f4dab5526c627d46f76b1df6ced26bc41,
      2026-09-09 열람). 2018-03-21 개정(GVOBl. Schl.-H. 2018 Nr. 6 S. 69) 후에도
      Nr. 6 그대로. 부활절 +50 일은 feiertage-api 2026 SH(05-25) 대조 일치
