    verified: false
    source: >-
      BMI 공식 서술(주법 16벌에 의한 전국 공통 9건) + BayFTG Art. 1 원문 +
      독립 소스 3종 교차 실측 일치
    source_todo: 주법 원문 15벌 개별 확인 후 승격

  - key: zweiter_weihnachtstag
    name: Zweiter Weihnachtstag
    month: 12
    day: 26
    verified: false
    source: >-
      BMI 공식 서술(주법 16벌에 의한 전국 공통 9건) + BayFTG Art. 1 원문 +
      독립 소스 3종 교차 실측 일치
