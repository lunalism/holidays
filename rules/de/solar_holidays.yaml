    source_todo: 주법 원문 15벌 개별 확인 후 승격

  - key: tag_der_deutschen_einheit
    name: Tag der Deutschen Einheit
    month: 10
    day: 3
    verified: true
    source: >-
      Einigungsvertrag Art. 2 Abs. 2 — 'Der 3. Oktober ist als Tag der
      Deutschen Einheit gesetzlicher Feiertag.' (gesetze-im-internet.de)

  - key: erster_weihnachtstag
    name: Erster Weihnachtstag
    month: 12
