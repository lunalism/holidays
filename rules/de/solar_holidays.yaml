      BGBl. 1990 II Nr. 35 S. 889, Art. 2 는 S. 890 (28.09.1990 공포; bgbl.de
      문서 bgbl290s0885.pdf
      https://www.bgbl.de/xaver/bgbl/start.xav?startbk=Bundesanzeiger_BGBl&jumpTo=bgbl290s0885.pdf
      Wayback 사본
      https://web.archive.org/web/20230719131947id_/https://www.bgbl.de/xaver/bgbl/media/B9530373AE1BE942B45341AEC08B37B4/bgbl290s0885_67234.pdf
      파일 sha256 은 요청마다 달라 적지 않고 S. 890 이미지 스트림 sha256
      0f70b21d7715670a0db1d9433d8ea04ff534a7e53d3f40521301db6d8a92a6af 을 적는다 —
      정의는 이 파일 머리 주석, 2026-09-17 열람). 스캔 판독 자구 일치, Art. 2 무개정

