# 독일 전국 공통 공휴일 — 고정 날짜 5 건.
#
# 전국 공통의 정의: 16 개 주 전체의 Sonn- und Feiertagsgesetz 가 공통으로
# 보호하는 날. 연방 차원의 공휴일 입법 권한은 없고(연방내무부 서술), 연방법이
# 직접 정한 것은 통일의 날 하나뿐이다. 나머지 8 건은 주법 16 벌이 각자 정한
# 것이 결과적으로 같은 집합이다.
#
# --- 대체공휴일(이동) 규칙이 없다 ---
# 공휴일이 토·일요일과 겹쳐도 다른 날로 옮기지 않는다. 확인한 것:
#   (1) BayFTG(바이에른 Feiertagsgesetz) 전문 Art. 1~9 에 이동 조항 없음.
#   (2) feiertage-api.de 의 2021(10-03 일요일)·2022(12-25 일요일)·2023(01-01
#       일요일)·2027 실측에서 전국 9 건·BY 15 건 그대로, 보상 휴일 항목 0 건.
#   (3) 연방내무부·바이에른·바덴뷔르템베르크 주 정부 페이지에 주말 겹침 서술 없음.
# 그래서 substitute 계열 표와 모듈을 두지 않는다. 규정이 생기면 그때 만든다.
#
# --- key 규약 ---
# UID 의 token 이 된다. 한 번 나가면 바꿀 수 없다(core/ics.py 의 UID 절).
#   - 소문자 ASCII 와 밑줄만. [a-z][a-z_]*
#   - 서수는 풀어 쓴다: "1. Mai" → erster_mai, "Erster Weihnachtstag" →
#     erster_weihnachtstag. 숫자를 넣으면 "1_mai" 처럼 읽는 사람이 서수인지
#     기수인지 알 수 없다.
#   - 움라우트·ß 는 ae/oe/ue/ss 로 옮긴다. 이번 9 건에는 해당 항목이 없다.
#     주별 피드에서 Mariä Himmelfahrt(→ mariae_himmelfahrt), Buß- und Bettag
#     (→ buss_und_bettag) 이 처음 쓰게 된다.
#
# --- name ---
# SUMMARY 에 그대로 실린다. 법조문 표기를 따른다 — BayFTG Art. 1 Abs. 1 과
# BW FTG § 1 의 열거가 일치하는 표기다. API·라이브러리의 표기(Neujahrstag,
# Tag der Arbeit, Erster Mai, 1. Weihnachtstag 등)를 쓰지 않는다.
#
# --- 공포본: 통일의 날 (연방 관보, 2026-09-17 열람) ---
# Einigungsvertrag(Vertrag vom 31.08.1990) Art. 2 Abs. 2 의 공포본은 BGBl. 1990 II
#   Nr. 35 (28.09.1990 공포) — Einigungsvertragsgesetz S. 885, 조약 본문 S. 889,
#   Art. 2 는 S. 890. 열람처는 Bundesanzeiger Verlag 가 운영하는 1949–2022 공개
#   아카이브 bgbl.de(recht.bund.de 가 2023 이전분 열람처로 지정). 문서 식별자
#   attr_id bgbl290s0885.pdf (S. 885–1248, 364 쪽, 텍스트층 없는 스캔).
#   https://www.bgbl.de/xaver/bgbl/start.xav?startbk=Bundesanzeiger_BGBl&jumpTo=bgbl290s0885.pdf
#   (URL 형식은 사이트의 「Linkadresse anzeigen」 기능이 내는 것이다. 문서는 JS 가
#   연다 — 정적 응답에는 식별자가 없고 브라우저에서 pdf.js 뷰어로 364 쪽이 뜬다.)
#   Wayback 사본(원본 바이트):
#   https://web.archive.org/web/20230719131947id_/https://www.bgbl.de/xaver/bgbl/media/B9530373AE1BE942B45341AEC08B37B4/bgbl290s0885_67234.pdf
# 파일 sha256 을 적지 않는 이유: bgbl.de 는 요청마다 PDF 를 새로 만들어 AES-128 로
#   재암호화하므로(/ID·/Info·xref 도 바뀜) 파일 해시가 재현되지 않는다. 다섯 벌
#   (라이브 2026 두 번, Wayback 2021·2021·2023)을 복호화해 비교하면 xref 스트림
#   하나만 다르고 이미지 364 개를 포함한 나머지 객체는 전부 동일했다.
# 대신 적는 값 — S. 890 이미지 스트림 sha256(복호화 후, 필터를 풀지 않은 바이트):
#   0f70b21d7715670a0db1d9433d8ea04ff534a7e53d3f40521301db6d8a92a6af
#   정의: PDF 6 쪽(= S. 890)의 /Resources /XObject /I5 (Form XObject) 안의
#   /XObject /Im0 (이미지 XObject, 객체 35 0, CCITTFaxDecode 618×877 1-bit).
#   사용자 비밀번호 빈 문자열로 복호화한 뒤, /Filter(CCITTFaxDecode)를 풀지 않은
#   스트림 바이트 19,643 B 의 sha256. 디스크의 암호문 그대로도, 디코드한 비트맵도
#   아니다. 재현(격리 실행, 레포 의존성 아님; pikepdf 9.11.0 / libqpdf 12.2.0):
#     uv run --with pikepdf==9.11.0 python -c "import pikepdf,hashlib;p=pikepdf.open('bgbl290s0885.pdf');im=p.pages[5].Resources.XObject['/I5'].Resources.XObject['/Im0'];print(im.objgen,hashlib.sha256(im.read_raw_bytes()).hexdigest())"
#     → (35, 0) 0f70b21d…a6af. pypdf 6.19.0(StreamObject._data)으로도 같은 값.
# 자구: S. 890 스캔 판독 「Der 3. Oktober ist als Tag der Deutschen Einheit
#   gesetzlicher Feiertag.」가 아래 source 인용 71 자와 일치. gesetze-im-internet
#   통합본(XML builddate 20260506)에서 Art. 2 는 개정 기록 없음.
#
# --- verified ---
# 원문을 직접 본 항목만 true. 통일의 날은 Einigungsvertrag Art. 2 Abs. 2 를
# 위 공포본(BGBl. 1990 II S. 890)에서 읽었다. 나머지는 연방내무부의 서술과
# BayFTG Art. 1 원문, 독립 소스 3 종(feiertage-api.de·openholidaysapi.org·
# python-holidays)의 교차 실측이 일치하는 것까지다 — 주법 원문 16 벌 중
# 15 벌을 아직 보지 않았으므로 false 로 둔다.
#
# verified 와 source_todo 는 피드에 나가지 않는다(rules/de/feed.py).

holidays:
  - key: neujahr
    name: Neujahr
    month: 1
    day: 1
    verified: false
    source: >-
      BMI 공식 서술(주법 16벌에 의한 전국 공통 9건) + BayFTG Art. 1 원문 +
      독립 소스 3종 교차 실측 일치
    source_todo: 주법 원문 15벌 개별 확인 후 승격

