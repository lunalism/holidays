# 독일·바덴뷔르템베르크 주 공휴일 — 부활절 기준 이동 5 건.
#
# easter_offset 은 부활절 일요일(Ostersonntag)로부터의 날수다. 부활절 자체는
# rules/de_bw/feed.py 가 python-dateutil 의 easter() 로 계산한다(rules/de 와
# 같은 계산기, 같은 근거).
#
# 전국 공통 4 건에 Fronleichnam(+60, de_by·de_he·de_nw 와 같은 오프셋)이 더해진다.
# BW 는 Ostersonntag(0)·Pfingstsonntag(+49)이 없다 — § 1 의 열거에 없다.
#
# key·name·verified 규약과 공포본 서지·sha256·확인 경로는 solar_holidays.yaml 머리
# 주석과 같다. 다섯 건 모두 Neufassung 1995 인쇄본이 자구 근거이고 조문 그대로가
# SUMMARY 다. Pfingstmontag 은 1994-12-12 개정(GBl. S. 631)으로 § 1 에서 지워졌다가
# 1995-03-23 개정(GBl. S. 293)으로 같은 자리("Christi Himmelfahrt," 뒤)에 재삽입됐다 —
# Neufassung 이 그 결과를 싣는다.

# --- scope ---
# bundesweit | land. 전국 공통 9 건은 bundesweit, 나머지(일회성 포함)는 land.
# 9 건의 근거: feiertage-api 2025·2026 16 주 교집합 실측 — API 의 NATIONAL 키·
# rules/de 의 YAML 과 삼중 일치(/tmp/report_bundesweit.md). DESCRIPTION 첫 줄이
# 이 값에서 나온다. 로더가 닫힌 집합으로 검사하고, tests/test_de_scope.py 가
# bundesweit key 집합 == rules/de key 집합을 고정한다.

