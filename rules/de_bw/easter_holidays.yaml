      Feiertagsgesetzes vom 08.05.1995, GBl. 1995 Nr. 17 S. 450 (30.06.1995 공포; Landtag
      BW 아카이브 PDF
      https://www.landtag-bw.de/resource/blob/75054/19739a8ea1fb5eee00898b30364b0f93/GBl199517.pdf
      sha256 98f68c3039ac0a2df4f9ffc2417aa3f3ef25669c19a6b72e08c15f8f85d4fb94,
      2026-09-09 열람, 재수령 대조 일치). 자구의 입법 뿌리는 1970 Neufassung(GBl. 1971
      S. 1)·1994-12-12 개정(GBl. S. 631)·1995-03-23 개정(GBl. S. 293), § 1 은 그 뒤
      무개정(GBl. 2026 Nr. 79 까지). 부활절 −2 일은 feiertage-api 2026 BW(04-03) 대조 일치

