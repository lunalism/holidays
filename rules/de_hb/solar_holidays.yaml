# 독일·브레멘 주 공휴일 — 고정 날짜 6 건.
#
# 근거: Gesetz über die Sonn-, Gedenk- und Feiertage vom 12. November 1954 (Brem.GBl. S. 115,
# SaBremR 113-c-1) § 2 Abs. 1 — "(1) Staatlich anerkannte Feiertage sind: a) der Neujahrstag,
# b) der Karfreitag, c) der Ostermontag, d) der 1. Mai, e) der Himmelfahrtstag, f) der
# Pfingstmontag, g) der 3. Oktober - Tag der deutschen Einheit -, h) der 1. Weihnachtstag,
# i) der 2. Weihnachtstag, j) der Reformationstag." — 10 건. 고정 날짜는 a·d·g·h·i·j 이고
# 부활절 이동 넷(b·c·e·f)은 easter_holidays.yaml 에 있다. 전국 공통 9 건에 j(31. 10.)가 더해진다.
#
# --- 현행 자구의 출처 — 통합본(2차) ---
# Transparenzportal Bremen https://www.transparenz.bremen.de/sixcms/detail.php?gsid=
# bremen2014_tp.c.145882.de&template=00_html_to_pdf_d — 「Inkrafttreten: 14.03.2020」,
# 「Zuletzt geändert durch: … Geschäftsverteilung des Senats vom 02.09.2025 (Brem.GBl. S. 674)」
# (2026-09-30 열람, 2026-10-07 다시 받아 § 2 Abs. 1 a)–j) 같음). 이 PDF 는 요청 때마다 새로
# 만들어진다 — 메타데이터 CreationDate 가 받은 시각이고, 2026-10-07 판은 바이트 수(295,461)·
# sha256 이 앞선 판(295,467)과 다르다. 텍스트층 쪽별 글자 수는 같다.
# 현행 통합본(gsid 296390)의 PDF 는 HTTP 500 — 2026-09-30 3 회, 2026-10-06 3 회, 2026-10-07
# 3 회. 그래서 2020-03-14 판을 현행으로 삼은 근거는 관보 쪽이다(아래).
#
# --- 2020-03-14 판이 현행이라는 근거 — 관보 전문 검색과 계정 ---
# 1) Brem.GBl. 2020 Nr. 1 – 2026 Nr. 101(PDF 1,056 건 — 철회·폐지로 PDF 가 없는 2025 Nr. 12·91
#    제외, 2026-10-06)과 2026 Nr. 102(2026-10-07)의 PDF 텍스트층을 패턴 feiertag·gedenk·
#    113-c·reformationstag·einmalig 로 찾았다. 적중 중
#    § 2 Abs. 1 개정 0 건, 일회성 공휴일 지정 0 건(§ 12 b) 선언 포함). 이 법의 자구를 바꾸라는
#    지시가 있는 호는 2020 Nr. 12 S. 52(표제에 Gedenk- 삽입·I. Abschnitt 표제·§ 7a 신설) 하나다.
#    통합본 머리가 마지막 변경으로 드는 2025 Nr. 98(S. 674)은 「Bekanntmachung über die Änderung
#    von Zuständigkeiten」 — § 11 의 관할을 옮긴 공고이고 자구 개정 지시가 없다. 2020 Nr. 12 는
#    「zuletzt durch Gesetz vom 26. Juni 2018 (Brem.GBl. S. 302) geändert」 을 개정 대상으로 적고
#    다음 날(14.03.2020) 시행 — 2020-03-14 판의 시행일과 같다.
# 2) 텍스트층이 부족한 쪽(비공백 200 자 미만) 741 개의 계정: 빈 쪽 116(새 규칙, 표본 검증) +
#    구조적으로 닫힘 557 [추론] + 시각 판독 61 + 일부 판독 7(지도 바탕의 작은 라벨만 못 읽음)
#    + 미계정 0. [추론] 557 쪽은 파일의 제목·실행부·서명이 텍스트층에 있고 그 쪽들이 서명 뒤의
#    부속(Staatsvertrag·Anlage 등)이라는 구조 검사(G1–G4)로 닫았다. 내용은 읽지 않았다.
# 미리 정한 판정 기준 2(검색 불가 쪽 0)는 미충족이다. 이 계정으로 기준 2 를 대신하기로 한 것은
# 사람의 결정이다(Holiday_20). 조사 기록: docs/research/report_hb_fulltext.md·
# report_hb_flagged.md·report_hb_structure.md·report_hb_read.md 와 같은 이름의 폴더.
# 교차 확인(근거 아님): 학교 방학 규정 Brem.GBl. 2022 Nr. 142 § 4 가 같은 10 날을 「gesetzliche Feiertage」 로 든다.
#
# --- 공포본 — 온라인으로 닿는 것 ---
# j 만 공포본을 읽었다: Brem.GBl. 2018 Nr. 63 S. 302(아래 reformationstag 항목 source).
# 2013 Nr. 33 S. 231 은 i 의 구두점과 j 의 종전 문언(31. Oktober 2017)만, 2013 Nr. 16 S. 89 는
# §§ 5·6·13 만 바꿨다. a–i 의 자구는 1954 원법과 2013 이전 개정에 의존하는데 브레멘 관보
# 포털의 공개는 2013 년부터라 찾지 못했다.
#
# --- verified ---
# 원문을 직접 본 항목만 true — reformationstag 1 건. 나머지 9 건은 false + source_todo(경계와
# 잔존 경로). 날짜는 feiertage-api 2026 HB(10 건, hinweis 전부 공란)로 대조했다.
# python-holidays(pyproject 에 고정) DE(subdiv='HB') 와의 연도별 대조는
# tests/test_de_hb_feed.py::test_the_dates_agree_with_python_holidays_hb 가 2020~2031 로 돈다.
#
# --- 범위 밖 ---
# § 7a 의 8. Mai(staatlich anerkannter Gedenktag, 2020 Nr. 12)와 § 8 의 religiöse Feiertage
# 는 공휴일이 아니다. § 12 a)(Volkstrauertag 의 날 지정)도 공휴일 지정이 아니다.
#
# --- 대체공휴일(이동) 규칙이 없다 ---
# § 2 에 이동 조항이 없다. 2020~2031 에서 고정 날짜가 일요일과 겹쳐도(2021 10-03·10-31·12-26,
# 2022 05-01·12-25, 2023 01-01, 2027 10-03·10-31·12-26) 보상 휴일이 없다 — 위 테스트가 해마다
# python-holidays HB 와 날짜 집합이 같음을 단언한다. 그 날짜 그대로 싣는다.
#
# --- key 규약 ---
# UID 의 token 이 된다. 한 번 나가면 바꿀 수 없다(core/ics.py 의 UID 절).
# rules/de_be/solar_holidays.yaml 의 규약과 같다. 이 표와 부활절 표의 key 는 전부 기존
# 확립값이다 — reformationstag 는 de_bb·de_hh·de_ni·de_sh 와 같다. 발행되는 UID 의 token 은
# 이 key 앞에 "de_hb-" 가 붙는다(rules/de_hb/feed.py). 접두사 없이는 다른 독일 피드와 UID 가
# 겹친다.
#
# --- name ---
# SUMMARY 에 그대로 실린다. 조문 표기에서 관사 "der" 만 뺐다. g 만 날짜부와 대시도 빼
# "Tag der deutschen Einheit"(소문자 d 도 조문 그대로, de_be·de_bb 와 같다)다. 원문은 각 항목
# source 에 그대로 남긴다.
#
# verified 와 source_todo 는 피드에 나가지 않는다(rules/de_hb/feed.py).

# --- scope ---
# bundesweit | land. 전국 공통 9 건은 bundesweit, 나머지(일회성 포함)는 land.
# 9 건의 근거: feiertage-api 2025·2026 16 주 교집합 실측 — API 의 NATIONAL 키·
# rules/de 의 YAML 과 삼중 일치(실측 요지는 tests/test_de_scope.py 머리 docstring,
# 고정은 같은 파일의 test_bundesweit_keys_equal_the_nationwide_keys). DESCRIPTION 첫
# 줄이 이 값에서 나온다. 로더가 닫힌 집합으로 검사한다.

holidays:
  - key: neujahr
    name: Neujahrstag
    scope: bundesweit
    month: 1
    day: 1
    verified: false
    source: >-
      Gesetz über die Sonn-, Gedenk- und Feiertage (HB) § 2 Abs. 1 Buchst. a 'der Neujahrstag'
      — Transparenzportal Bremen 통합본(Inkrafttreten 14.03.2020 판, gsid 145882, 2026-09-30 열람).
      이 판이 현행이라는 근거: 브레멘 관보 Brem.GBl. 2020 Nr. 1 – 2026 Nr. 102 중 PDF 가 있는 모든 호의 텍스트층에서 § 2
      Abs. 1 을 바꾸는 지시와 일회성 공휴일 지정(§ 12 b) 에 따른 선언 포함)을 찾지 못함(2026-10-06 – 2026-10-07 검색). 날짜
      1. 1. 은 feiertage-api 2026 HB 대조 일치
