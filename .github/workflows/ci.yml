# PR 검사
#
# ---------------------------------------------------------------------------
# publish.yml 과 무엇이 다른가
# ---------------------------------------------------------------------------
# 저쪽은 발행이 목적이고 검사는 그 앞의 관문이다. 이쪽은 검사가 목적이다.
#
# 그래서 테스트 범위가 다르다. 저쪽은 published_artifact 마커를 빼고 돌고
# 여기서는 전부 돈다. 그 마커가 붙은 테스트는 커밋된 feeds/kr.ics 가 지금
# 코드로 재현되는지 보는 것이라, 발행 워크플로에서 돌리면 교착이 된다 —
# 발행본이 낡아 테스트가 깨지고, 깨져서 발행이 멈추고, 멈춰서 발행본이
# 갱신되지 않는다. 발행은 바로 그 발행본을 갱신하러 가는 중이다.
# 자세한 것은 pyproject.toml 의 markers 설명에 있다.
#
# ---------------------------------------------------------------------------
# 이 워크플로가 빨간 것이 늘 잘못은 아니다
# ---------------------------------------------------------------------------
# 규칙이나 데이터를 바꾸는 PR 은 published_artifact 테스트를 깨뜨린다.
# 그것이 이 검사가 하는 말이다 — "이 PR 은 발행되는 .ics 를 바꾼다."
#
# 그 말을 듣고 할 일은 둘 중 하나다.
#   의도한 변경이면  발행본을 함께 갱신해 커밋한다.
#                    uv run python -m rules.kr.feed feeds/kr.ics
#                    uv run python -m rules.status status.json
#   의도하지 않았으면 무엇이 출력을 움직였는지 먼저 본다.
#
# 갱신하지 않고 머지해도 다음 발행이 발행본을 맞춘다. 다만 그 사이에는
# 저장소가 "발행본은 유도된 것"이라고 말하면서 유도되지 않는 상태가 된다.

name: ci

on:
  pull_request:
  # main 에 직접 올라간 것도 본다. 머지 커밋은 PR 검사를 다시 거치지 않으므로
  # (병합은 merge commit 고정이다 — docs/branch-rules.md 참조) 여기가 없으면
  # 머지된 결과 자체는 아무도 안 돌려 본 상태가 된다.
  push:
    branches: [main]

# 같은 PR 에 새 커밋이 올라오면 앞의 실행은 버린다. 발행과 달리 여기서는
# 중간 결과를 남길 이유가 없고, 최신 커밋의 결과만이 판단 근거다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v5

      # uv 는 먼저 Astral 미러(releases.astral.sh)에서 받는다. 실패하면 GitHub
      # Releases 로 되돌아가 다시 받고 그때 경고가 남는다. 액션의 기본값이며
      # v7 에는 끄는 입력이 없다.
      - name: uv 설치
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: 의존성
        run: uv sync

      # ---------------------------------------------------------------
      # 브라우저 스모크(tests/test_landing_smoke.py)의 바이너리.
      # 기대와 경계는 docs/browser-smoke.md 가 든다. 여기는 그 문서가 구현에
      # 넘긴 둘 — 캐시 키와 설치 방식 — 을 적는 자리다.
      #
      # 경로는 아래 스텝이 한 번 정하고 캐시·설치·테스트가 같은 환경변수
      # (PLAYWRIGHT_BROWSERS_PATH)로 읽는다. 셋이 다른 경로를 보면 캐시는
      # 적중하는데 launch 는 바이너리를 못 찾는다.
      #
      # 캐시 키는 playwright-{OS}-{아키텍처}-{playwright 패키지 버전}이다.
      # 브라우저 리비전은 패키지 버전이 1:1 로 정하므로(패키지 안
      # browsers.json) 버전이 곧 리비전이다. 버전은 uv sync 뒤 설치된
      # 패키지 메타데이터에서 읽는다 — uv.lock 해시를 쓰지 않는 것은 무관한
      # 의존 변경마다 미스가 나기 때문이다. OS·아키텍처는 zip 이 플랫폼별이라
      # 든다.
      #
      # 시스템 라이브러리는 받지 않는다(--with-deps 없음). 받으면 매 run
      # apt 저장소에 기대게 된다. 러너 이미지에 이미 있는 라이브러리로
      # launch 가 성립한다 — 이 스텝을 들인 PR 의 CI 에서 확인했다. 이미지
      # 갱신으로 라이브러리가 빠지면 launch 가 실패해 빨개지고(스킵 없음)
      # 발행도 막힌다. 그때 설치 단계에서 받을지는 사람이 정한다.
      #
      # 적중하면 설치 스텝은 있는 것을 다시 받지 않는다 — 네트워크 없음.
      # 발행 run 이 주 3 회 main 스코프의 이 캐시를 읽으므로 PR 이 뜸해도
      # 7 일 미접근 삭제에 걸리지 않는다.
      # ---------------------------------------------------------------
      - name: 브라우저 버전·경로
        id: browser
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=${RUNNER_TEMP}/ms-playwright" >> "$GITHUB_ENV"
          VERSION="$(uv run python -c 'from importlib.metadata import version; print(version("playwright"))')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: 브라우저 캐시
        uses: actions/cache@v6
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.browser.outputs.version }}

      # headless shell 만. 적중 시 무동작이다.
      - name: 브라우저 설치
        run: uv run playwright install --only-shell chromium

      - name: 린트
        run: uv run ruff check .

      # published_artifact 를 포함해 전부 돈다. 이 워크플로가 그 테스트들이
      # CI 에서 실제로 도는 유일한 자리다.
      - name: 테스트
        run: uv run pytest
