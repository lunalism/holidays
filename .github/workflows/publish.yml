# 공휴일 피드 발행
#
# ---------------------------------------------------------------------------
# 매주 자동 실행된다
# ---------------------------------------------------------------------------
# UID 네임스페이스(@holidays.lunalism.com)를 확정하고 발행을 열었다.
# core/ics.py 의 UID_DOMAIN_CONFIRMED 가 True 이고 아래 schedule 이 살아 있다.
#
# 그 플래그를 다시 내리면 이 워크플로는 "피드 생성" 스텝에서 실패한다.
# 순서를 강제하려고 그렇게 두었고, 확정 후에도 그대로다.
#
# UID 는 이미 나갔다. 네임스페이스를 바꾸면 구독자 캘린더에서 모든 공휴일이
# 삭제 + 재생성으로 나타난다. 바꾸는 제안은 그 영향을 먼저 확인할 것.
#
# ---------------------------------------------------------------------------
# 자동 커밋이 데이터 근거를 대체하지 않는다
# ---------------------------------------------------------------------------
# 이 워크플로가 쓰는 것은 산출물 세 개뿐이다.
#   feeds/<국가>.ics    생성된 피드
#   status.json         지금 상태
#   logs/build.jsonl    발행 기록
#
# rules/ 의 YAML(공휴일 규칙·지정 내역)은 절대 건드리지 않는다. 그쪽은 사람이
# 관보·법령 원문을 확인하고 근거와 함께 커밋한다. 기계가 데이터를 고치기
# 시작하면 어느 값이 어디서 왔는지 구분되지 않고, 이 저장소가 근거를 들고
# 있다는 주장 자체가 무너진다.

name: publish

on:
  # 매주 월요일 09:00 KST = 00:00 UTC (KST = UTC+9)
  #
  # 월요일 아침인 이유: 주말에 임시공휴일이 의결되는 일이 있어 주 초에 한 번
  # 훑는 것이 낫다. 09:00 KST 는 사람이 실패 알림을 볼 수 있는 시각이다.
  #
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write # 산출물 커밋·푸시

concurrency:
  # 두 실행이 겹치면 같은 파일을 서로 밀어낸다. 앞의 것을 끝내고 간다
  # (취소하지 않는다 — 취소된 실행은 build.jsonl 에 반쪽으로 남는다).
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # 발행하는 나라 목록. 생성 스텝과 커밋 스텝이 같은 목록을 돈다 —
      # 여기가 단일 공급원이다. 나라를 더하면 rules/<나라>/feed.py 의
      # __main__ 과 feeds/<나라>.ics 경로가 있어야 한다.
      FEEDS: kr jp kr_jp kr_only jp_only de de_be de_by
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          # 이전 발행본을 읽어야 한다. SEQUENCE 의 진실 공급원이 feeds/kr.ics
          # 라서 그 파일의 내용이 필요하다.
          #
          # depth 1 로 충분하다. 필요한 것은 히스토리가 아니라 현재 시점의
          # 파일 내용이고, 커밋도 그 위에 하나 쌓는 것뿐이다.
          fetch-depth: 1

      - name: uv 설치
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 의존성
        run: uv sync

      # ---------------------------------------------------------------
      # 검사가 먼저다. 깨진 상태로는 발행하지 않는다.
      # 여기서 멈추면 이전 발행본이 그대로 남는다 — 낡은 피드가 틀린
      # 피드보다 낫다.
      # ---------------------------------------------------------------
      - name: 린트
        run: uv run ruff check .

      # published_artifact 마커를 뺀다. 그 마커가 붙은 테스트는 커밋된
      # feeds/kr.ics 가 지금 코드로 재현되는지 보는 것이라, 규칙·데이터를
      # 바꾼 커밋이 발행본 갱신 없이 main 에 들어간 상태에서는 반드시 깨진다.
      #
      # 여기서 돌리면 교착이 된다. 발행본이 낡아 테스트가 깨지고, 깨져서
      # 발행이 멈추고, 멈춰서 발행본이 갱신되지 않는다. 이 워크플로는 바로
      # 그 발행본을 갱신하러 가는 중이므로, 낡은 것을 이유로 스스로를
      # 막아서는 안 된다. 실제로 밟힌 적이 있다 — 123873f 가 SUMMARY 31 건을
      # 바꿨고 발행본은 93ab9ff 에서야 따라왔다. 그 사이의 main 이 그 상태다.
      #
      # 대신 .github/workflows/ci.yml 이 PR 에서 전부 돌린다. 출력이 바뀌는
      # PR 은 거기서 빨개지고, 그때 발행본을 함께 갱신할지 사람이 정한다.
      - name: 테스트
        run: uv run pytest -m "not published_artifact"

      # 여기부터는 실패해도 build.jsonl 에 남아야 한다.
      # 각 스텝의 출력을 파일로 모아 두고, 마지막 로그 스텝이 끝부분을 싣는다.
      - name: 빌드 로그 파일 준비
        run: echo "BUILD_LOG_PATH=${RUNNER_TEMP}/build.log" >> "$GITHUB_ENV"

      - name: KASI 인증키 만료 확인
        run: |
          set -o pipefail
          uv run python -m sources.kr.key_expiry 2>&1 | tee -a "$BUILD_LOG_PATH"

      # KASI_SERVICE_KEY 를 주입하지 않는다. 이 스텝은 커밋된 YAML 과 계산만
      # 쓰고 네트워크를 타지 않아서, 넣어 두어도 읽는 곳이 없었다.
      # 없는 비밀값은 샐 수도 없다. 조회 스텝이 생기면 그때 다시 넣을 것 —
      # 그때는 core/buildlog.py 가 error 필드에서 그 값을 지운다.
      - name: 피드 생성
        run: |
          set -o pipefail
          # 빈 FEEDS 는 반복문이 0회 돌아 스텝이 조용히 성공한다 — 발행이
          # 아무것도 안 만들고 정상으로 기록되는 오설정이라 즉시 실패시킨다.
          [ -n "${FEEDS// /}" ] || { echo "FEEDS 가 비어 있다" >&2; exit 1; }
          for C in $FEEDS; do
            uv run python -m "rules.${C}.feed" "feeds/${C}.ics" 2>&1 | tee -a "$BUILD_LOG_PATH"
          done

      - name: status.json 생성
        run: |
          set -o pipefail
          uv run python -m rules.status status.json 2>&1 | tee -a "$BUILD_LOG_PATH"

      # ---------------------------------------------------------------
      # 여기부터 always(). 위에서 무엇이 실패했든 기록은 남는다.
      # ---------------------------------------------------------------
      - name: 발행 기록
        if: always()
        env:
          # job.status 는 이 시점까지의 결과다. 앞 스텝이 실패했으면 failure.
          BUILD_RESULT: ${{ job.status }}
        run: |
          BUILD_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            uv run python -m core.buildlog

      - name: 커밋 & 푸시
        if: always()
        env:
          # 커밋 메시지가 이 실행의 결과를 말해야 한다. 아래 MESSAGE 참조.
          BUILD_RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 피드의 비교·원복·스테이징은 아래 나라별 반복문에서 한다 —
          # stage_one 을 쓰므로 그 정의 뒤여야 한다. 여기서는 반복문이 채울
          # 변수만 비운다 (set -u 라 초기화 없이는 참조가 죽는다).
          #   CHANGED    바뀐 나라 목록, 공백 구분 ("kr jp")
          #   SUMMARIES  나라별 요약, "; " 구분 ("kr: ...; jp: ...")
          #   SUMMARY    마지막으로 바뀐 나라의 요약 — 나라 하나만 바뀐
          #              커밋 메시지가 접두사 없이 이 값을 그대로 쓴다
          CHANGED=""
          SUMMARIES=""
          SUMMARY=""

          # status.json 과 logs/ 는 항상 올린다.
          # status.json 은 generated_at 이 매번 바뀌므로 늘 커밋거리가 되고,
          # 그 커밋이 저장소를 살아 있게 해 Actions 의 60 일 비활성화를 막는다.
          # DESIGN.md 의 발행 파이프라인 참조.
          #
          # 한 번에 여러 경로를 주지 않는다. git add 는 pathspec 하나가 안
          # 맞으면 전부 취소하므로, 앞 스텝이 실패해 status.json 이 없으면
          # build.jsonl 까지 함께 빠진다. 그러면 실패 기록이 러너를 넘어
          # 남지 않고 연속 실패 집계가 영원히 2 에 닿지 않는다 — 실패를
          # 시끄럽게 만들려고 넣은 장치가 통째로 죽는다.
          #
          # 실패를 삼키지도 않는다. || true 로 뭉개면 위와 같은 사고가 조용히
          # 반복된다. 있는 파일만 골라 넣고, 넣은 것이 실제로 스테이징됐는지
          # 확인한다.
          # stage_one: 파일 하나를 인덱스에 넣고, 실제로 들어갔는지 확인한다.
          #
          # 확인에 git diff --cached 를 쓰지 않는다. 내용이 HEAD 와 같은 파일은
          # 정상적으로 add 되어도 diff 에 안 나타나므로 성공과 실패를 가르지
          # 못한다. "인덱스에 이 경로가 있는가"를 직접 묻는다.
          stage_one() {
            git add -- "$1"
            if ! git ls-files --error-unmatch -- "$1" > /dev/null 2>&1; then
              echo "스테이징에 실패했다: $1" >&2
              return 1
            fi
          }

          for TARGET in status.json logs/build.jsonl; do
            if [ ! -e "$TARGET" ]; then
              echo "없어서 건너뜀: $TARGET"
              continue
            fi
            stage_one "$TARGET"
          done

          # 스테이징은 실행 결과와 무관하다. 바뀐 것은 올린다.
          # 여기서 결과를 보기 시작하면 "실패했지만 피드는 멀쩡한" 실행에서
          # 만들어 둔 피드가 조용히 버려진다.
          #
          # 피드는 DTSTAMP 를 빼고 비교한다. DTSTAMP 는 실행 시각이라 내용이
          # 하나도 안 바뀐 재발행에도 매번 달라진다. 그대로 커밋하면 diff 가
          # 늘 떠서 "무엇이 실제로 바뀌었나"를 diff 로 볼 수 없게 된다.
          #
          # 빈 FEEDS 즉시 실패 — 생성 스텝과 같은 가드다. 이 스텝은 always()
          # 라 생성 스텝이 안 돌았어도 들어오므로 따로 한 번 더 막는다.
          [ -n "${FEEDS// /}" ] || { echo "FEEDS 가 비어 있다" >&2; exit 1; }
          for C in $FEEDS; do
            PREV="${RUNNER_TEMP}/prev-${C}.ics"
            FEED="feeds/${C}.ics"
            C_CHANGED=0
            if [ -f "$FEED" ]; then
              # 추적 여부를 먼저 본다. git diff 는 untracked 파일을 아예 보지
              # 않으므로, 첫 발행처럼 파일이 새로 생긴 경우에도 --quiet 가
              # "변화 없음"으로 성공한다. 그걸 믿으면 첫 피드가 영원히
              # 스테이징되지 않고, 러너가 바뀌어도 같은 일이 반복된다.
              if git cat-file -e "HEAD:${FEED}" 2>/dev/null; then
                git show "HEAD:${FEED}" > "$PREV"
                if diff -q <(grep -v '^DTSTAMP:' "$PREV") \
                           <(grep -v '^DTSTAMP:' "$FEED") > /dev/null; then
                  # DTSTAMP 말고는 같다. 원복해서 diff 를 남기지 않는다.
                  git checkout -- "$FEED"
                  C_CHANGED=0
                else
                  C_CHANGED=1
                fi
              else
                # HEAD 에 없다 = 첫 발행. untracked 라 git diff 로는 안 잡힌다.
                C_CHANGED=1
                : > "$PREV"
              fi
            fi
            if [ "$C_CHANGED" = "1" ]; then
              stage_one "$FEED"
              SUMMARY="$(uv run python -m core.ics "$PREV" "$FEED" || echo '내용 변경')"
              CHANGED="${CHANGED:+$CHANGED }${C}"
              SUMMARIES="${SUMMARIES:+$SUMMARIES; }${C}: ${SUMMARY}"
            fi
          done

          # 커밋 메시지는 이 실행이 실제로 한 일을 말해야 한다.
          #
          # 전에는 FEED_CHANGED 만 보고 정했다. 그래서 발행이 실패한 실행도
          # "chore: status 갱신" 으로 나갔다 — 그 커밋에 담긴 것은 실패 기록
          # 한 줄뿐이고, status.json 은 앞 스텝이 건너뛰어져 아예 없는데도
          # 그렇게 적혔다. 감사 로그가 거짓을 말하는 커밋이다.
          #
          # 이 저장소는 근거를 들고 있다고 주장한다. 그 주장은 기계가 쓰는
          # 커밋에도 걸린다. 실패를 성공처럼 적으면 나중에 히스토리로
          # "언제부터 갱신이 끊겼나" 를 물을 수 없다.
          if [ "${BUILD_RESULT}" = "success" ]; then
            if [ -n "$CHANGED" ]; then
              SCOPE="${CHANGED// /,}"
              case "$CHANGED" in
                *" "*)
                  # 여러 나라 — 요약마다 나라 이름을 단다.
                  MESSAGE="feat(${SCOPE}): 피드 갱신 — ${SUMMARIES}"
                  ;;
                *)
                  # 나라 하나 — 스코프가 이미 나라를 말하므로 요약에 접두사를
                  # 달지 않는다. kr 하나일 때의 메시지가 반복문 도입 전과
                  # 바이트까지 같아야 한다.
                  MESSAGE="feat(${SCOPE}): 피드 갱신 — ${SUMMARY}"
                  ;;
              esac
            else
              MESSAGE="chore: status 갱신 $(date -u +%Y-%m-%d)"
            fi
          else
            MESSAGE="chore: 발행 실패 기록 $(date -u +%Y-%m-%d) (${BUILD_RESULT})"
            if [ -n "$CHANGED" ]; then
              # 실패했지만 피드는 만들어졌다. 둘 다 커밋되므로 둘 다 적는다.
              MESSAGE="${MESSAGE} — 피드 변경 포함"
            fi
          fi

          if git diff --cached --quiet; then
            echo "올릴 변경이 없다."
            exit 0
          fi
          git commit -m "$MESSAGE"
          git push

      # 2 회 연속 실패하면 이슈를 연다. 실패가 조용히 쌓이는 것을 막는다.
      # 같은 제목의 열린 이슈가 있으면 새로 만들지 않는다 — 매주 이슈가
      # 하나씩 늘면 그 자체가 소음이 되어 아무도 안 본다.
      - name: 연속 실패 시 이슈
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "발행 실패가 연속되고 있습니다"
        run: |
          set -euo pipefail
          FAILS="$(uv run python -m core.buildlog --consecutive-failures || echo 0)"
          echo "연속 실패 ${FAILS} 회"
          if [ "${FAILS}" -lt 2 ]; then
            echo "2 회 미만이라 이슈를 만들지 않는다."
            exit 0
          fi
          # 열린 이슈 제목을 그대로 받아 클라이언트에서 맞춰 본다.
          #
          # --search 를 쓰지 않는다. 그건 GitHub 검색 인덱스를 타는데, 인덱스는
          # 즉시 반영되지 않는다. 방금 만든 이슈가 아직 안 잡히면 다음 실행이
          # 없는 줄 알고 하나 더 만든다. concurrency 는 동시 실행만 막고 연속
          # 실행은 막지 않으므로 실제로 밟히는 경로다. 소음을 막으려고 넣은
          # 장치가 소음을 내게 된다.
          #
          # 이슈 목록은 --state open 만으로 정확히 받아진다. 검색이 필요한
          # 규모가 아니다(열린 이슈가 수백 개가 되면 --limit 를 올릴 것).
          #
          # 부분 일치도 피한다. --search 는 제목 일부만 겹쳐도 걸리므로,
          # 사람이 연 다른 이슈가 우연히 이 문구를 포함하면 알림이 영영 막힌다.
          # 여기서는 제목이 정확히 같을 때만 같은 것으로 본다.
          # 제목 비교는 셸에서 한다. gh 의 --jq 는 표현식 하나만 받고 jq 의
          # --arg 를 넘겨주지 못해, 제목을 표현식 안에 문자열로 끼워 넣어야
          # 한다. 그러면 따옴표가 든 제목에서 깨진다.
          # grep -F -x 는 고정 문자열 · 줄 전체 일치라 그 문제가 없다.
          OPEN_TITLES="$(gh issue list --state open --limit 200 --json title --jq '.[].title')"
          if printf '%s\n' "${OPEN_TITLES}" | grep -Fxq -- "${TITLE}"; then
            echo "같은 제목의 열린 이슈가 이미 있다."
            exit 0
          fi

          # 본문은 파일로 만들어 넘긴다. heredoc 을 YAML 블록 안에 그대로 쓰면
          # 들여쓰기가 본문에 섞이거나 블록 스칼라가 깨진다.
          BODY="${RUNNER_TEMP}/issue.md"
          {
            printf '발행 워크플로가 %s 회 연속 실패했습니다.\n\n' "${FAILS}"
            printf -- '- 실행: %s/%s/actions/runs/%s\n' \
              "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}"
            printf -- '- 기록: `logs/build.jsonl` 의 마지막 줄들\n\n'
            printf '발행이 멈춰도 이미 나가 있는 `.ics` 는 그대로라 구독자 쪽에서는\n'
            printf '아무 일도 없어 보입니다. 갱신이 끊긴 상태이므로 확인이 필요합니다.\n\n'
            printf '자주 걸리는 것:\n'
            printf -- '- KASI 활용기간 만료 (`sources/kr/kasi_names.yaml` 의 `service.expires_on`)\n'
            printf -- '- `KASI_SERVICE_KEY` Secret 미설정 또는 만료\n'
            printf -- '- UID 네임스페이스 미확정 (`core/ics.py` 의 `UID_DOMAIN_CONFIRMED`)\n'
          } > "${BODY}"

          gh issue create --title "${TITLE}" --body-file "${BODY}"
