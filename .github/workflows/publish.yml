# 공휴일 피드 발행
#
# ---------------------------------------------------------------------------
# 지금은 수동 실행만 된다
# ---------------------------------------------------------------------------
# schedule 이 주석 처리되어 있다. UID 네임스페이스(@holidays.lunalism.com)가
# 아직 잠정이라 첫 발행을 보류한 상태다. UID 는 한 번 나가면 바꿀 수 없다.
#
# 확정하면 두 가지를 함께 해야 한다.
#   1. core/ics.py 의 UID_DOMAIN_CONFIRMED 를 True 로
#   2. 아래 schedule 주석 해제
# 1 없이 2 만 풀면 publish() 가 거부해서 워크플로가 실패한다. 의도한 순서다.
#
# ---------------------------------------------------------------------------
# 자동 커밋이 데이터 근거를 대체하지 않는다
# ---------------------------------------------------------------------------
# 이 워크플로가 쓰는 것은 산출물 세 개뿐이다.
#   feeds/kr.ics        생성된 피드
#   status.json         지금 상태
#   logs/build.jsonl    발행 기록
#
# rules/ 의 YAML(공휴일 규칙·지정 내역)은 절대 건드리지 않는다. 그쪽은 사람이
# 관보·법령 원문을 확인하고 근거와 함께 커밋한다. 기계가 데이터를 고치기
# 시작하면 어느 값이 어디서 왔는지 구분되지 않고, 이 저장소가 근거를 들고
# 있다는 주장 자체가 무너진다.

name: publish

on:
  # 매주 월요일 09:00 KST = 00:00 UTC (KST = UTC+9)
  #
  # 월요일 아침인 이유: 주말에 임시공휴일이 의결되는 일이 있어 주 초에 한 번
  # 훑는 것이 낫다. 09:00 KST 는 사람이 실패 알림을 볼 수 있는 시각이다.
  #
  # 첫 발행 보류 중이라 비활성. 위 설명 참조.
  # schedule:
  #   - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write # 산출물 커밋·푸시

concurrency:
  # 두 실행이 겹치면 같은 파일을 서로 밀어낸다. 앞의 것을 끝내고 간다
  # (취소하지 않는다 — 취소된 실행은 build.jsonl 에 반쪽으로 남는다).
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          # 이전 발행본을 읽어야 한다. SEQUENCE 의 진실 공급원이 feeds/kr.ics
          # 라서 그 파일의 내용이 필요하다.
          #
          # depth 1 로 충분하다. 필요한 것은 히스토리가 아니라 현재 시점의
          # 파일 내용이고, 커밋도 그 위에 하나 쌓는 것뿐이다.
          fetch-depth: 1

      - name: uv 설치
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 의존성
        run: uv sync

      # ---------------------------------------------------------------
      # 검사가 먼저다. 깨진 상태로는 발행하지 않는다.
      # 여기서 멈추면 이전 발행본이 그대로 남는다 — 낡은 피드가 틀린
      # 피드보다 낫다.
      # ---------------------------------------------------------------
      - name: 린트
        run: uv run ruff check .

      - name: 테스트
        run: uv run pytest

      # 여기부터는 실패해도 build.jsonl 에 남아야 한다.
      # 각 스텝의 출력을 파일로 모아 두고, 마지막 로그 스텝이 끝부분을 싣는다.
      - name: 빌드 로그 파일 준비
        run: echo "BUILD_LOG_PATH=${RUNNER_TEMP}/build.log" >> "$GITHUB_ENV"

      - name: KASI 인증키 만료 확인
        run: |
          set -o pipefail
          uv run python -m sources.kr.key_expiry 2>&1 | tee -a "$BUILD_LOG_PATH"

      - name: 피드 생성
        env:
          KASI_SERVICE_KEY: ${{ secrets.KASI_SERVICE_KEY }}
        run: |
          set -o pipefail
          uv run python -m rules.kr.feed feeds/kr.ics 2>&1 | tee -a "$BUILD_LOG_PATH"

      - name: status.json 생성
        run: |
          set -o pipefail
          uv run python -m rules.kr.status status.json 2>&1 | tee -a "$BUILD_LOG_PATH"

      # ---------------------------------------------------------------
      # 여기부터 always(). 위에서 무엇이 실패했든 기록은 남는다.
      # ---------------------------------------------------------------
      - name: 발행 기록
        if: always()
        env:
          # job.status 는 이 시점까지의 결과다. 앞 스텝이 실패했으면 failure.
          BUILD_RESULT: ${{ job.status }}
        run: |
          BUILD_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            uv run python -m core.buildlog

      - name: 커밋 & 푸시
        if: always()
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 피드는 DTSTAMP 를 빼고 비교한다. DTSTAMP 는 실행 시각이라 내용이
          # 하나도 안 바뀐 재발행에도 매번 달라진다. 그대로 커밋하면 diff 가
          # 늘 떠서 "무엇이 실제로 바뀌었나"를 diff 로 볼 수 없게 된다.
          PREV="${RUNNER_TEMP}/prev.ics"
          FEED_CHANGED=0
          if [ -f feeds/kr.ics ]; then
            if git diff --quiet -- feeds/kr.ics; then
              # git 이 보기에도 변화가 없다(첫 발행이면 untracked 라 여기 안 온다).
              FEED_CHANGED=0
            elif git show HEAD:feeds/kr.ics > "$PREV" 2>/dev/null; then
              if diff -q <(grep -v '^DTSTAMP:' "$PREV") \
                         <(grep -v '^DTSTAMP:' feeds/kr.ics) > /dev/null; then
                # DTSTAMP 말고는 같다. 원복해서 diff 를 남기지 않는다.
                git checkout -- feeds/kr.ics
                FEED_CHANGED=0
              else
                FEED_CHANGED=1
              fi
            else
              # HEAD 에 없다 = 첫 발행.
              FEED_CHANGED=1
              : > "$PREV"
            fi
          fi

          # status.json 과 logs/ 는 항상 올린다.
          # status.json 은 generated_at 이 매번 바뀌므로 늘 커밋거리가 되고,
          # 그 커밋이 저장소를 살아 있게 해 Actions 의 60 일 비활성화를 막는다.
          # DESIGN.md 의 발행 파이프라인 참조.
          git add -- status.json logs/build.jsonl 2>/dev/null || true

          if [ "$FEED_CHANGED" = "1" ]; then
            git add -- feeds/kr.ics
            SUMMARY="$(uv run python -m core.ics "$PREV" feeds/kr.ics || echo '내용 변경')"
            MESSAGE="feat(kr): 피드 갱신 — ${SUMMARY}"
          else
            MESSAGE="chore: status 갱신 $(date -u +%Y-%m-%d)"
          fi

          if git diff --cached --quiet; then
            echo "올릴 변경이 없다."
            exit 0
          fi
          git commit -m "$MESSAGE"
          git push

      # 2 회 연속 실패하면 이슈를 연다. 실패가 조용히 쌓이는 것을 막는다.
      # 같은 제목의 열린 이슈가 있으면 새로 만들지 않는다 — 매주 이슈가
      # 하나씩 늘면 그 자체가 소음이 되어 아무도 안 본다.
      - name: 연속 실패 시 이슈
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "발행 실패가 연속되고 있습니다"
        run: |
          set -euo pipefail
          FAILS="$(uv run python -m core.buildlog --consecutive-failures || echo 0)"
          echo "연속 실패 ${FAILS} 회"
          if [ "${FAILS}" -lt 2 ]; then
            echo "2 회 미만이라 이슈를 만들지 않는다."
            exit 0
          fi
          EXISTING="$(gh issue list --state open \
            --search "in:title \"${TITLE}\"" --json number --jq 'length')"
          if [ "${EXISTING}" != "0" ]; then
            echo "같은 제목의 열린 이슈가 이미 있다."
            exit 0
          fi

          # 본문은 파일로 만들어 넘긴다. heredoc 을 YAML 블록 안에 그대로 쓰면
          # 들여쓰기가 본문에 섞이거나 블록 스칼라가 깨진다.
          BODY="${RUNNER_TEMP}/issue.md"
          {
            printf '발행 워크플로가 %s 회 연속 실패했습니다.\n\n' "${FAILS}"
            printf -- '- 실행: %s/%s/actions/runs/%s\n' \
              "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}"
            printf -- '- 기록: `logs/build.jsonl` 의 마지막 줄들\n\n'
            printf '발행이 멈춰도 이미 나가 있는 `.ics` 는 그대로라 구독자 쪽에서는\n'
            printf '아무 일도 없어 보입니다. 갱신이 끊긴 상태이므로 확인이 필요합니다.\n\n'
            printf '자주 걸리는 것:\n'
            printf -- '- KASI 활용기간 만료 (`sources/kr/kasi_names.yaml` 의 `service.expires_on`)\n'
            printf -- '- `KASI_SERVICE_KEY` Secret 미설정 또는 만료\n'
            printf -- '- UID 네임스페이스 미확정 (`core/ics.py` 의 `UID_DOMAIN_CONFIRMED`)\n'
          } > "${BODY}"

          gh issue create --title "${TITLE}" --body-file "${BODY}"
