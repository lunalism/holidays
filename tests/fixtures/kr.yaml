# 대한민국 공휴일 정답 픽스처
#
# 이 파일이 유일한 정답 원천이다. 케이스를 추가할 때 파이썬 코드를 고칠 일은 없어야 한다.
# tests/test_kr_fixtures.py 가 이 파일을 읽어 id 별로 parametrize 한다.
#
# 필드 규약
#   id           테스트 id. 유일해야 한다.
#   why          왜 이 답인지. 실패 시 pytest 출력에 그대로 찍힌다. 필수.
#   source       관보/고시/법령 근거. 확인된 것만 적는다.
#   source_todo  아직 확인하지 못한 근거. 추측해서 채우지 말 것.
#
# source 가 비어 있고 source_todo 만 있는 항목은 "답은 맞지만 근거 미확인" 상태다.
# test_every_case_has_a_source 가 이 목록을 추적한다 (현재 xfail).
#
# kind 어휘
#   statutory  법정공휴일 (「관공서의 공휴일에 관한 규정」 제2조 열거)
#   substitute 대체공휴일
#   temporary  임시공휴일 (국무회의 심의·의결로 그때그때 지정)
#   election   임기만료에 의한 선거의 선거일
#
# 미해결 설계 질문 (구현 전 결정 필요)
#   - 「관공서의 공휴일에 관한 규정」은 일요일도 공휴일로 열거한다. 피드에 매주 일요일을
#     내보낼 것인가? 이 픽스처는 판단을 피하려고 일요일 케이스를 넣지 않았다.
#     정책이 정해지면 그때 케이스를 추가할 것.

version: 1

# ---------------------------------------------------------------------------
# days — 특정 날짜의 정답
# ---------------------------------------------------------------------------
days:

  # -------------------------------------------------------------------------
  # [대체공휴일 소급 금지]
  # 대체공휴일 제도는 2013년 「관공서의 공휴일에 관한 규정」 개정으로 처음 생겼고,
  # 그때 대상은 설 연휴·추석 연휴·어린이날뿐이었다. 국경일(3·1절·광복절·개천절·
  # 한글날)이 대상에 들어온 것은 2021년 개정부터다.
  # 지금 규칙을 과거 연도에 적용하면 없던 공휴일이 생긴다. 연도별 시행 규칙을
  # 따라가야 한다.
  # -------------------------------------------------------------------------

  - id: 2015-08-15-광복절-토요일-대체없음
    date: 2015-08-15
    expect:
      is_holiday: true
      names: [광복절]
      kinds: [statutory]
    why: |
      2015-08-15 은 토요일이지만 대체공휴일이 발생하지 않는다.
      2015년 시점의 대체공휴일 대상은 설 연휴·추석 연휴·어린이날뿐이었고
      광복절을 포함한 국경일은 아예 대상이 아니었다.
      "국경일인데 토요일이라 제외"가 아니라 "국경일 자체가 미대상"이 정확한 이유다.
      2021년 개정 이후 규칙을 소급 적용하면 이 날짜에서 오답이 난다.
    source: 「관공서의 공휴일에 관한 규정」(대통령령) — 2021년 개정 전 대체공휴일 조항의 대상은 설·추석 연휴와 어린이날로 한정
    source_todo: 2013년 신설 당시 및 2021년 개정 대통령령 호수·관보 게재일 미확인

  - id: 2015-08-17-대체공휴일-아님
    date: 2015-08-17
    expect:
      is_holiday: false
      names: []
      kinds: []
    why: |
      위 케이스의 반대편 증거. 광복절이 토요일이었다고 해서 다음 월요일이
      대체공휴일이 되지 않는다. 구현이 현행 규칙을 무조건 적용하면 이 날이
      대체공휴일로 잘못 잡힌다.
    source: 「관공서의 공휴일에 관한 규정」(대통령령) — 2015년 당시 국경일은 대체공휴일 미대상
    source_todo: 위와 동일

  # 아래는 요청 목록에 없던 보강 케이스. 2015-08-15 와 같은 주에 있고,
  # "대체공휴일이 아닌데 쉬었다"는 사실이 소급 판단을 흐리기 때문에 같이 둔다.
  - id: 2015-08-14-임시공휴일
    date: 2015-08-14
    expect:
      is_holiday: true
      names: [임시공휴일]
      kinds: [temporary]
    why: |
      광복 70주년을 계기로 국무회의 의결을 거쳐 지정된 임시공휴일. 금요일이다.
      2015년 8월 광복절 주간에 쉰 날이 있었다는 사실이 "그때도 대체공휴일이
      있었다"는 오해로 이어지기 쉬워, 별개 제도임을 못박기 위해 둔다.
      규칙으로 계산할 수 없고 하드코딩 대상이다.
    source:
    source_todo: 2015년 임시공휴일 지정 국무회의 의결일·관보 게재일 미확인

  - id: 2020-08-17-임시공휴일-대체아님
    date: 2020-08-17
    expect:
      is_holiday: true
      names: [임시공휴일]
      kinds: [temporary]
    why: |
      2020-08-15 광복절이 토요일이라 이 월요일을 대체공휴일로 착각하기 쉽다.
      그러나 2020년에는 국경일이 아직 대체공휴일 대상이 아니었다.
      이 날은 국무회의 의결로 따로 지정된 임시공휴일이며, 근거 조항과 발생 원리가
      전혀 다르다. kind 가 substitute 로 나오면 오답이다.
      대체공휴일이었다면 규칙에서 유도되지만, 임시공휴일이므로 하드코딩해야 한다.
    source:
    source_todo: 2020년 8월 17일 임시공휴일 지정 국무회의 의결일·관보 게재일 미확인

  # -------------------------------------------------------------------------
  # [대체공휴일 규칙 비대칭]
  # 국경일류는 토·일 모두 대체 대상이지만, 설·추석 연휴는 일요일과 겹칠 때만
  # 대상이다. 토요일과 겹치는 설·추석 연휴는 그냥 사라진다.
  # 이 비대칭을 놓치면 추석 연휴 마지막날이 토요일인 해마다 오답이 난다.
  # 선언적 규칙표는 아래 substitute_rules 섹션에 있다.
  # -------------------------------------------------------------------------

  - id: 2026-09-26-추석-토요일
    date: 2026-09-26
    expect:
      is_holiday: true
      names: [추석 연휴]
      kinds: [statutory]
    why: |
      2026년 추석은 09-25(금). 연휴는 09-24(목)~09-26(토)이고 마지막날이 토요일이다.
      설·추석 연휴는 일요일과 겹칠 때만 대체공휴일 대상이므로 여기서는 대체가 없다.
      같은 상황이 국경일이었다면 대체공휴일이 생긴다 — 그 차이가 이 케이스의 요점이다.
    source: 「관공서의 공휴일에 관한 규정」 — 설·추석 연휴의 대체공휴일은 일요일과 겹치는 경우로 한정
    source_todo: 해당 조·항 번호 및 최신 개정 대통령령 호수 미확인

  - id: 2026-09-28-추석-대체공휴일-없음
    date: 2026-09-28
    expect:
      is_holiday: false
      names: []
      kinds: []
    why: |
      추석 연휴 마지막날(09-26)이 토요일이지만 대체공휴일이 생기지 않으므로
      그 다음 월요일은 평일이다. 09-27 은 일요일이라 경계 증거로 쓸 수 없어
      월요일을 골랐다.
      "토요일과 겹쳤으니 다음 평일로 넘긴다"는 국경일 규칙을 설·추석에 잘못
      적용하면 이 날이 공휴일로 잡힌다.
    source: 「관공서의 공휴일에 관한 규정」 — 설·추석 연휴는 토요일과 겹쳐도 대체공휴일 없음
    source_todo: 해당 조·항 번호 미확인

  # 아래는 요청 목록에 없던 보강 케이스. 비대칭을 주장하려면 반대쪽 예시가
  # 필요하다. 국경일이 토요일과 겹치면 실제로 대체공휴일이 생긴다는 증거.
  - id: 2021-10-11-한글날-토요일-대체공휴일-발생
    date: 2021-10-11
    expect:
      is_holiday: true
      names: [대체공휴일]
      kinds: [substitute]
    why: |
      2021-10-09 한글날이 토요일이라 다음 월요일이 대체공휴일이 되었다.
      2026-09-28(추석 토요일 → 대체 없음)과 나란히 놓아야 비대칭이 드러난다.
      같은 "토요일과 겹침"인데 국경일은 넘어가고 추석은 넘어가지 않는다.
      2021년 개정으로 국경일이 대체공휴일 대상에 들어온 첫 해라는 점도 함께 확인된다.
    source: 「관공서의 공휴일에 관한 규정」 2021년 개정 — 3·1절·광복절·개천절·한글날을 대체공휴일 대상에 추가
    source_todo: 개정 대통령령 호수·공포일·시행일 미확인

  # -------------------------------------------------------------------------
  # [음력 경계]
  # 설·추석은 음력에서 환산되고, 연휴는 명절 당일 앞뒤로 붙는다.
  # 환산이 하루만 밀려도 연휴 3일이 통째로 어긋난다.
  # 특히 설 연휴는 "설날 전날부터"라서, 설날을 연휴 첫날로 착각하면 하루씩 밀린다.
  # -------------------------------------------------------------------------

  - id: 2026-02-16-설연휴-첫날
    date: 2026-02-16
    expect:
      is_holiday: true
      names: [설날 연휴]
      kinds: [statutory]
    why: |
      2026년 설날은 02-17(화). 연휴는 설날 전날부터이므로 02-16(월)이 첫날이다.
      설날을 연휴 첫날로 잡으면 02-17~19 가 되어 전체가 하루 밀린다.
      요청서에 명시된 "17~19 아님"이 바로 이 오류를 가리킨다.
    source:
    source_todo: 「관공서의 공휴일에 관한 규정」의 설날 연휴 범위(전날·당일·다음날) 조항 번호 미확인

  - id: 2026-02-17-설날-당일
    date: 2026-02-17
    expect:
      is_holiday: true
      names: [설날]
      kinds: [statutory]
    why: |
      음력 1월 1일의 2026년 환산 결과. 이 날짜가 틀리면 연휴 3일이 모두 틀린다.
      2025년은 윤달이 든 해라 단순히 354일을 더하는 방식으로는 맞출 수 없다.
      음력 환산 테이블 또는 라이브러리가 반드시 필요하다는 근거 케이스.
    source:
    source_todo: 한국천문연구원 음양력 자료 기준 확인 필요

  - id: 2026-02-18-설연휴-마지막날
    date: 2026-02-18
    expect:
      is_holiday: true
      names: [설날 연휴]
      kinds: [statutory]
    why: |
      설날 다음날. 연휴는 여기서 끝난다.
    source:
    source_todo: 위와 동일

  - id: 2026-02-19-설연휴-끝난-다음날
    date: 2026-02-19
    expect:
      is_holiday: false
      names: []
      kinds: []
    why: |
      경계 증거. 목요일이며 평일이다.
      환산이 하루 밀려 02-17~19 로 계산되면 이 날이 공휴일로 잘못 잡힌다.
      연휴 3일을 맞히는 것만으로는 부족하고, 바로 다음날이 평일임을 함께
      확인해야 오프바이원을 잡을 수 있다.
    source:
    source_todo: 위와 동일

  # -------------------------------------------------------------------------
  # [임시공휴일 — 계산 불가, 하드코딩]
  # 국무회의 심의·의결로 그때그때 지정되고 규칙성이 없다. 어떤 알고리즘으로도
  # 유도할 수 없으므로 근거와 함께 목록으로 관리해야 한다.
  # 각 항목은 관보 근거를 확인한 뒤에 확정할 것.
  #
  # 주의: 2026-06-03 지방선거일은 이 그룹에 함께 요청되었으나 임시공휴일이 아니다.
  # 아래 별도 소절에서 이유와 함께 다룬다.
  # -------------------------------------------------------------------------

  - id: 2025-01-27-임시공휴일
    date: 2025-01-27
    expect:
      is_holiday: true
      names: [임시공휴일]
      kinds: [temporary]
    why: |
      2025년 설 연휴(01-28~30) 앞 월요일에 지정된 임시공휴일.
      연휴 앞뒤에 붙는 형태라 규칙처럼 보이지만 규칙이 아니다. 같은 배치의
      다른 해에는 지정되지 않았다. 패턴으로 유도하려는 시도는 반드시 실패한다.
    source:
    source_todo: 2025년 1월 27일 임시공휴일 지정 국무회의 의결일·관보 게재일 미확인

  - id: 2023-10-02-임시공휴일
    date: 2023-10-02
    expect:
      is_holiday: true
      names: [임시공휴일]
      kinds: [temporary]
    why: |
      개천절(10-03) 앞 월요일에 지정된 임시공휴일. 추석 연휴와 개천절 사이의
      징검다리 평일을 메운 사례다.
      "공휴일 사이에 낀 평일은 쉰다"는 규칙은 존재하지 않는다. 그해에만 의결된 것이다.
    source:
    source_todo: 2023년 10월 2일 임시공휴일 지정 국무회의 의결일·관보 게재일 미확인

  # 2020-08-17 도 임시공휴일이지만 [대체공휴일 소급 금지] 그룹에 두었다.
  # 대체공휴일과의 혼동을 막는 것이 그 케이스의 본래 목적이기 때문이다.

  # --- 선거일: 전부 같은 종류가 아니다 -------------------------------------
  # 「관공서의 공휴일에 관한 규정」제2조가 공휴일로 열거하는 것은 "임기만료에 의한"
  # 선거의 선거일뿐이다. 궐위·재보궐로 치러지는 선거의 선거일은 여기에 해당하지 않고,
  # 쉬게 하려면 국무회의 의결로 임시공휴일을 따로 지정해야 한다.
  # "선거일이면 공휴일"로 뭉뚱그리면 kind 가 전부 틀린다.
  # 아래 두 케이스는 월·일이 같고 분류가 반대인 대조쌍이다.
  - id: 2026-06-03-지방선거일
    date: 2026-06-03
    expect:
      is_holiday: true
      names: [제9회 전국동시지방선거]
      kinds: [election]
    why: |
      요청서에는 임시공휴일 그룹으로 분류되었으나, 임기만료에 의한 선거의 선거일은
      「관공서의 공휴일에 관한 규정」제2조가 직접 열거하는 법정공휴일이다.
      국무회의 의결로 그때그때 지정되는 임시공휴일과 근거 조항이 다르므로
      kind 를 temporary 가 아니라 election 으로 둔다.
      "계산 불가라서 하드코딩"이라는 취지에는 어긋나지 않는다. 지방선거일은
      4년 주기 수요일이라 형태상 계산은 되지만, 실제 날짜는 선거관리위원회 공고로
      확정되므로 규칙 유도에 기대지 않고 확인된 값을 넣는 편이 안전하다.
      2026-06-03 은 수요일이다.
      바로 아래 2025-06-03 대통령선거일과 월·일이 같지만 kind 가 반대다.
      그쪽은 궐위로 인한 선거라 법정공휴일이 아니고 임시공휴일로 지정되었다.
      두 케이스를 나란히 두는 이유는 날짜 모양만 보고 분류하면 반드시 틀리기 때문이다.
    source: 「관공서의 공휴일에 관한 규정」 제2조 — 「공직선거법」에 따른 임기만료에 의한 선거의 선거일을 공휴일로 열거
    source_todo: 해당 호 번호 및 제9회 전국동시지방선거일 확정 공고 근거 미확인

  - id: 2025-06-03-제21대-대통령선거일
    date: 2025-06-03
    expect:
      is_holiday: true
      names: [임시공휴일]
      kinds: [temporary]
    why: |
      대통령 궐위로 인한 선거라 「관공서의 공휴일에 관한 규정」제2조가 열거하는
      "임기만료에 의한 선거"에 해당하지 않는다. 즉 법정공휴일이 아니다.
      국무회의 의결로 별도 지정된 건이므로 kind 는 election 이 아니라 temporary 다.

      바로 위 2026-06-03 지방선거일과 월·일이 같고 분류가 정반대인 대조 케이스다.
      2026-06-03 은 임기만료 선거 → election(법정공휴일),
      2025-06-03 은 궐위 선거 → temporary(임시공휴일).
      "6월 3일 선거일" 이라는 겉모습이 같으므로, 날짜나 선거 여부만 보고 분류하는
      구현은 둘 중 하나를 반드시 틀린다. 구분 기준은 선거의 사유(임기만료 / 궐위)다.

      규칙으로 유도할 수 없다. 궐위 발생 시점은 예측 대상이 아니므로 하드코딩한다.
      2025-06-03 은 화요일이다.
    source: 2025-04-08 국무회의 의결 및 같은 날짜 관보 공고
    source_todo:

  # -------------------------------------------------------------------------
  # [신규 — 제헌절 공휴일 부활]
  # 공휴일 목록 자체가 연도에 따라 바뀐다는 사례. 구현은 "어떤 날이 공휴일인가"를
  # 연도 함수로 다뤄야 하며, 고정 목록을 두면 여기서 깨진다.
  # -------------------------------------------------------------------------

  - id: 2026-07-17-제헌절-부활
    date: 2026-07-17
    expect:
      is_holiday: true
      names: [제헌절]
      kinds: [statutory]
    why: |
      제헌절은 공휴일에서 제외되어 있다가 2026년부터 다시 공휴일이 된다.
      2025년 이전 연도에 같은 답을 내면 오답이므로, 시행 연도 경계를 반드시
      구현에 반영해야 한다.
      2026-07-17 은 금요일이라 이 해에는 대체공휴일이 발생하지 않는다.
      대체공휴일 "적용 대상"인 것과 실제로 대체공휴일이 "발생"하는 것은 다르다.
      적용 대상 여부는 아래 substitute_rules 에서 따로 검증한다.
      시행일이 2026-05-11 이므로 07-17 은 시행 이후다. 이 케이스는 안전하다.
    source: 「공휴일에 관한 법률」 개정 (법률 제21338호, 2026-02-10 공포, 2026-05-11 시행)
    source_todo: 2차 출처 기준. 법제처 원문 대조 필요.

  - id: 2025-07-17-제헌절-시행전
    date: 2025-07-17
    expect:
      is_holiday: false
      names: []
      kinds: []
    why: |
      시행 경계의 반대편 증거. 2025년 제헌절은 아직 공휴일이 아니다.
      제헌절을 공휴일 목록에 무조건 넣으면 이 케이스에서 걸린다.
      시행일이 2026-05-11 이므로 2025-07-17 은 여유 있게 시행 전이다.
      경계가 빠듯한 쪽은 2026-05-11 전후이며, 그 구간 케이스는 아직 없다.
    source: 「공휴일에 관한 법률」 개정 (법률 제21338호, 2026-02-10 공포, 2026-05-11 시행)
    source_todo: 2차 출처 기준. 법제처 원문 대조 필요.

# ---------------------------------------------------------------------------
# substitute_rules — 대체공휴일 적용 대상 여부 (비대칭 규칙 자체를 검증)
#
# days 섹션은 특정 날짜의 결과만 본다. 그것만으로는 "우연히 맞은 것"과
# "규칙을 제대로 구현한 것"이 구분되지 않는다. 규칙 자체를 표로 고정한다.
#
# 조회 단위는 연도가 아니라 날짜다. 규칙 개정이 연중에 시행된 해가 있어
# (예: 2021-08-04) 같은 해 안에서도 답이 갈린다. 연도로 물으면 답이 하나로
# 정해지지 않으므로, 그 공휴일의 실제 날짜를 찍어서 묻는다.
# ---------------------------------------------------------------------------
substitute_rules:

  - id: rule-광복절-2026
    holiday: 광복절
    date: 2026-08-15
    expect:
      applies_to_saturday: true
      applies_to_sunday: true
    why: |
      국경일류는 토·일 모두 대체공휴일 대상이다.
      같은 해의 추석 규칙과 비교하기 위한 기준선.
    source: 「관공서의 공휴일에 관한 규정」 2021년 개정 — 3·1절·광복절·개천절·한글날에 대체공휴일 적용
    source_todo: 개정 대통령령 호수·조항 번호 미확인

  - id: rule-광복절-2015
    holiday: 광복절
    date: 2015-08-15
    expect:
      applies_to_saturday: false
      applies_to_sunday: false
    why: |
      같은 광복절이라도 2015년에는 대체공휴일 대상이 아니었다.
      규칙표가 연도를 인자로 받아야 한다는 근거. 연도를 무시하면
      2015-08-15 케이스와 함께 깨진다.
    source: 「관공서의 공휴일에 관한 규정」 — 2021년 개정 전 국경일은 대체공휴일 미대상
    source_todo: 개정 전후 대통령령 호수 미확인

  - id: rule-추석-2026
    holiday: 추석
    date: 2026-09-25
    expect:
      applies_to_saturday: false
      applies_to_sunday: true
    why: |
      비대칭의 핵심. 설·추석 연휴는 일요일과 겹칠 때만 대체공휴일 대상이고
      토요일과 겹치면 그냥 사라진다.
      rule-광복절-2026 과 같은 해·같은 요일 조건인데 답이 다르다.
    source: 「관공서의 공휴일에 관한 규정」 — 설·추석 연휴의 대체공휴일은 일요일과 겹치는 경우로 한정
    source_todo: 조·항 번호 미확인

  - id: rule-설날-2026
    holiday: 설날
    date: 2026-02-17
    expect:
      applies_to_saturday: false
      applies_to_sunday: true
    why: |
      설날도 추석과 동일하다. 두 명절을 다르게 구현하는 실수를 막기 위해 함께 둔다.
    source: 「관공서의 공휴일에 관한 규정」 — 설·추석 연휴의 대체공휴일은 일요일과 겹치는 경우로 한정
    source_todo: 조·항 번호 미확인

  - id: rule-제헌절-2026
    holiday: 제헌절
    date: 2026-07-17
    expect:
      applies_to_saturday: true
      applies_to_sunday: true
    why: |
      제헌절은 국경일이므로 국경일류 규칙을 따라 토·일 모두 대상으로 본다.

      경고: 이 픽스처에서 확신도가 가장 낮은 항목이다.
      이 값은 "국경일류는 토·일 모두 대상"이라는 분류에서 역산한 것이지 조문을
      직접 확인한 결과가 아니다. 게다가 제헌절 대체공휴일은 2027년부터라는
      기술이 따로 있어, 2026년에 적용 대상인지 자체가 미확정이다.
      그 기술이 맞다면 이 케이스의 정답은 false/false 로 뒤집힌다.
      대통령령 제36290호 부칙을 확인하기 전까지 이 항목을 근거로 삼지 말 것.

      2026-07-17 이 금요일이라 실제 발생 사례로는 검증되지도 않는다.
      제헌절이 주말에 걸리는 해가 와야 실증된다.
    source:
    source_todo: |
      제헌절 대체공휴일의 2026년 적용 여부 미확정 — 대통령령 제36290호 부칙 확인 필요.
      확인 결과에 따라 expect 가 뒤집힐 수 있다.
      제헌절 재지정 법률에서 대체공휴일 적용 대상에 포함되는지 조문 직접 확인 필요.
      국경일류와 다르게 규정되었을 가능성을 배제하지 못했다.
