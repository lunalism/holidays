holidays:
  - key: neujahr
    name: Neujahrstag
    scope: bundesweit
    month: 1
    day: 1
    verified: false
    source: >-
      Gesetz über die Sonn-, Gedenk- und Feiertage (HB) § 2 Abs. 1 Buchst. a 'der Neujahrstag' — Transparenzportal Bremen 통합본(Inkrafttreten 14.03.2020 판, 2026-09-30 열람). 날짜 1. 1. 은 feiertage-api 2026 HB 대조 일치
    source_todo: >-
      § 2 Abs. 1 의 이 자구는 1954 원법(Brem.GBl. S. 115)과 2013 이전 개정에 의존하고, Brem.GBl. 온라인 공개는 2013 년부터다. 현행 통합본(2025-06-30 판)은 2026-09-30 열람 시 서버 오류. 잔존 경로: 실물 Brem.GBl.·Staatsarchiv Bremen 열람.

