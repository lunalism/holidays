# 랜딩의 일본어 문구.
#
# ko.yaml 과 키 구조가 같아야 한다. ui 아래의 키는 landing/template.html 의
# {{t:키}}·{{j:키}} 마커와 양방향으로 맞아야 한다 — 어느 쪽에만 있어도
# render.py 가 멈춘다.
#
# 주 피드(state_feed)의 주 이름은 아직 한국어다. feed.py 의 LAND_NAME 이
# 한국어이고 독일어 표기의 근거가 레포에 없기 때문이다(BY·HE·NW).
# 근거가 확보되면 독일어 원표기로 바뀐다.

lang: ja
# 언어 전환 링크에 뜨는 자기 이름. 자기 언어로 적는다 — 번역 대상이 아니다.
name: 日本語
# toLocaleDateString 의 로케일 — 날짜 표기(2026年9月11日).
locale: ja-JP

ui:
  # <title> 과 <h1> 둘 다.
  title: "祝日カレンダー"
  # 언어 전환 nav 의 aria-label.
  lang_nav: "言語"
  # og:title 은 title 과 따로 든다 — 구분자(" — ")가 언어마다 다를 수 있다.
  og_title: "祝日カレンダー — holidays.lunalism.com"
  # meta description 과 og:description 은 같은 값이다.
  description: "韓国・日本・ドイツの祝日 iCalendar 購読フィード。韓国は法令と天文計算から導き、韓国天文研究院の特日情報と照合します。日本は内閣府「国民の祝日について」のデータに基づき、ドイツは全国共通フィードと州法上の祝日を加えた州別フィードを提供します。項目ごとに根拠を添えています。"
  # 고유명사 유지: 内閣府「国民の祝日について」
  lead: |-
    カレンダーアプリで購読すると、韓国・日本・ドイツの祝日が自動で入ります。
    韓国は法令と天文計算から導き、韓国天文研究院の特日情報と照合します。
    日本は内閣府「国民の祝日について」のデータに基づき、
    ドイツは全国共通フィードと州法上の祝日を加えた州別フィードを提供します。
    項目ごとに根拠を添えています。
  h_subscribe: "購読"
  # 고유명사 유지: 元日, 休日（元日）, Neujahr, 1. Mai
  subscribe_note_names: |-
    日本フィードの項目名は日本語の原文（元日、休日（元日）など）で表記されます。
    ドイツフィードの項目名は法文の表記（Neujahr、1. Mai など）です。
  # 인용부 「URL で追加」·「新規照会カレンダー」 는 각 앱 일본어판의 실제 UI 표기다.
  # Google 캘린더: 「他のカレンダー」＋ →「URL で追加」.
  # Apple 캘린더(Mac): 「ファイル」＞「新規照会カレンダー」 (support.apple.com/ja-jp/guide/calendar/icl1022/mac).
  subscribe_note_apps: "Google カレンダーは「URL で追加」、Apple カレンダーは「新規照会カレンダー」から上のアドレスを入力します。"
  # 절 제목 여덟. feed-data 의 label 과 문자열이 같은 것이 있지만 자리가 달라 따로 든다.
  h_kr: "韓国"
  h_jp: "日本"
  h_de: "ドイツ"
  h_krjp: "韓国・日本"
  h_kronly: "韓国だけが休む日"
  h_jponly: "日本だけが休む日"
  h_updated: "最終更新"
  h_verify: "原文照合"
  # 상태 블록 공통 라벨.
  range_label: "収録期間"
  events_label: "収録項目"
  confirmed: "確定"
  provisional: "暫定"
  pending: "読み込み中"
  failed: "ステータス情報を読み込めませんでした。"
  # 피드별 설명 단락. 문장 일부가 겹치는 단락이 있지만 단락 단위로 든다.
  note_kr: |-
    暫定区間は現行の規則で計算した値です。まだ確定の発表前であり、
    規則が改正されたり臨時祝日が指定されると変わります。
  note_jp: "全区間が確定項目です。暫定区間は設けていません。"
  note_de: |-
    16 州すべてで有効な全国共通の祝日のみを収録します。州別の祝日は
    含まれていません。全区間が確定項目です。暫定区間は設けていません。
  # [KR]·[JP] 는 피드 항목의 실제 접두 표기 — 유지.
  note_krjp: |-
    項目名の前の [KR]・[JP] は、どちらの国の祝日かを示します。
    収録期間は両国のフィードのうち短いほうまでです。
  note_kronly: |-
    韓国の祝日のうち、両国がともに休む日付は含みません。
    名前が異なる祝日でも同じ日であれば除かれます。判定の基準は日本の
    祝日のみで、週末は見ません。収録期間は両国のフィードのうち短いほうまでです。
  note_jponly: |-
    日本の祝日のうち、両国がともに休む日付は含みません。
    名前が異なる祝日でも同じ日であれば除かれます。判定の基準は韓国の
    祝日のみで、週末は見ません。全区間が確定項目で、収録期間は
    両国のフィードのうち短いほうまでです。
  updated_warn: "通常は毎週更新されます。更新が止まっている可能性があります。"
  # {item_count}·{unverified_count} 는 render.py 가 <span data-*> 로 바꾼다. 마크업을 여기 적지 않는다.
  verify_intro: |-
    すべての日付は自前の計算と韓国天文研究院の特日情報との照合を経ています。
    その上で法令・官報の原文まで確認する作業は規則表の項目（祝日の定義と
    条文）単位で数えており、以下は規則表 {item_count} 件のうちまだ
    確認できていない数です。
  verify_stat: "規則表 {item_count} 件のうち {unverified_count} 件が確認待ち"
  # 날짜는 사실 — 2015-08-14, 2015-08-04.
  verify_note: |-
    照合が常に一致するとは限りません。2015年8月14日（光復70周年の
    臨時祝日）は特日情報 API に含まれていません。2015年8月4日の
    国務会議の議決と外交部の告知で確認して収録しました。
  footer_source: "規則表・根拠・生成コードはすべて公開されています —"
  footer_issues: "不具合の報告と提案："
  # 스크립트 문자열. render.py 가 JS 리터럴로 이스케이프한다.
  copy_button: "購読アドレスをコピー"
  copied: "コピーしました"
  copy_failed: "コピーできませんでした"
  open_in_app: "カレンダーアプリで開く"
  # {n}·{date} 자리는 스크립트가 값으로 채운다(fmt). 어순은 문구가 정한다.
  count: "{n}件"
  none: "なし"
  today: "今日"
  days_ago: "{n}日前"
  updated_at: "{date} 更新"
  range_separator: " ~ "

# ---- feed-data ----
groups:
  countries: { title: "国別すべて" }
  de_states: { title: "ドイツ州別フィード" }
  merged: { title: "一つのフィードに統合" }
  disjoint: { title: "重ならない日のみ" }

# 주 피드 유도 규칙. 자세한 것은 ko.yaml 의 같은 절.
#   land_lang: de — {land} 에 독일어 주 이름(feed.py 의 LAND_NAME_DE)이 들어간다.
#              표기 근거는 독일 기본법 전문이고 rules/de/feed.py 가 든다.
#   label:     "ドイツ・{land}" — CALNAME 에서 떼는 방식은 못 쓴다(CALNAME 이 한국어다).
#
# label_suffix 는 한국어로 둔다 — 주 피드가 아닌 kr·jp·kr_jp 의 폴백에 쓰이는
# 값이고(render.py), feed.py 의 CALNAME 이 한국어라 이 접미만 한국어여야 잘린다.
# ja 는 그 셋의 label 을 아래에서 명시하므로 실제로는 폴백을 타지 않는다.
state_feed:
  land_lang: de
  label: "ドイツ・{land}"
  label_suffix: " 공휴일"
  desc: "全国共通に{land}州法の祝日を加えた上位集合"

# 주 피드가 아닌 것.
#   ko.yaml 에서는 kr·jp·kr_jp 의 label 을 CALNAME 에서 유도하지만,
#   CALNAME 이 한국어라 여기서는 여섯 전부 label 을 적는다.
feeds:
  kr:
    label: "韓国"
    desc: "韓国の祝日すべて"
  jp:
    label: "日本"
    desc: "日本の祝日すべて"
  de:
    label: "ドイツ"
    desc: "全国共通 — 16 州すべてで有効な祝日のみ（州別の祝日を除く）"
  kr_jp:
    label: "韓国・日本"
    desc: "両国の祝日すべて。項目ごとに [KR]・[JP] を表記"
  kr_only:
    label: "韓国のみ"
    desc: "韓国の祝日のうち日本が休まない日"
  jp_only:
    label: "日本のみ"
    desc: "日本の祝日のうち韓国が休まない日"
