# 랜딩의 한국어 문구.
#
# feed-data(groups·state_feed·feeds)와 UI 문구(ui)가 함께 산다. ui 아래의 키는
# landing/template.html 의 {{t:키}}·{{j:키}}·{{p:키}} 마커와 양방향으로 맞아야 한다 —
# 어느 쪽에만 있어도 render.py 가 멈춘다. lang·locale 도 마커로 쓰인다.
#
# 값은 2026-09-11 시점의 index.html 에서 그대로 옮겼다. 여러 줄 값은 원문의 줄
# 나눔을 유지한 것이고, render.py 가 마커 자리의 들여쓰기로 이어 붙인다.

lang: ko
# 언어 전환 링크에 뜨는 자기 이름. 자기 언어로 적는다 — 번역 대상이 아니다.
name: 한국어
# toLocaleDateString 의 로케일 — 날짜 표기(2026년 9월 11일).
locale: ko-KR

ui:
  # <title> 과 <h1> 둘 다.
  title: "공휴일 캘린더"
  # 언어 전환 nav 의 aria-label.
  lang_nav: "언어"
  # og:title 은 title 과 따로 든다 — 구분자(" — ")가 언어마다 다를 수 있다.
  og_title: "공휴일 캘린더 — holidays.lunalism.com"
  # meta description 과 og:description 은 같은 값이다.
  description: "대한민국·일본·독일 공휴일 iCalendar 구독 피드. 대한민국은 법령과 천문 계산으로 유도해 한국천문연구원 특일정보와 대조하고, 일본은 内閣府 国民の祝日 데이터를 기준으로 하며, 독일은 전국 공통 피드와 주법상 공휴일을 더한 주별 피드를 제공합니다. 항목마다 근거를 함께 둡니다."
  # 고유명사 유지: 内閣府「国民の祝日について」
  lead: |-
    캘린더 앱에서 구독하면 대한민국·일본·독일의 공휴일이 자동으로 들어옵니다.
    대한민국은 법령과 천문 계산으로 유도해 한국천문연구원 특일정보와
    대조하고, 일본은 内閣府「国民の祝日について」데이터를 기준으로 하며,
    독일은 전국 공통 피드와 주법상 공휴일을 더한 주별 피드를 제공합니다.
    항목마다 근거를 함께 둡니다.
  h_subscribe: "구독"
  # 고유명사 유지: 元日, 休日（元日）, Neujahr, 1. Mai
  subscribe_note_names: |-
    일본 피드의 항목 이름은 일본어 원문(元日, 休日（元日） 등)으로 표기됩니다.
    독일 피드의 항목 이름은 법조문 표기(Neujahr, 1. Mai 등)입니다.
  # 인용부 “URL로 추가”·“새로운 캘린더 구독” 은 각 앱의 실제 UI 표기다 — 언어마다 앱 표기를 따른다.
  subscribe_note_apps: "Google 캘린더는 “URL로 추가”, Apple 캘린더는 “새로운 캘린더 구독”에 위 주소를 넣습니다."
  # 절 제목 여덟. feed-data 의 label 과 문자열이 같은 것이 있지만 자리가 달라 따로 든다.
  h_kr: "대한민국"
  h_jp: "일본"
  h_de: "독일"
  h_krjp: "대한민국·일본"
  h_kronly: "대한민국만 쉬는 날"
  h_jponly: "일본만 쉬는 날"
  h_updated: "마지막 갱신"
  h_verify: "원문 대조"
  # 상태 블록 공통 라벨.
  range_label: "수록 기간"
  events_label: "수록 항목"
  confirmed: "확정"
  provisional: "잠정"
  pending: "불러오는 중"
  failed: "상태 정보를 불러오지 못했습니다."
  # 피드별 설명 단락. 문장 일부가 겹치는 단락이 있지만 단락 단위로 든다.
  note_kr: |-
    잠정 구간은 현행 규칙으로 계산한 값입니다. 아직 확정 발표 전이며,
    규칙이 개정되거나 임시공휴일이 지정되면 달라집니다.
  note_jp: "전 구간이 확정 항목입니다. 잠정 구간은 두지 않습니다."
  note_de: |-
    16개 주 모두에서 유효한 전국 공통 공휴일만 싣습니다. 주별 공휴일은
    들어 있지 않습니다. 전 구간이 확정 항목입니다. 잠정 구간은 두지 않습니다.
  # [KR]·[JP] 는 피드 항목의 실제 접두 표기 — 유지.
  note_krjp: |-
    항목 이름 앞의 [KR]·[JP] 는 어느 나라의 공휴일인지 표시합니다.
    수록 기간은 두 나라 피드 중 짧은 쪽까지입니다.
  note_kronly: |-
    대한민국 공휴일 중 양국이 함께 쉬는 날짜는 포함하지 않습니다.
    이름이 다른 공휴일이라도 같은 날이면 빠집니다. 판정 기준은 일본의
    공휴일뿐이며 주말은 보지 않습니다. 수록 기간은 두 나라 피드 중 짧은 쪽까지입니다.
  note_jponly: |-
    일본 공휴일 중 양국이 함께 쉬는 날짜는 포함하지 않습니다.
    이름이 다른 공휴일이라도 같은 날이면 빠집니다. 판정 기준은 대한민국의
    공휴일뿐이며 주말은 보지 않습니다. 전 구간이 확정 항목이고, 수록 기간은
    두 나라 피드 중 짧은 쪽까지입니다.
  updated_warn: "정상적으로는 매주 갱신됩니다. 갱신이 멈춘 상태일 수 있습니다."
  # {item_count}·{unverified_count} 는 render.py 가 <span data-*> 로 바꾼다. 마크업을 여기 적지 않는다.
  verify_intro: |-
    모든 날짜는 자체 계산과 한국천문연구원 특일정보 대조를 거칩니다.
    그 위에 법령·관보 원문까지 확인하는 작업은 규칙표의 항목(공휴일 정의와
    조문) 단위로 세며, 아래는 규칙표 {item_count}건 중 아직
    확인하지 못한 수입니다.
  verify_stat: "규칙표 {item_count}건 중 {unverified_count}건 확인 대기"
  # 날짜는 사실 — 2015-08-14, 2015-08-04.
  verify_note: |-
    대조가 항상 일치하는 것은 아닙니다. 2015년 8월 14일(광복 70주년
    임시공휴일)은 특일정보 API에 포함돼 있지 않습니다. 2015년 8월 4일
    국무회의 의결과 외교부 공지로 확인해 수록했습니다.
  footer_source: "규칙표·근거·생성 코드는 모두 공개되어 있습니다 —"
  footer_issues: "문제 제보와 제안:"
  # 스크립트 문자열. render.py 가 JS 리터럴로 이스케이프한다.
  copy_button: "구독 주소 복사"
  copied: "복사됨"
  copy_failed: "복사하지 못했습니다"
  open_in_app: "캘린더 앱에서 열기"
  # {n}·{date} 자리는 스크립트가 값으로 채운다(fmt). 어순은 문구가 정한다.
  #
  # 숫자+단위를 한 조각으로 조립하는 키(count·days_ago)는 one·other 두 갈래를
  # 든다. 고르는 것은 스크립트의 fmt 다 — n === 1 이면 one, 아니면 other.
  # 한국어는 복수형이 없어 둘이 같은 값이다. 영어처럼 갈리는 언어에서 실제로
  # 쓰인다("{n} item" / "{n} items"). 갈래가 없는 언어에서 한 줄로 적지 않는
  # 것은, 그러면 언어를 늘릴 때 조립기의 모양이 언어마다 달라지기 때문이다.
  count:
    one: "{n}건"
    other: "{n}건"
  none: "없음"
  today: "오늘"
  days_ago:
    one: "{n}일 전"
    other: "{n}일 전"
  updated_at: "{date} 갱신"
  range_separator: " ~ "

# ---- feed-data ----
groups:
  countries: { title: "나라별 전체" }
  de_states: { title: "독일 주별 피드" }
  merged: { title: "한 피드로 합침" }
  disjoint: { title: "겹치지 않는 날만" }

# 주 피드 유도 규칙.
#   land_lang: {land} 에 넣을 주 이름을 어느 표기에서 가져올지. 닫힌 집합이고
#              render.py 가 표기별 상수로 옮긴다 — ko 는 feed.py 의 LAND_NAME,
#              de 는 LAND_NAME_DE(기본법 전문 표기, 근거는 rules/de/feed.py).
#              언어 코드가 아니라 표기 이름이다. 언어가 늘어도 이 집합은 안 늘어난다.
#   label:     {land} 를 넣어 만든다. "독일·{land}" 는 CALNAME 에서 " 공휴일" 을
#              떼던 것과 아홉 주 전부 같은 값이다(tests/test_de_scope.py 가 고정).
#   desc:      {land} 에 같은 값을 넣은 것
state_feed:
  land_lang: ko
  label: "독일·{land}"
  label_suffix: " 공휴일"
  desc: "전국 공통에 {land} 주법 공휴일을 더한 상위집합"

# 주 피드가 아닌 것.
#   label 이 없으면 CALNAME 에서 label_suffix 를 뗀 것을 쓴다(kr·jp·kr_jp).
#   그 규칙으로 안 나오는 셋(de·kr_only·jp_only)만 label 을 적는다.
#   desc 는 유도할 데가 없어 전부 적는다.
feeds:
  kr:
    desc: "대한민국 공휴일 전체"
  jp:
    desc: "일본 공휴일 전체"
  de:
    label: "독일"
    desc: "전국 공통 — 16개 주 모두 유효한 공휴일만 (주별 공휴일 제외)"
  kr_jp:
    desc: "양국 공휴일 전체. 항목마다 [KR]·[JP] 표기"
  kr_only:
    label: "대한민국만"
    desc: "대한민국 공휴일 중 일본이 쉬지 않는 날"
  jp_only:
    label: "일본만"
    desc: "일본 공휴일 중 대한민국이 쉬지 않는 날"
