# KASI dateName → 이 프로젝트의 공휴일 키 매핑
#
# API 는 사람이 읽는 이름만 준다. 코드도 식별자도 없다. 그래서 이름을 키로 옮기는
# 표가 필요하고, 그 표는 명시적이어야 한다. 이름 규칙을 추론해서 자동으로
# 맞추려 들면 새 공휴일이 조용히 잘못 붙는다.
#
# ---------------------------------------------------------------------------
# 모르는 이름은 예외로 터뜨린다
# ---------------------------------------------------------------------------
# 여기 없는 dateName 을 만나면 UnmappedHolidayName 이 난다. 무시하지 않는다.
# 무시하면 KASI 가 새로 추가한 공휴일을 놓치고, 놓친 것은 오류로 드러나지 않는다.
# 누락은 오탐보다 알아채기 어렵다.
#
# 이름이 하나 늘었다는 것은 대개 둘 중 하나다.
#   - 법이 바뀌어 공휴일이 생겼다 (rules/kr 쪽도 함께 고쳐야 한다)
#   - 임시공휴일이 지정되었다 (designated_holidays.yaml 에 넣어야 한다)
# 어느 쪽이든 사람이 판단할 일이다. 표에 한 줄 넣고 끝낼 문제가 아니다.
#
# ---------------------------------------------------------------------------
# 수록 범위
# ---------------------------------------------------------------------------
# 지금 실린 이름은 2015~2028 년 응답에서 실제로 관측된 것뿐이다(sources/kr/cache 참조).
# 2029 년 이후는 KASI 에 데이터가 없다(빈 응답). 새 이름이 나오면 응답을 보고
# 한 줄씩 확인해서 넣을 것. 미리 짐작해서 채우지 말 것.
#
# 표기가 흔들린다. 같은 공휴일이 해마다 다른 이름으로 온다.
#   신정 → 1월1일 / 석가탄신일 → 부처님오신날 (2018 년경 변경)
#   대체휴무일 → 대체공휴일 → 대체공휴일(원인) (원인 표기는 2024 년경부터)
#   국회의원선거일 / 국회의원선거 / 제21대 국회의원선거 (회차 표기가 들쭉날쭉)
# 전부 별칭으로 받는다. 이름을 정규화하려 들지 말고 관측된 문자열을 그대로 키로 쓴다.
#
# key 는 substitute_holidays.yaml 의 holidays 레지스트리와 같은 값을 쓴다.
# 어긋나면 tests/test_kasi_parser.py 가 잡는다.
# key 가 비어 있는 항목은 그 표에 없는 것들이다. 선거일·임시공휴일이 그렇고,
# designated_holidays.yaml 이 날짜별로 따로 들고 있다.

version: 1
source: sources/kr/cache/getRestDeInfo_2026.xml (조회 2026-08-08)

# 대체공휴일 이름은 "대체공휴일(원인공휴일)" 꼴이다. 접두어로 알아본다.
substitute_prefix: 대체공휴일

names:
  # --- 양력 고정 ---
  1월1일:          { key: new_years_day,     kind: statutory }
  신정:            { key: new_years_day,     kind: statutory, note: 2015~2017 표기. 이후 "1월1일". }
  삼일절:          { key: samiljeol,         kind: statutory }
  노동절:          { key: labor_day,         kind: statutory }
  어린이날:        { key: childrens_day,     kind: statutory }
  현충일:          { key: memorial_day,      kind: statutory }
  제헌절:          { key: constitution_day,  kind: statutory }
  광복절:          { key: gwangbokjeol,      kind: statutory }
  개천절:          { key: gaecheonjeol,      kind: statutory }
  한글날:          { key: hangeul_day,       kind: statutory }
  기독탄신일:       { key: christmas,         kind: statutory }

  # --- 음력 ---
  설날:            { key: seollal,           kind: statutory }
  추석:            { key: chuseok,           kind: statutory }
  부처님오신날:     { key: buddhas_birthday,  kind: statutory }
  석가탄신일:       { key: buddhas_birthday,  kind: statutory, note: 2015~2017 표기. 이후 "부처님오신날". }

  # --- 대체공휴일 (원인 표기 없는 옛 형식) ---
  # 2024 년경부터 "대체공휴일(설날)"처럼 괄호로 원인을 준다. 그 형식은 코드가
  # 접두어로 처리하므로 여기 적지 않는다. 아래 둘은 원인 정보가 아예 없는 형식이다.
  대체공휴일:
    key:
    kind: substitute
    note: |
      원인 공휴일 정보가 없다. caused_by_name 이 빈 문자열로 남는다.
      교차검증이 그만큼 약해진다. 원인을 알고 싶으면 직전 공휴일로 추정할 수는
      있으나 추정이므로 파서는 하지 않는다. 2015~2023 년 응답에 이 형식이 쓰인다.
  대체휴무일:
    key:
    kind: substitute
    note: 2018 년에만 쓰인 표기. 대체공휴일과 같은 것으로 본다. 원인 정보 없음.

  # --- 임시공휴일 ---
  임시공휴일:
    key:
    kind: temporary
  임시공휴일(제21대 대통령 선거):
    key:
    kind: temporary
    note: |
      괄호가 있지만 대체공휴일 형식이 아니다. 접두어가 "임시공휴일"이므로 표에
      전체 문자열을 그대로 둔다. 2025-06-03, 궐위로 인한 대통령선거일이다.

  # --- 선거일 ---
  # 회차 표기가 들쭉날쭉하다. 관측된 문자열을 전부 별칭으로 받는다.
  전국동시지방선거:
    key:
    kind: election
    note: |
      우리 쪽 이름은 "제9회 전국동시지방선거"처럼 회차가 붙는다. KASI 는 회차 없이
      준다. 이름을 대조 키로 쓰면 안 되는 대표 사례다. 대조는 날짜로 한다.
  국회의원선거일:      { key: , kind: election, note: 2016, 2028 관측 }
  국회의원선거:        { key: , kind: election, note: 2024 관측 }
  제21대 국회의원선거:  { key: , kind: election, note: 2020 관측 }

  대통령선거일:
    key:
    kind:
    by_date:
      # 이름 하나로 kind 를 정할 수 없다. 선거의 사유가 다르기 때문이다.
      # 임기만료 선거일은 제2조가 열거하는 법정공휴일(election)이고,
      # 궐위로 인한 선거일은 국무회의 의결로 지정된 임시공휴일(temporary)이다.
      # 날짜마다 사유를 확인해서 적는다. 새 날짜가 나오면 예외가 난다.
      2017-05-09: { kind: temporary, note: 제19대 대통령선거. 궐위로 인한 선거. }
      2022-03-09: { kind: election,  note: 제20대 대통령선거. 임기만료에 의한 선거. }

# ---------------------------------------------------------------------------
# 미해결
# ---------------------------------------------------------------------------
open_questions:

  - id: api-활용기간-만료
    priority: 높음
    question: |
      이 API 의 활용기간 만료일은 2028-08-08 이다.

      만료되면 인증이 거부되고 파이프라인이 멈춘다. 문제는 조용히 멈춘다는 것이다.
      피드 생성이 실패해도 이미 발행된 .ics 는 그대로 남아 있어서, 구독자 쪽에서는
      아무 일도 없어 보인다. 갱신이 끊긴 것을 아무도 모른 채 시간이 지난다.

      만료 전에 연장할 것. 그리고 만료를 사람의 기억에 맡기지 말 것.
      최소한 다음 중 하나가 필요하다.
        - 인증 실패를 빌드 실패로 올려 알림이 가게 한다
        - 발행된 피드에 마지막 갱신 시각을 넣고 오래되면 경고한다
      둘 다 아직 없다. 피드 발행 파이프라인을 만들 때 함께 넣을 것.

  - id: seq-의미
    question: |
      응답의 seq 가 1 또는 2 로 나온다. 2026 년 기준 노동절·어린이날·현충일만 2 이고
      나머지는 1 이다. 규칙이 보이지 않는다.

      의미를 모르는 값을 계산에 쓰면 안 되므로 파서는 seq 를 아예 읽지 않는다.
      같은 날짜에 항목이 둘 이상 올 때 구분자로 쓰이는지 확인이 필요하다.
      확인 전까지 locdate 를 유일 키로 다룬다.

  - id: 이름-변경-감지
    question: |
      KASI 가 기존 공휴일의 표기를 바꾸면(예: "석가탄신일" → "부처님오신날")
      새 이름이 매핑에 없어 UnmappedHolidayName 이 난다. 그것 자체는 의도한 동작이다.

      다만 그때 "새 공휴일이 생긴 것"인지 "이름만 바뀐 것"인지 구분해야 한다.
      날짜가 기존 공휴일과 같은 자리면 개명일 가능성이 높다. 판단은 사람이 한다.
      표에 옛 이름을 남겨 둘지 지울지도 그때 정할 것. 지금은 관측된 것만 둔다.
