[project]
name = "holidays-pipeline"
version = "0.1.0"
description = "공휴일 iCalendar 구독 피드 생성기"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "lunalism" }]

# v1 스켈레톤 기준 잠정 의존성. 구현 착수 시 재확인.
dependencies = [
    "httpx>=0.27",
    "icalendar>=6.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "holidays==0.102",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
# 라이브러리로 배포하지 않는 애플리케이션 레포. 빌드 백엔드 불필요.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# 픽스처의 한글 case id 를 이스케이프 없이 출력한다. -k 로 케이스를 골라 돌리기 위해 필요.
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true

# 등록되지 않은 마커를 오타로 보고 거부한다.
#
# 장식이 아니다. 발행 워크플로가 -m "not published_artifact" 로 이 마커를
# 빼고 도는데, 마커 이름이 어긋나면 그 표현식이 아무것도 걸러내지 못해
# 제외했다고 믿은 테스트가 발행 경로에서 다시 돈다. 조용히 되돌아가는
# 종류라 여기서 막는다.
addopts = "--strict-markers"
markers = [
    # 커밋된 산출물(feeds/kr.ics, status.json)을 읽는 테스트.
    #
    # 이것들은 "지금 코드가 맞나"가 아니라 "커밋된 발행본이 지금 코드로
    # 재현되나"를 묻는다. 그래서 규칙·데이터를 바꾸고 발행본을 아직
    # 갱신하지 않은 상태에서는 깨지는 것이 정상이다.
    #
    # 발행 워크플로에서는 빼고 돈다. 거기서 돌리면 낡은 발행본 때문에
    # 테스트가 깨지고, 깨져서 발행이 멈추고, 멈춰서 발행본이 갱신되지
    # 않는 교착이 된다 — 발행은 그 발행본을 갱신하러 가는 중이다.
    # 대신 PR 워크플로(.github/workflows/ci.yml)가 전부 돌린다.
    "published_artifact: 커밋된 발행본을 읽는다. 발행 워크플로에서는 제외된다.",
]
